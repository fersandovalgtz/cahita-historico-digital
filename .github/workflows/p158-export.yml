name: CHD p159 edge export

on:
  push:
    branches: [work/p158-reconciliation]
    paths:
      - '.github/workflows/p158-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export canonical p159 candidates
        run: |
          echo '---P159-BEGIN---'
          python scripts/export_candidate_page.py --page 159
          echo '---P159-END---'
