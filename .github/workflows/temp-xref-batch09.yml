name: TEMP CHD Xref Batch09

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    name: Print first Tier-C review batch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Print first eight Tier-C cases from permanent queue
        run: python scripts/export_crossreference_review_queue.py --out-dir /tmp/xrefqueue --print-next 8 --tier C_no_strong
      - name: Inspect canonical guide variants for first Tier-C batch
        run: |
          python - <<'PY'
          from scripts.export_lexicon_crossreference_graph import load_articles, normalize_guide
          from difflib import SequenceMatcher

          articles, _ = load_articles()
          targets = {
              'aspero': ['aspero'],
              'caverna': ['caverna', 'caberna'],
              'acusar': ['acusar'],
              'hartarse': ['hartarse'],
              'llenar': ['llenar'],
              'gozarse': ['gozarse', 'gozar'],
              'gozo': ['gozo'],
              'frixol_habas': ['frixol', 'habas'],
          }
          for label, needles in targets.items():
              rows=[]
              for a in articles:
                  raw=a.get('spanishGuideRaw')
                  if not raw: continue
                  norm=normalize_guide(raw)
                  substring=any(n in norm for n in needles)
                  score=max(SequenceMatcher(None, needles[0], norm).ratio(), 0)
                  if substring or score >= 0.68:
                      rows.append((not substring, -score, a['articleId'], a.get('sourcePageDigital'), a.get('column'), raw, norm, round(score,4)))
              rows.sort()
              print('VARIANT', label)
              for r in rows[:20]:
                  print('VARIANTROW', r[2:])
          PY
