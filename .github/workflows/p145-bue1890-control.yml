name: P145 BUE1890 Control

on:
  push:
    branches:
      - p145-ai-collation

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BUE1890 IA full text and inspect p145 terms
        run: |
          curl -L --fail --retry 4 -o /tmp/bue1890.txt https://archive.org/download/artedelalenguac00jesgoog/artedelalenguac00jesgoog_djvu.txt
          echo '--- metadata ---'
          wc -c /tmp/bue1890.txt
          echo '--- phrase hits ---'
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/bue1890.txt').read_text(errors='replace')
          terms=['Atole bebida','Aventar como trigo','Aventar hacer','Aventarse el vientre','Axi de los cerros','Azedarse algo','Azero','Ambre tener','Ardilla por su especie','Babear','Bazo parte interior','Bagre']
          low=t.lower()
          for term in terms:
              i=low.find(term.lower())
              print('\n###',term,'@',i)
              if i>=0: print(t[max(0,i-600):i+1400].replace('\n',' '))
          PY
