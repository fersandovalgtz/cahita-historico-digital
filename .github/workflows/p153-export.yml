name: CHD p154 edge export

on:
  push:
    branches: [work/p153-reconciliation]
    paths:
      - '.github/workflows/p153-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export canonical p154 candidates
        run: |
          echo '---P154-BEGIN---'
          python scripts/export_candidate_page.py --page 154
          echo '---P154-END---'
