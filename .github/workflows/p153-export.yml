name: CHD p153 synchronize docs

on:
  push:
    branches: [work/p153-reconciliation]
    paths:
      - '.github/workflows/p153-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p153 docs
        run: python scripts/_tmp_sync_p153.py
      - name: Validate p153 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p153_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p153_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p153_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p153_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p153_preflight.json >/dev/null
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación de p.153' -m 'Registra 46 article, 1 continuation, 4 unresolved, dos falsos negativos conocidos y fija p.154 como siguiente frente.'
          git push origin HEAD:work/p153-reconciliation
