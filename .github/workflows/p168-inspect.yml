name: CHD p168 synchronize docs

on:
  push:
    branches: [work/p168-reconciliation]
    paths:
      - '.github/workflows/p168-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p168 docs
        run: python scripts/_tmp_sync_p168.py
      - name: Validate p168 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p168_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p168_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p168_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p168_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p168_preflight.json >/dev/null
          grep -F '**32 `article`**' docs/LEXICON_PROGRESS.md
          grep -F '21 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '35 candidatos: 19 izquierda y 16 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **168** tiene sus **32 candidatos canónicos reconciliados**' README.md
          grep -F 'página 169**, con 35 candidatos canónicos —19 izquierda y 16 derecha—' README.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.168' -m 'Registra 32 article, cuatro missed-starts seleccionados, 21 pending_promotion y fija p.169=35 candidatos.'
          git push origin HEAD:work/p168-reconciliation
