name: CHD p170 synchronize docs

on:
  push:
    branches: [work/p170-reconciliation]
    paths:
      - '.github/workflows/p170-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p170 docs
        run: python scripts/_tmp_sync_p170.py
      - name: Validate p170 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p170_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p170_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p170_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p170_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p170_preflight.json >/dev/null
          grep -F '**48 `article`**' docs/LEXICON_PROGRESS.md
          grep -F '36 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '24 candidatos: 7 izquierda y 17 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **170** tiene sus **48 candidatos canónicos reconciliados**' README.md
          grep -F 'página 171**, con 24 candidatos canónicos —7 izquierda y 17 derecha—' README.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.170' -m 'Registra 48 article, tres missed-starts seleccionados, 36 pending_promotion y fija p.171=24 candidatos.'
          git push origin HEAD:work/p170-reconciliation
