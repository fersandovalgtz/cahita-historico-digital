name: CHD p170 inspection

on:
  push:
    branches: [work/p170-reconciliation]
    paths:
      - '.github/workflows/p170-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export p170 and p171 edge
        run: |
          echo '---P170-BEGIN---'
          python scripts/export_candidate_page.py --page 170
          echo '---P170-END---'
          echo 'P171 TOTAL'
          python scripts/export_candidate_page.py --page 171 --count-only
          echo 'P171 LEFT'
          python scripts/export_candidate_page.py --page 171 --column left --count-only
          echo 'P171 RIGHT'
          python scripts/export_candidate_page.py --page 171 --column right --count-only
          echo '---P171-BEGIN---'
          python scripts/export_candidate_page.py --page 171
          echo '---P171-END---'
