name: CHD p170 materialize reconciliation

on:
  push:
    branches: [work/p170-reconciliation]
    paths:
      - '.github/workflows/p170-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p170 reconciliation
        run: python scripts/_tmp_materialize_p170.py
      - name: Validate p170 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p170_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p170_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p170_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p170_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p170_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ['p170_left_reconciliation.jsonl','p170_right_reconciliation.jsonl']:
              rows += [json.loads(x) for x in Path('data/lexicon/reconciliation',name).read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==48
          assert all(r['classification']=='article' for r in rows)
          by={r['candidateId']:r for r in rows}
          assert by['ALC1737-vcand-p170-L-008']['boundaryAssessment']=='merged_articles'
          assert by['ALC1737-vcand-p170-L-008']['linkedArticleIds']==['ALC1737-art-000562','ALC1737-art-000563']
          assert by['ALC1737-vcand-p170-L-024']['boundaryAssessment']=='merged_articles'
          for cid in ['ALC1737-vcand-p170-L-004','ALC1737-vcand-p170-R-022']:
              assert by[cid]['boundaryAssessment']=='undersegmented'
          linked={aid for r in rows for aid in r.get('linkedArticleIds',[])}
          expected={f'ALC1737-art-{n:06d}' for n in [555,556,557,558,559,560,561,562,563,564,565,566,567]}
          assert linked==expected, (linked, expected)
          miss=[json.loads(x) for x in Path('data/lexicon/reconciliation/p170_missed_visible_starts.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(miss)==3
          assert {a for m in miss for a in m['linkedArticleIds']}=={f'ALC1737-art-{n:06d}' for n in [554,563,568]}
          status=json.loads(Path('data/lexicon/reconciliation/p170_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['promotion']['articleCandidatesPendingPromotion']==36
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==51
          assert status['nextPage']['candidateInventoryTotal']==24
          assert status['promotion']['corpusTotalAfterPass']==1045
          PY
      - name: Commit generated p170 evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p170_left_reconciliation.jsonl data/lexicon/reconciliation/p170_right_reconciliation.jsonl data/lexicon/reconciliation/p170_missed_visible_starts.jsonl data/lexicon/reconciliation/p170_machine_reconciliation_status.json
          git commit -m 'data: reconciliar conservadoramente p.170' -m '48 article; tres missed-starts seleccionados, L-008/L-024 merged_articles, 36 pending_promotion y borde p171 fresco.'
          git push origin HEAD:work/p170-reconciliation
