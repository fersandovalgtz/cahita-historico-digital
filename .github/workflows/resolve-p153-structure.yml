name: Resolve p153 structure

on:
  push:
    branches:
      - work/p153-structural-resolution

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply conservative structural resolution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          right_path = Path('data/lexicon/reconciliation/p153_right_reconciliation.jsonl')
          rows = [json.loads(line) for line in right_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          by_id = {r['candidateId']: r for r in rows}

          decisions = {
              'ALC1737-vcand-p153-R-003': {
                  'classification': 'continuation',
                  'boundaryAssessment': 'undersegmented',
                  'linkedArticleIds': [],
                  'articleLinkStatus': 'not_applicable',
                  'continuationType': 'from_previous_line',
                  'editorialNote': 'Continuation of selected ALC1737-art-000311 (`Dar coſas redondas, y mazizas`) whose completion opens R-003; the same OCR group then absorbs guide material from the following `Dar coſas eſtendidas como libro` article. No independent start is assigned to R-003.'
              },
              'ALC1737-vcand-p153-R-004': {
                  'classification': 'article',
                  'boundaryAssessment': 'exact',
                  'linkedArticleIds': [],
                  'articleLinkStatus': 'pending_promotion',
                  'editorialNote': 'Independent article start for the guide structurally identified as `Dar coſas eſtendidas como libro`. R-004 contains the margin start `Dar` and form-region OCR `Huecac amaca`; remaining guide text is fragmented across R-003/R-005. Exact Cahita transcription is not promoted from OCR alone.'
              },
              'ALC1737-vcand-p153-R-005': {
                  'classification': 'continuation',
                  'boundaryAssessment': 'undersegmented',
                  'linkedArticleIds': [],
                  'articleLinkStatus': 'not_applicable',
                  'continuationType': 'from_previous_line',
                  'editorialNote': 'Begins with `libro.`, completing the preceding article guide, then absorbs the extractor-missed start `Dar coſas hondas como olla` documented as ALC1737-miss-p153-R-003. No lexical object or uncertain form is promoted.'
              },
              'ALC1737-vcand-p153-R-006': {
                  'classification': 'continuation',
                  'boundaryAssessment': 'not_applicable',
                  'linkedArticleIds': [],
                  'articleLinkStatus': 'not_applicable',
                  'continuationType': 'from_previous_line',
                  'editorialNote': 'Contains only the damaged Cahita-form region for the preceding `Dar coſas hondas como olla` article; R-007 begins the fresh `Dardo` entry. Classified as continuation without promoting an OCR-derived form.'
              },
          }
          for cid, patch in decisions.items():
              row = by_id[cid]
              row.update(patch)
              row['reviewStatus'] = 'machine_corrected_unverified'
              row['humanVerified'] = False
              row['provenance'] = {
                  'derivedFrom': 'materialized canonical p153 candidate inventory; p153 selected article layer; recovered ALC1737 primary OCR sequence; p153 structural resolution record',
                  'agent': 'GPT-5.6 Sol machine reconciliation',
                  'method': 'Convergent candidate-level structural reconciliation with explicit internal missed-start modeling; no human verification and no OCR-only lexical-form promotion',
                  'processedAt': None,
              }

          right_path.write_text('\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n', encoding='utf-8')

          missed_path = Path('data/lexicon/reconciliation/p153_missed_visible_starts.jsonl')
          missed = [json.loads(line) for line in missed_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if not any(r['missedStartId'] == 'ALC1737-miss-p153-R-003' for r in missed):
              missed.append({
                  'missedStartId': 'ALC1737-miss-p153-R-003',
                  'sourceId': 'ALC1737',
                  'sourcePageDigital': 153,
                  'column': 'right',
                  'visibleStartRaw': 'Dar cofas honda, cp^ooll^',
                  'missType': 'inside_candidate_group',
                  'containingCandidateId': 'ALC1737-vcand-p153-R-005',
                  'linkedArticleIds': [],
                  'editorialNote': 'Recovered same-witness ALC1737 OCR preserves a distinct `Dar coſas hondas como olla` start in the R-005 region, but the canonical candidate inventory does not represent it independently. `visibleStartRaw` retains the OCR-damaged surface and is not a diplomatic transcription; no lexical article object is promoted.',
                  'reviewStatus': 'machine_corrected_unverified',
                  'humanVerified': False,
                  'provenance': {
                      'agent': 'GPT-5.6 Sol machine reconciliation',
                      'method': 'AI-assisted alignment of materialized p153 candidate geometry with recovered ALC1737 primary OCR sequence; internal false negative recorded without human verification or form promotion',
                      'processedAt': None,
                  },
              })
          missed_path.write_text('\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in missed) + '\n', encoding='utf-8')

          status_path = Path('data/lexicon/reconciliation/p153_machine_reconciliation_status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['pageStatus']['candidateReconciliation'] = 'complete'
          status['pageStatus']['technicalClosure'] = False
          status['candidateInventory']['classification'].update({
              'article': 47, 'continuation': 4, 'paratext': 0, 'false_positive': 0, 'unresolved': 0
          })
          status['candidateInventory']['boundaryAssessment'].update({
              'exact': 41, 'oversegmented': 1, 'undersegmented': 6,
              'merged_articles': 1, 'ambiguous': 0, 'not_applicable': 2
          })
          status['promotion']['articleCandidatesPendingPromotion'] = 35
          status['promotion']['newPromotionsThisPass'] = 0
          status['promotion']['corpusTotalAfterPass'] = 1045
          status['visibleStartEvidence']['knownVisibleStartsMinimum'] = 51
          status['visibleStartEvidence']['knownMissedStartRecords'] = 3
          status['visibleStartEvidence']['knownMergedInternalStarts'] = 1
          status['visibleStartEvidence']['reasonMetricsWithheld'] = 'Candidate reconciliation now identifies 47 article candidates plus one known internal start absorbed by merged L-005 and three demonstrated extractor misses, establishing at least 51 visible starts. The census remains non-exhaustive and no complete denominator or performance metric is asserted.'
          status['unresolvedNotes'] = []
          status['evidence']['materializedCandidateView'] = 'data/lexicon/candidates/p153_candidates.jsonl'
          status['evidence']['structuralResolutionRecord'] = 'p153_structural_resolution_2026-08-17.json'
          status['evidence']['recoveredPrimaryOcrSequenceUsed'] = True
          status['evidence']['newInternalMissedStartRecorded'] = 'ALC1737-miss-p153-R-003'
          status['evidence']['policy'] = 'The R-003–R-006 Dar-region is resolved structurally from canonical geometry, selected anchors and same-witness ALC1737 OCR sequence. OCR is used to establish order and boundary identity only; uncertain Cahita forms are not promoted and visible-start coverage remains non-exhaustive.'
          status['physicalContinuities'] = [
              x for x in status.get('physicalContinuities', [])
              if not (x.get('from') == 'ALC1737-vcand-p153-R-002' and x.get('to') == 'ALC1737-vcand-p153-R-003')
          ] + [
              {
                  'from': 'ALC1737-vcand-p153-R-002',
                  'to': 'ALC1737-vcand-p153-R-003',
                  'type': 'article_to_continuation',
                  'note': 'Selected `Dar coſas redondas, y mazizas` begins R-002 and completes at the opening of R-003.'
              },
              {
                  'from': 'ALC1737-vcand-p153-R-003',
                  'to': 'ALC1737-vcand-p153-R-004',
                  'type': 'mixed_group_to_article_start',
                  'note': 'R-003 absorbs guide material associated with the fresh R-004 start `Dar coſas eſtendidas como libro`.'
              },
              {
                  'from': 'ALC1737-vcand-p153-R-005',
                  'to': 'ALC1737-vcand-p153-R-006',
                  'type': 'missed_start_to_form_continuation',
                  'note': 'R-005 contains the extractor-missed `Dar coſas hondas como olla` start; R-006 preserves its form-region continuation.'
              }
          ]
          status['resolvedThisPass'] = [
              'R-003 is continuation/undersegmented: it closes selected article 000311 and absorbs guide material from the next article.',
              'R-004 is an exact article start for structurally identified `Dar coſas eſtendidas como libro`; it remains pending_promotion and no OCR-derived Cahita form is promoted.',
              'R-005 is continuation/undersegmented and contains a newly documented extractor false negative, ALC1737-miss-p153-R-003, for `Dar coſas hondas como olla`.',
              'R-006 is continuation/not_applicable containing only the damaged form region of the preceding article before fresh R-007 `Dardo`.'
          ]
          status['reviewStatus'] = 'machine_corrected_unverified'
          status['humanVerified'] = False
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          left_path = Path('data/lexicon/reconciliation/p153_left_reconciliation.jsonl')
          all_rows = [json.loads(line) for line in left_path.read_text(encoding='utf-8').splitlines() if line.strip()] + rows
          assert len(all_rows) == 51, len(all_rows)
          classes = {}
          boundaries = {}
          for r in all_rows:
              classes[r['classification']] = classes.get(r['classification'], 0) + 1
              boundaries[r['boundaryAssessment']] = boundaries.get(r['boundaryAssessment'], 0) + 1
          assert classes == {'article': 47, 'continuation': 4}, classes
          assert boundaries.get('exact', 0) == 41, boundaries
          assert boundaries.get('oversegmented', 0) == 1, boundaries
          assert boundaries.get('undersegmented', 0) == 6, boundaries
          assert boundaries.get('merged_articles', 0) == 1, boundaries
          assert boundaries.get('ambiguous', 0) == 0, boundaries
          assert boundaries.get('not_applicable', 0) == 2, boundaries
          assert sum(boundaries.values()) == 51, boundaries
          assert len(missed) == 3, len(missed)
          assert status['promotion']['articleCandidatesPendingPromotion'] == 35
          assert status['promotion']['newPromotionsThisPass'] == 0
          assert status['promotion']['corpusTotalAfterPass'] == 1045
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum'] == 51
          assert status['visibleStartEvidence']['exhaustive'] is False
          assert status['humanVerified'] is False
          PY
      - name: Run repository-native prechecks
        run: |
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p153_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p153_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p153_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p153_structural_resolution_2026-08-17.json >/dev/null
      - name: Commit structural reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/reconciliation/p153_right_reconciliation.jsonl data/lexicon/reconciliation/p153_machine_reconciliation_status.json data/lexicon/reconciliation/p153_missed_visible_starts.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: resolver bloque Dar R-003–R-006 en p.153"
          git push
