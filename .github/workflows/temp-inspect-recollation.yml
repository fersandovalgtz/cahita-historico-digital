name: TEMP inspect recollation queue

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Print all recollation cases
        run: python scripts/export_crossreference_recollation_queue.py --output-dir /tmp/recollation --print-next 22
