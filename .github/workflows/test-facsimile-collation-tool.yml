name: Test facsimile collation tool

on:
  push:
    branches:
      - work/facsimile-collation-tool

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa python3-pil >/dev/null
      - name: Prepare p177 collation workspace
        run: |
          python scripts/prepare_facsimile_collation.py \
            --ia-id artedelalenguaca00gonz \
            --pdf-page 177 \
            --out-dir .tmp_facsimile/p177 \
            --language spa \
            --dpi 420 > /tmp/p177-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/p177-manifest.json').read_text())
          assert d['pdfPage']==177
          assert d['render']['dpi']==420
          assert len(d['ocr']['passes'])==6
          assert len(d['sourcePagePdf']['sha256'])==64
          print('page_sha256='+d['sourcePagePdf']['sha256'])
          print('pdf_derivative='+d['internetArchive']['pdfDerivative'])
          print('pixel_size='+str(d['render']['pixelSize']))
          PY
      - name: Print OCR ensemble for review
        run: |
          for f in .tmp_facsimile/p177/*_psm*.txt; do
            echo "===== ${f##*/} ====="
            cat "$f"
            echo
          done
      - name: Verify temporary outputs remain ignored
        run: |
          test -z "$(git status --porcelain -- .tmp_facsimile/)"
