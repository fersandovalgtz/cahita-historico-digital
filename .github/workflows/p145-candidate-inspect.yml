name: P145 Candidate Inspect

on:
  push:
    branches:
      - p145-preflight

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical inventory
        run: python scripts/reconstruct_candidate_inventory.py
      - name: Export p145 candidates
        run: python scripts/export_candidate_page.py --page 145
