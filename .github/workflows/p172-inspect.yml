name: CHD p172 materialize reconciliation

on:
  push:
    branches: [work/p172-reconciliation]
    paths:
      - '.github/workflows/p172-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p172 reconciliation
        run: python scripts/_tmp_materialize_p172.py
      - name: Validate p172 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p172_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p172_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p172_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p172_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p172_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ['p172_left_reconciliation.jsonl','p172_right_reconciliation.jsonl']:
              rows += [json.loads(x) for x in Path('data/lexicon/reconciliation',name).read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==55 and all(r['classification']=='article' for r in rows)
          by={r['candidateId']:r for r in rows}
          assert by['ALC1737-vcand-p172-R-028']['boundaryAssessment']=='merged_articles'
          linked={aid for r in rows for aid in r.get('linkedArticleIds',[])}
          assert linked=={f'ALC1737-art-{n:06d}' for n in range(585,599)}
          miss=[json.loads(x) for x in Path('data/lexicon/reconciliation/p172_missed_visible_starts.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(miss)==1 and miss[0]['linkedArticleIds']==['ALC1737-art-000584']
          status=json.loads(Path('data/lexicon/reconciliation/p172_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['promotion']['articleCandidatesPendingPromotion']==41
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==56
          assert status['nextPage']['candidateInventoryTotal']==42
          assert status['promotion']['corpusTotalAfterPass']==1045
          PY
      - name: Commit generated p172 evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p172_left_reconciliation.jsonl data/lexicon/reconciliation/p172_right_reconciliation.jsonl data/lexicon/reconciliation/p172_missed_visible_starts.jsonl data/lexicon/reconciliation/p172_machine_reconciliation_status.json
          git commit -m 'data: reconciliar conservadoramente p.172' -m '55 article; 000584 como missed-start superior, R-028 merged_articles, 41 pending_promotion y borde p173 fresco.'
          git push origin HEAD:work/p172-reconciliation
