name: CHD p171 synchronize docs

on:
  push:
    branches: [work/p171-reconciliation]
    paths:
      - '.github/workflows/p171-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p171 docs
        run: python scripts/_tmp_sync_p171.py
      - name: Validate synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p171_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p171_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p171_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p171_machine_reconciliation_status.json >/dev/null
          grep -F '**23 `article`** y **1 `continuation`**' docs/LEXICON_PROGRESS.md
          grep -F '16 `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '55 candidatos: 27 izquierda y 28 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **171** tiene sus **24 candidatos canónicos reconciliados**' README.md
          grep -F 'página 172**, con 55 candidatos canónicos —27 izquierda y 28 derecha—' README.md
      - name: Commit synchronized docs
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.171'
          git push origin HEAD:work/p171-reconciliation
