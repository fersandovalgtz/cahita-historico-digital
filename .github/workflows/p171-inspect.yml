name: CHD p171 materialize reconciliation

on:
  push:
    branches: [work/p171-reconciliation]
    paths:
      - '.github/workflows/p171-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p171 reconciliation
        run: python scripts/_tmp_materialize_p171.py
      - name: Validate p171 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p171_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p171_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p171_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p171_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p171_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ['p171_left_reconciliation.jsonl','p171_right_reconciliation.jsonl']:
              rows += [json.loads(x) for x in Path('data/lexicon/reconciliation',name).read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==24
          cls={k:sum(r['classification']==k for r in rows) for k in ['article','continuation','unresolved','paratext','false_positive']}
          assert cls=={'article':23,'continuation':1,'unresolved':0,'paratext':0,'false_positive':0}, cls
          by={r['candidateId']:r for r in rows}
          assert by['ALC1737-vcand-p171-L-007']['boundaryAssessment']=='merged_articles'
          assert by['ALC1737-vcand-p171-R-001']['classification']=='continuation'
          assert by['ALC1737-vcand-p171-R-001']['continuationType']=='from_previous_column'
          for cid in ['ALC1737-vcand-p171-R-003','ALC1737-vcand-p171-R-017']:
              assert by[cid]['boundaryAssessment']=='merged_articles'
          assert by['ALC1737-vcand-p171-R-015']['boundaryAssessment']=='ambiguous'
          for cid in ['ALC1737-vcand-p171-L-004','ALC1737-vcand-p171-L-005']:
              assert by[cid]['boundaryAssessment']=='undersegmented'
          linked={aid for r in rows for aid in r.get('linkedArticleIds',[])}
          expected={f'ALC1737-art-{n:06d}' for n in [569,570,571,572,573,574,575,576,580,581,582]}
          assert linked==expected, (linked, expected)
          miss=[json.loads(x) for x in Path('data/lexicon/reconciliation/p171_missed_visible_starts.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(miss)==8
          assert {a for m in miss for a in m['linkedArticleIds']}=={f'ALC1737-art-{n:06d}' for n in range(576,584)}
          status=json.loads(Path('data/lexicon/reconciliation/p171_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['promotion']['articleCandidatesPendingPromotion']==16
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==31
          assert status['nextPage']['candidateInventoryTotal']==55
          assert status['promotion']['corpusTotalAfterPass']==1045
          PY
      - name: Commit generated p171 evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p171_left_reconciliation.jsonl data/lexicon/reconciliation/p171_right_reconciliation.jsonl data/lexicon/reconciliation/p171_missed_visible_starts.jsonl data/lexicon/reconciliation/p171_machine_reconciliation_status.json
          git commit -m 'data: reconciliar conservadoramente p.171' -m '24 candidatos: 23 article y 1 continuation transcolumna; L-007 megagrupo con ocho missed-starts seleccionados, 16 pending_promotion y borde p172 fresco.'
          git push origin HEAD:work/p171-reconciliation
