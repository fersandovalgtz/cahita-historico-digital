name: CHD p163 synchronize docs

on:
  push:
    branches: [work/p163-reconciliation]
    paths:
      - '.github/workflows/p163-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p163 docs
        run: python scripts/_tmp_sync_p163.py
      - name: Validate p163 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p163_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p163_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p163_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p163_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p163_preflight.json >/dev/null
          grep -F '42 `article` y 7 `continuation`' README.md
          grep -F '28 fronteras `pending_promotion`' README.md
          grep -F 'página 164**, con 51 candidatos canónicos —29 izquierda y 22 derecha—' README.md
          grep -F '42 `article`' docs/LEXICON_PROGRESS.md
          grep -F '28 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '51 candidatos canónicos: 29 izquierda y 22 derecha' docs/LEXICON_PROGRESS.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.163' -m 'Registra 42 article, 7 continuation, falso negativo Mozo de edad, 28 pending_promotion y fija p.164=51 candidatos como siguiente frente.'
          git push origin HEAD:work/p163-reconciliation
