name: CHD p154 synchronize docs

on:
  push:
    branches: [work/p154-reconciliation]
    paths:
      - '.github/workflows/p154-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p154 docs
        run: python scripts/_tmp_sync_p154.py
      - name: Validate p154 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p154_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p154_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p154_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p154_preflight.json >/dev/null
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación de p.154' -m 'Registra 56 article, 41 pending_promotion, continuidad R-029→p155 L-001 y fija p.155 como siguiente frente.'
          git push origin HEAD:work/p154-reconciliation
