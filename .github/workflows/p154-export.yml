name: CHD p154 materialize reconciliation

on:
  push:
    branches: [work/p154-reconciliation]
    paths:
      - '.github/workflows/p154-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate p154 reconciliation layers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          links = {
            'L-001':'ALC1737-art-000314','L-002':'ALC1737-art-000315','L-003':'ALC1737-art-000316',
            'L-005':'ALC1737-art-000317','L-006':'ALC1737-art-000318','L-007':'ALC1737-art-000319',
            'L-008':'ALC1737-art-000320','L-012':'ALC1737-art-000321','L-015':'ALC1737-art-000322',
            'L-016':'ALC1737-art-000323','L-017':'ALC1737-art-000324','L-018':'ALC1737-art-000325',
            'L-019':'ALC1737-art-000326','R-016':'ALC1737-art-000327','R-020':'ALC1737-art-000328'
          }
          provenance = {
            'derivedFrom':'canonical-v0.2 candidate inventory; p154 selected article layer where linked; p153 and p155 candidate layers for page-edge context',
            'agent':'GPT-5.6 Sol machine reconciliation',
            'method':'AI-assisted structural reconciliation from canonical geometry/OCR and pre-existing selected direct-collation anchors; no independent human verification',
            'processedAt':None
          }

          def rec(side,n):
            key=f'{side}-{n:03d}'
            cid=f'ALC1737-vcand-p154-{key}'
            linked=links.get(key)
            assessment='exact'
            note='Aligned to selected direct-collation article anchor.' if linked else 'Distinct lexical start; retained pending because raw OCR alone is not a sufficient transcription anchor for promotion.'
            if key=='R-008':
              note='Structurally distinct D-entry candidate with severely degraded OCR (`D e v rg a ...`). Independent margin geometry supports an article start, but the lexical transcription remains too weak for promotion.'
            elif key=='R-024':
              assessment='undersegmented'
              note='Distinct `Doler la llaga` article start. After a complete-looking form, the candidate absorbs trailing `B emela` material before fresh R-025 `Doncella`; the extra text is preserved without inventing a new article start.'
            elif key=='R-029':
              assessment='oversegmented'
              note='Distinct `Durar mucho tiempo` article start split by the page edge. p155 L-001 contains form-only continuation `nuc. bibuatua.` before the next lexical starts.'
            return {
              'candidateId':cid,'sourceId':'ALC1737','sourcePageDigital':154,
              'column':'left' if side=='L' else 'right','classification':'article',
              'boundaryAssessment':assessment,'linkedArticleIds':[linked] if linked else [],
              'articleLinkStatus':'linked' if linked else 'pending_promotion','editorialNote':note,
              'reviewStatus':'machine_corrected_unverified','humanVerified':False,'provenance':provenance
            }

          out=Path('data/lexicon/reconciliation')
          for side,count,filename in [('L',27,'p154_left_reconciliation.jsonl'),('R',29,'p154_right_reconciliation.jsonl')]:
            rows=[rec(side,i) for i in range(1,count+1)]
            (out/filename).write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in rows)+'\n',encoding='utf-8')

          status={
            'sourceId':'ALC1737','sourcePageDigital':154,
            'pageStatus':{'candidateReconciliation':'complete','visibleStartCensus':'not_exhaustive','promotionLinkage':'partial','technicalClosure':False,'humanVerificationPlanned':False},
            'candidateInventory':{'total':56,'left':27,'right':29,'classification':{'article':56,'continuation':0,'paratext':0,'false_positive':0,'unresolved':0},'boundaryAssessment':{'exact':54,'oversegmented':1,'undersegmented':1,'merged_articles':0,'ambiguous':0,'not_applicable':0}},
            'selectedLayer':{'preExistingArticles':15,'articleIdRange':['ALC1737-art-000314','ALC1737-art-000328'],'articleCandidateRecordsLinked':15,'structuredArticlesLinked':15,'selectedArticlesUnlinked':0},
            'promotion':{'articleCandidatesPendingPromotion':41,'newPromotionsThisPass':0,'corpusTotalAfterPass':1045},
            'visibleStartEvidence':{'exhaustive':False,'knownVisibleStartsMinimum':56,'knownMissedStartRecords':0,'precision':None,'recall':None,'f1':None,'reasonMetricsWithheld':'All 56 canonical candidates are structurally consistent with lexical starts, but the selected anchor layer is non-exhaustive and cannot prove absence of additional missed starts. No performance denominator is asserted.'},
            'physicalContinuities':[
              {'from':'ALC1737-vcand-p153-R-026','to':'ALC1737-vcand-p154-L-001','type':'catchword_to_article','note':'p153 trailing `Desbat-` anticipates fresh p154 `Desbaſtar madera. Atapetia.`.'},
              {'from':'ALC1737-vcand-p154-R-029','to':'ALC1737-vcand-p155-L-001','type':'article_continuation','note':'`Durar mucho tiempo` begins on p154 R-029 and continues as form-only text `nuc. bibuatua.` on p155 L-001.'}
            ],
            'structuralNotes':[
              'R-008 has severely degraded OCR but independent geometry supports an article start; it remains pending promotion.',
              'R-024 absorbs trailing unexplained material and is marked undersegmented without creating an additional start.'
            ],
            'evidence':{'canonicalCandidateInventoryVerified':True,'canonicalCandidateInventoryCount':2072,'selectedP154LayerUsedAsAnchor':True,'p153AndP155CandidateLayersUsedForPageEdges':True,'directFacsimileAvailableThisPass':False,'policy':'Boundary structure is kept separate from lexical transcription quality. Textually damaged candidates may remain structural article starts while their lexical content stays unpromoted.'},
            'reviewStatus':'machine_corrected_unverified','humanVerified':False
          }
          (out/'p154_machine_reconciliation_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate generated reconciliation
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p154_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p154_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p154_machine_reconciliation_status.json >/dev/null
      - name: Commit generated evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p154_left_reconciliation.jsonl data/lexicon/reconciliation/p154_right_reconciliation.jsonl data/lexicon/reconciliation/p154_machine_reconciliation_status.json
          git commit -m 'data: reconciliar estructuralmente p.154' -m '56/56 candidatos clasificados article; 15 anclas enlazadas, 41 pending_promotion, R-024 undersegmented y R-029 cruzando a p155 L-001.'
          git push origin HEAD:work/p154-reconciliation
