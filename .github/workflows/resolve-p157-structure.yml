name: Resolve p157 structure

on:
  push:
    branches:
      - work/p157-structural-resolution

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply conservative structural resolution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          left_path = Path('data/lexicon/reconciliation/p157_left_reconciliation.jsonl')
          rows = [json.loads(line) for line in left_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          by_id = {r['candidateId']: r for r in rows}

          l3 = by_id['ALC1737-vcand-p157-L-003']
          l3.update({
              'classification': 'continuation',
              'boundaryAssessment': 'not_applicable',
              'linkedArticleIds': [],
              'articleLinkStatus': 'not_applicable',
              'continuationType': 'from_previous_line',
              'editorialNote': 'Continuation of the extractor-missed `Eſtender, ò tender. Buſca deſenvolver` article whose start is absorbed inside L-002. Same-witness OCR preserves the guide at the end of L-002 and `deſenvolver` in L-003; no independent start is assigned to L-003.',
              'reviewStatus': 'machine_corrected_unverified',
              'humanVerified': False,
          })
          l3['provenance'] = {
              'derivedFrom': 'materialized canonical p157 candidate inventory; recovered ALC1737 primary OCR sequence; p157 selected anchors; p157 structural resolution record',
              'agent': 'GPT-5.6 Sol machine reconciliation',
              'method': 'Convergent cropped-edge structural reconciliation with explicit internal missed-start modeling; no human verification or OCR-only lexical-form promotion',
              'processedAt': None,
          }

          l6 = by_id['ALC1737-vcand-p157-L-006']
          l6.update({
              'classification': 'continuation',
              'boundaryAssessment': 'undersegmented',
              'linkedArticleIds': [],
              'articleLinkStatus': 'not_applicable',
              'continuationType': 'from_previous_line',
              'editorialNote': 'Begins with `le, Tobare;`, completing the Eſtera article begun at L-004/L-005, then absorbs the extractor-missed start `Eſteril ſer la muger`. Terminal `Ahinque` is treated as reading-order leakage associated with the following Eſtirar region rather than as authority for an Eſteril form.',
              'reviewStatus': 'machine_corrected_unverified',
              'humanVerified': False,
          })
          l6['provenance'] = {
              'derivedFrom': 'materialized canonical p157 candidate inventory; recovered ALC1737 primary OCR sequence; p157 selected anchors; p157 structural resolution record',
              'agent': 'GPT-5.6 Sol machine reconciliation',
              'method': 'Convergent cropped-edge structural reconciliation of continuation plus absorbed article start; no human verification or OCR-only lexical-form promotion',
              'processedAt': None,
          }
          left_path.write_text('\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n', encoding='utf-8')

          missed_path = Path('data/lexicon/reconciliation/p157_missed_visible_starts.jsonl')
          missed = [json.loads(line) for line in missed_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          additions = [
              {
                  'missedStartId': 'ALC1737-miss-p157-L-005',
                  'sourceId': 'ALC1737',
                  'sourcePageDigital': 157,
                  'column': 'left',
                  'visibleStartRaw': '.{tender, 6 tender. Bufcd',
                  'missType': 'inside_candidate_group',
                  'containingCandidateId': 'ALC1737-vcand-p157-L-002',
                  'linkedArticleIds': [],
                  'editorialNote': 'Same-witness ALC1737 OCR preserves this damaged start for the article structurally identified as `Eſtender, ò tender`; L-003 continues it with `deſenvolver`. The OCR surface is retained as non-diplomatic evidence and no lexical object/form is promoted.',
                  'reviewStatus': 'machine_corrected_unverified',
                  'humanVerified': False,
                  'provenance': {
                      'agent': 'GPT-5.6 Sol machine reconciliation',
                      'method': 'AI-assisted alignment of materialized p157 candidate geometry with recovered ALC1737 primary OCR sequence; internal false negative recorded without human verification or text promotion',
                      'processedAt': None,
                  },
              },
              {
                  'missedStartId': 'ALC1737-miss-p157-L-006',
                  'sourceId': 'ALC1737',
                  'sourcePageDigital': 157,
                  'column': 'left',
                  'visibleStartRaw': ';fteril fer la mügér¿ T¿Ji/¿.',
                  'missType': 'inside_candidate_group',
                  'containingCandidateId': 'ALC1737-vcand-p157-L-006',
                  'linkedArticleIds': [],
                  'editorialNote': 'Same-witness ALC1737 OCR preserves a distinct start structurally identified as `Eſteril ſer la muger` inside L-006 after the Eſtera continuation. The OCR surface is retained as non-diplomatic evidence; the damaged Cahita form is not promoted.',
                  'reviewStatus': 'machine_corrected_unverified',
                  'humanVerified': False,
                  'provenance': {
                      'agent': 'GPT-5.6 Sol machine reconciliation',
                      'method': 'AI-assisted alignment of materialized p157 candidate geometry with recovered ALC1737 primary OCR sequence; internal false negative recorded without human verification or text promotion',
                      'processedAt': None,
                  },
              },
          ]
          known = {r['missedStartId'] for r in missed}
          for record in additions:
              if record['missedStartId'] not in known:
                  missed.append(record)
          missed_path.write_text('\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in missed) + '\n', encoding='utf-8')

          status_path = Path('data/lexicon/reconciliation/p157_machine_reconciliation_status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          original_gap = json.dumps(status['sourceGap'], ensure_ascii=False, sort_keys=True)
          status['pageStatus']['candidateReconciliation'] = 'complete'
          status['pageStatus']['technicalClosure'] = False
          status['candidateInventory']['classification'].update({
              'article': 38, 'continuation': 4, 'paratext': 0, 'false_positive': 0, 'unresolved': 0
          })
          status['candidateInventory']['boundaryAssessment'].update({
              'exact': 31, 'oversegmented': 2, 'undersegmented': 2,
              'merged_articles': 4, 'ambiguous': 0, 'not_applicable': 3
          })
          status['promotion']['articleCandidatesPendingPromotion'] = 27
          status['promotion']['newPromotionsThisPass'] = 0
          status['promotion']['corpusTotalAfterPass'] = 1045
          status['visibleStartEvidence']['knownVisibleStartsMinimum'] = 44
          status['visibleStartEvidence']['knownMissedStartRecords'] = 6
          status['visibleStartEvidence']['knownMergedInternalStarts'] = 4
          status['visibleStartEvidence']['unresolvedCandidateRecords'] = 0
          status['visibleStartEvidence']['reasonMetricsWithheld'] = 'The 38 article candidates, four previously documented selected starts absorbed inside merged candidates, and two additional same-witness OCR starts (`Eſtender, ò tender` and `Eſteril ſer la muger`) establish at least 44 visible starts. The cropped edge and non-exhaustive selected layer prevent a complete denominator; no performance metric is asserted.'
          status['physicalContinuities'] = [
              x for x in status.get('physicalContinuities', [])
              if not (x.get('from') == 'ALC1737-vcand-p157-L-004' and x.get('to') == 'ALC1737-vcand-p157-L-005')
          ] + [
              {
                  'from': 'ALC1737-vcand-p157-L-002',
                  'to': 'ALC1737-vcand-p157-L-003',
                  'type': 'missed_start_to_continuation',
                  'note': 'L-002 absorbs the start `Eſtender, ò tender`; L-003 preserves its `deſenvolver` continuation.'
              },
              {
                  'from': 'ALC1737-vcand-p157-L-004',
                  'to': 'ALC1737-vcand-p157-L-005',
                  'type': 'article_continuation',
                  'note': 'The Eſtera article continues across L-004→L-005.'
              },
              {
                  'from': 'ALC1737-vcand-p157-L-005',
                  'to': 'ALC1737-vcand-p157-L-006',
                  'type': 'article_continuation_then_internal_start',
                  'note': 'L-006 first completes Eſtera (`...de tule, Tobare`) and then absorbs the distinct `Eſteril ſer la muger` start.'
              },
              {
                  'from': 'ALC1737-vcand-p157-L-012',
                  'to': 'ALC1737-vcand-p157-L-013',
                  'type': 'article_continuation',
                  'note': 'Selected `Eſtrella las tres Marias. Himuim.` continues into L-013.'
              }
          ]
          status['structuralNotes'] = [
              'The left scan edge remains cropped, producing systematic loss of initial glyphs and some reading-order leakage; structural decisions therefore do not strengthen uncertain lexical forms.',
              'L-003 is resolved as continuation of an `Eſtender, ò tender` start absorbed inside L-002; the start is recorded as ALC1737-miss-p157-L-005.',
              'L-006 is resolved as continuation/undersegmented: it closes Eſtera and absorbs the `Eſteril ſer la muger` start recorded as ALC1737-miss-p157-L-006.',
              'Four selected internal starts remain recorded as known false negatives inside merged candidates; the two new records add non-selected but same-witness-supported internal starts.',
              'The p157→158 discontinuity remains ALC1737-gap-0001, a source gap rather than a normal page continuation; no missing F/G material is reconstructed.'
          ]
          status['evidence']['materializedCandidateView'] = 'data/lexicon/candidates/p157_candidates.jsonl'
          status['evidence']['structuralResolutionRecord'] = 'p157_structural_resolution_2026-08-17.json'
          status['evidence']['recoveredPrimaryOcrSequenceUsed'] = True
          status['evidence']['newInternalMissedStartsRecorded'] = [
              'ALC1737-miss-p157-L-005', 'ALC1737-miss-p157-L-006'
          ]
          status['evidence']['sourceGapPreserved'] = True
          status['evidence']['policy'] = 'Cropped-edge candidate structure may be resolved when canonical geometry and same-witness OCR sequence converge. OCR remains non-diplomatic; uncertain Cahita forms are not promoted, and ALC1737-gap-0001 is isolated from candidate reconciliation.'
          status['resolvedThisPass'] = [
              'L-003 is continuation/not_applicable of the extractor-missed `Eſtender, ò tender. Buſca deſenvolver` article whose start is absorbed inside L-002.',
              'L-006 is continuation/undersegmented: it completes Eſtera and absorbs a distinct `Eſteril ſer la muger` start; terminal `Ahinque` is treated as reading-order leakage toward the following Eſtirar region rather than an Eſteril form.',
              'Two additional internal extractor misses are recorded without lexical promotion: ALC1737-miss-p157-L-005 and ALC1737-miss-p157-L-006.'
          ]
          status['reviewStatus'] = 'machine_corrected_unverified'
          status['humanVerified'] = False
          assert json.dumps(status['sourceGap'], ensure_ascii=False, sort_keys=True) == original_gap
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          right_path = Path('data/lexicon/reconciliation/p157_right_reconciliation.jsonl')
          all_rows = rows + [json.loads(line) for line in right_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(all_rows) == 42, len(all_rows)
          classes = {}
          boundaries = {}
          for r in all_rows:
              classes[r['classification']] = classes.get(r['classification'], 0) + 1
              boundaries[r['boundaryAssessment']] = boundaries.get(r['boundaryAssessment'], 0) + 1
          assert classes == {'article': 38, 'continuation': 4}, classes
          assert boundaries.get('exact', 0) == 31, boundaries
          assert boundaries.get('oversegmented', 0) == 2, boundaries
          assert boundaries.get('undersegmented', 0) == 2, boundaries
          assert boundaries.get('merged_articles', 0) == 4, boundaries
          assert boundaries.get('ambiguous', 0) == 0, boundaries
          assert boundaries.get('not_applicable', 0) == 3, boundaries
          assert sum(boundaries.values()) == 42, boundaries
          assert len(missed) == 6, len(missed)
          assert status['promotion']['articleCandidatesPendingPromotion'] == 27
          assert status['promotion']['newPromotionsThisPass'] == 0
          assert status['promotion']['corpusTotalAfterPass'] == 1045
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum'] == 44
          assert status['visibleStartEvidence']['exhaustive'] is False
          assert status['humanVerified'] is False
          PY
      - name: Run repository-native prechecks
        run: |
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p157_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p157_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p157_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p157_structural_resolution_2026-08-17.json >/dev/null
      - name: Commit structural reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/reconciliation/p157_left_reconciliation.jsonl data/lexicon/reconciliation/p157_machine_reconciliation_status.json data/lexicon/reconciliation/p157_missed_visible_starts.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: resolver L-003 y L-006 en p.157"
          git push
