name: CHD p162 candidate inspection

on:
  push:
    branches: [work/p162-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export canonical p162 and p163 candidates
        run: |
          echo '---P162-BEGIN---'
          python scripts/export_candidate_page.py --page 162
          echo '---P162-END---'
          echo '---P163-BEGIN---'
          python scripts/export_candidate_page.py --page 163
          echo '---P163-END---'
