name: CHD p161 candidate inspection

on:
  push:
    branches: [work/p161-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export canonical p161 and p162 candidates
        run: |
          echo '---P161-BEGIN---'
          python scripts/export_candidate_page.py --page 161
          echo '---P161-END---'
          echo '---P162-BEGIN---'
          python scripts/export_candidate_page.py --page 162
          echo '---P162-END---'
