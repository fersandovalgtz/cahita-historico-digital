name: CHD p162 correction audit

on:
  push:
    branches: [work/p162-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export p162 right candidates and selected anchors
        run: |
          echo '---P162-RIGHT---'
          python scripts/export_candidate_page.py --page 162 --column right
          echo '---SELECTED-000447-000448---'
          grep -E 'ALC1737-art-000447|ALC1737-art-000448' data/lexicon/articles/p162_selected_articles.jsonl
          echo '---STATUS---'
          cat data/lexicon/reconciliation/p162_machine_reconciliation_status.json
