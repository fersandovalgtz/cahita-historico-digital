name: CHD p163 count audit

on:
  push:
    branches: [work/p162-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Count canonical p163 candidates
        run: |
          python scripts/export_candidate_page.py --page 163 --count-only
          echo LEFT
          python scripts/export_candidate_page.py --page 163 --column left --count-only
          echo RIGHT
          python scripts/export_candidate_page.py --page 163 --column right --count-only
