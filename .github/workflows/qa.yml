name: CHD p159 candidate inspection

on:
  push:
    branches: [work/p159-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export canonical p159 candidates and p160 opening
        shell: bash
        run: |
          echo '---P159-BEGIN---'
          python scripts/export_candidate_page.py --page 159
          echo '---P159-END---'
          echo '---P160-OPENING-BEGIN---'
          python scripts/export_candidate_page.py --page 160 | head -n 4
          echo '---P160-OPENING-END---'
