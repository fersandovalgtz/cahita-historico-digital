name: CHD p162 synchronize docs

on:
  push:
    branches: [work/p162-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p162 docs
        run: python scripts/_tmp_sync_p162.py
      - name: Validate p162 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p162_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p162_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p162_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p162_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p162_preflight.json >/dev/null
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.162' -m 'Registra 38 article, 1 unresolved, Memoria como falso negativo interno, 24 pending_promotion y fija p.163 (45 candidatos) como siguiente frente.'
          git push origin HEAD:work/p162-reconciliation
