name: CHD p162 corrected materialization

on:
  push:
    branches: [work/p162-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize corrected p162 reconciliation
        run: python scripts/_tmp_materialize_p162.py
      - name: Validate corrected p162 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p162_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p162_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p162_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p162_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p162_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          right=[json.loads(x) for x in Path('data/lexicon/reconciliation/p162_right_reconciliation.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by={r['candidateId']:r for r in right}
          assert by['ALC1737-vcand-p162-R-011']['classification']=='article'
          assert by['ALC1737-vcand-p162-R-016']['linkedArticleIds']==['ALC1737-art-000448']
          assert by['ALC1737-vcand-p162-R-014']['linkedArticleIds']==[]
          assert by['ALC1737-vcand-p162-R-019']['boundaryAssessment']=='undersegmented'
          status=json.loads(Path('data/lexicon/reconciliation/p162_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['candidateInventory']['classification']['article']==39
          assert status['candidateInventory']['classification']['unresolved']==0
          assert status['promotion']['articleCandidatesPendingPromotion']==25
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==40
          PY
      - name: Commit corrected evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p162_left_reconciliation.jsonl data/lexicon/reconciliation/p162_right_reconciliation.jsonl data/lexicon/reconciliation/p162_missed_visible_starts.jsonl data/lexicon/reconciliation/p162_machine_reconciliation_status.json data/lexicon/reconciliation/p162_preflight.json
          git commit -m 'data: corregir y reconciliar p.162' -m '39 article, 0 unresolved; L-006 Melon+Memoria merged, R-006/R-019 undersegmented, 000448 alineado a R-016, 25 pending_promotion y reclamo Mozo preservado.'
          git push origin HEAD:work/p162-reconciliation
