name: CHD QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate corpus and reproducibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify canonical candidate inventory
        run: python scripts/reconstruct_candidate_inventory.py

      - name: Validate lexical article IDs and authority states
        run: python scripts/validate_lexicon_ids.py

      - name: Validate historical lexical articles against schema
        shell: bash
        run: |
          set -euo pipefail
          for file in data/lexicon/articles/*.jsonl; do
            python scripts/validate_jsonl.py --schema schemas/lexical-article.schema.json --jsonl "$file"
          done

      - name: Validate candidate reconciliation batches
        shell: bash
        run: |
          set -euo pipefail
          files=(
            data/lexicon/reconciliation/p133_p134_batch01.jsonl
            data/lexicon/reconciliation/p133_batch02_pending_articles.jsonl
            data/lexicon/reconciliation/p134_batch02a_pending_articles.jsonl
            data/lexicon/reconciliation/p134_batch02b_pending_articles.jsonl
            data/lexicon/reconciliation/p133_opening_resolution.jsonl
            data/lexicon/reconciliation/p135_candidate_linkage_overlay.jsonl
            data/lexicon/reconciliation/p136_reconciliation.jsonl
            data/lexicon/reconciliation/p*_left_reconciliation*.jsonl
            data/lexicon/reconciliation/p*_right_reconciliation*.jsonl
          )
          for file in "${files[@]}"; do
            python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl "$file"
          done

      - name: Validate missed-start layers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/lexicon/reconciliation/*missed*start*.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo 'No missed-start layers found' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl "$file"
          done

      - name: Validate core JSON metadata syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool data/lexicon/candidates/inventory_status.json >/dev/null
          python -m json.tool data/lexicon/candidates/candidate_inventory_manifest.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p133_p134_visible_start_census.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/phase2_open_work_summary.json >/dev/null

          shopt -s nullglob
          status_files=(
            data/lexicon/reconciliation/*_reconciliation_status.json
            data/lexicon/reconciliation/p*_machine_reconciliation_status.json
            data/lexicon/reconciliation/p*_preflight.json
          )
          if (( ${#status_files[@]} == 0 )); then
            echo 'No reconciliation status/preflight JSON files found' >&2
            exit 1
          fi
          for file in "${status_files[@]}"; do
            python -m json.tool "$file" >/dev/null
          done

          phase2_evidence_files=(
            data/lexicon/reconciliation/p*_phase2_*.json
            data/lexicon/reconciliation/p*_control_evidence_*.json
          )
          if (( ${#phase2_evidence_files[@]} == 0 )); then
            echo 'No phase-II evidence/triage JSON files found' >&2
            exit 1
          fi
          for file in "${phase2_evidence_files[@]}"; do
            python -m json.tool "$file" >/dev/null
          done

          python -m json.tool data/lexicon/provenance/p135_art000704_correction.json >/dev/null
          python -m json.tool data/lexicon/provenance/p137_art000729_correction.json >/dev/null
          python -m json.tool data/lexicon/provenance/p137_art000731_correction.json >/dev/null
          python -m json.tool data/lexicon/provenance/p137_p138_art000734_continuation.json >/dev/null
          python -m json.tool data/lexicon/provenance/p138_selected_recollation_corrections.json >/dev/null
          python -m json.tool data/lexicon/provenance/p143_selected_recollation_corrections.json >/dev/null
          python -m json.tool data/lexicon/provenance/p144_selected_recollation_corrections.json >/dev/null
          python -m json.tool data/lexicon/review/boundary_algorithm_comparison.json >/dev/null
          python -m json.tool data/source/control/bue1890.json >/dev/null
          python -m json.tool data/source/control/bnf1737_reported_witness.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('data/lexicon/provenance/p159_column_metadata_corrections.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  json.loads(line)
          PY

      - name: Validate Phase II promotion queue invariants
        run: python scripts/validate_phase2_promotion_queues.py

      - name: Verify Phase II open-work summary is current
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          python scripts/summarize_open_lexicon_work.py --output "$tmp"
          diff -u data/lexicon/reconciliation/phase2_open_work_summary.json "$tmp"

      - name: Validate documentation synchronization
        run: python scripts/validate_documentation_sync.py

      - name: Validate deterministic post-closure exports
        run: python scripts/validate_postclosure_exports.py

      - name: Validate source-based cross-reference reviews
        run: python scripts/validate_crossreference_source_reviews.py

      - name: Validate Lo miſmo formula reviews
        run: python scripts/validate_lo_mismo_reviews.py

      - name: Validate experimental TEI lexical projection
        run: python scripts/validate_tei_export.py

      - name: Validate deterministic grammar concordance
        run: python scripts/validate_grammar_exports.py
