name: CHD p161 synchronize docs

on:
  push:
    branches: [work/p161-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p161 docs
        run: python scripts/_tmp_sync_p161.py
      - name: Validate p161 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p161_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p161_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p161_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p161_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p161_preflight.json >/dev/null
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.161' -m 'Registra 31 article, 1 continuation, 1 unresolved, tres falsos negativos seleccionados y fija p.162 (39 candidatos) como siguiente frente.'
          git push origin HEAD:work/p161-reconciliation
