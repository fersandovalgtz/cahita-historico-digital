name: CHD p160 candidate inspection

on:
  push:
    branches: [work/p160-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export p160 and p161 opening
        run: |
          echo '---P160-BEGIN---'
          python scripts/export_candidate_page.py --page 160
          echo '---P160-END---'
          echo '---P161-BEGIN---'
          python scripts/export_candidate_page.py --page 161
          echo '---P161-END---'
