name: CHD p159 column metadata correction

on:
  push:
    branches: [work/p159-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply audited p159 column correction
        run: python scripts/_tmp_correct_p159_columns.py
      - name: Validate corrected package
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_jsonl.py --schema schemas/lexical-article.schema.json --jsonl data/lexicon/articles/p159_selected_articles.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p159_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p159_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p159_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p159_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('data/lexicon/provenance/p159_column_metadata_corrections.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip(): json.loads(line)
          PY
      - name: Commit correction and provenance
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/articles/p159_selected_articles.jsonl data/lexicon/provenance/p159_column_metadata_corrections.jsonl data/lexicon/reconciliation/p159_left_reconciliation.jsonl data/lexicon/reconciliation/p159_machine_reconciliation_status.json data/lexicon/reconciliation/p159_preflight.json README.md docs/LEXICON_PROGRESS.md
          git commit -m 'data: corregir columnas seleccionadas 000398–000400' -m 'Corrige right→left con evidencia geométrica canónica y procedencia dedicada; no cambia transcripción, tipo de artículo ni formas históricas.'
          git push origin HEAD:work/p159-reconciliation
