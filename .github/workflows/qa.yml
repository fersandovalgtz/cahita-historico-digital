name: CHD p159 count

on:
  push:
    branches: [work/p158-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Count canonical p159 candidates
        run: |
          python scripts/export_candidate_page.py --page 159 --count-only
          echo 'LEFT'
          python scripts/export_candidate_page.py --page 159 --column left --count-only
          echo 'RIGHT'
          python scripts/export_candidate_page.py --page 159 --column right --count-only
