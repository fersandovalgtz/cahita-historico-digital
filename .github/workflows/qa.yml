name: CHD p158 materialize reconciliation

on:
  push:
    branches: [work/p158-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p158 reconciliation
        run: python scripts/_tmp_materialize_p158.py
      - name: Validate generated p158 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p158_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p158_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p158_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p158_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p158_preflight.json >/dev/null
      - name: Commit generated evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p158_left_reconciliation.jsonl data/lexicon/reconciliation/p158_right_reconciliation.jsonl data/lexicon/reconciliation/p158_missed_visible_starts.jsonl data/lexicon/reconciliation/p158_machine_reconciliation_status.json
          git commit -m 'data: reconciliar conservadoramente p.158' -m '53 candidatos: 50 article y 3 continuation; L-014 merged_articles, un falso negativo seleccionado, 36 pending_promotion y transición H post-gap preservada.'
          git push origin HEAD:work/p158-reconciliation
