name: CHD p160 synchronize docs

on:
  push:
    branches: [work/p160-reconciliation]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p160 docs
        run: python scripts/_tmp_sync_p160.py
      - name: Validate p160 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p160_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p160_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p160_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p160_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p160_preflight.json >/dev/null
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.160' -m 'Registra 44 article, 1 continuation, Ladrona como falso negativo conocido, 30 pending_promotion y fija p.161 (33 candidatos) como siguiente frente.'
          git push origin HEAD:work/p160-reconciliation
