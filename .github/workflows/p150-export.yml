name: CHD p150 synchronize docs and QA

on:
  push:
    branches: [work/p150-reconciliation]
    paths:
      - '.github/workflows/p150-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p150 documentation and extend QA coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          progress = Path('docs/LEXICON_PROGRESS.md')
          text = progress.read_text(encoding='utf-8')
          text = text.replace(
            'Las páginas **145–149 tienen reconciliación completa de sus candidatos canónicos**, pero permanecen abiertas para censo exhaustivo de inicios visibles y promoción de fronteras sin transcripción suficientemente sustentada. La **p.150 tiene preflight reproducible abierto sobre 56 candidatos canónicos y 15 artículos seleccionados preexistentes**.',
            'Las páginas **145–150 tienen reconciliación completa de sus candidatos canónicos**, pero permanecen abiertas para censo exhaustivo de inicios visibles y promoción de fronteras sin transcripción suficientemente sustentada.'
          )
          old_section = '''## Página 150 — preflight reproducible

La página digital **150** contiene **56 candidatos canónicos: 26 izquierda y 30 derecha**. La capa seleccionada preexistente contiene **15 artículos `ALC1737-art-000254`–`ALC1737-art-000268`**, distribuidos en 10 anclas de la columna izquierda y 5 de la derecha. La capa es explícitamente no exhaustiva y no se usa como expectativa de cobertura.

El borde p.149→150 queda fijado sin sobreinterpretación: `p149_machine_reconciliation_status.json` ya había establecido que el material dañado de p.149 R-030 no justifica una continuidad larga. P.150 L-001 abre un artículo nuevo, `ALC1737-art-000254`, **`Carcel. Tequiloacari.`**. Los otros catorce artículos seleccionados quedan registrados como anclas pendientes de alineación con los candidatos canónicos completos.

Entre las anclas seleccionadas de p.150 hay dos objetos cuyo tipo sigue siendo `unresolved`: `ALC1737-art-000266` (`Cobrar lo que ſe debe. Lo miſmo.`) y `ALC1737-art-000267` (`Cobre metal. Lo miſmo.`). El preflight no fortalece esas anáforas ni propone referentes sin evidencia suficiente.

`data/lexicon/reconciliation/p150_preflight.json` fija geometría, anclas, contexto de borde y límites de evidencia. No declara todavía clasificación completa de los 56 candidatos, promociones, censo visible, TP/FP/FN ni F1.
'''
          new_section = '''## Página 150 — reconciliación de candidatos completada

La página digital **150** contiene **56 candidatos canónicos: 26 izquierda y 30 derecha**. La reconciliación machine-only clasifica **55 `article`** y **1 `unresolved`**, sin candidatos `continuation`, `paratext` o `false_positive`. La calidad de frontera se distribuye en **54 `exact`**, **1 `undersegmented`** y **1 `ambiguous`**.

La capa seleccionada preexistente contiene **15 artículos `ALC1737-art-000254`–`ALC1737-art-000268`**; los quince quedaron enlazados a candidatos canónicos. Las dos anáforas históricas seleccionadas `ALC1737-art-000266` (`Cobrar lo que ſe debe. Lo miſmo.`) y `ALC1737-art-000267` (`Cobre metal. Lo miſmo.`) mantienen su microestructura semántica `unresolved`, aunque sus fronteras físicas estén alineadas.

El único candidato estructuralmente irresuelto es **R-023**, en la región `Colgar algo` / `Colmar`: el OCR intercala material dañado y no permite decidir de forma responsable si se trata de continuación, ruido de layout o un inicio adicional. No se impone microsegmentación. L-026 inicia un artículo al pie de la columna izquierda y continúa físicamente en material no representado de la parte superior derecha antes de R-001; permanece sin promoción. R-030 inicia un artículo `Como...` pero absorbe además un `Com-` de borde/reclamo; p.151 L-001 abre un candidato fresco `Compadecerſe`, por lo que no se afirma una continuidad larga p.150→151.

Quedan **40 candidatos de artículo `pending_promotion`**. No hubo promociones nuevas y el corpus permanece en **1,045 artículos**. El censo visible no se declara exhaustivo: se conocen al menos 55 inicios candidatos de artículo, pero R-023 y la ausencia de un denominador facsimilar exhaustivo impiden calcular TP/FP/FN, precisión, recall o F1. `p150_machine_reconciliation_status.json` conserva estas decisiones y sus límites de evidencia.
'''
          if old_section not in text:
            raise SystemExit('Expected p150 preflight section not found')
          text = text.replace(old_section, new_section)
          old_next = '''En p.145 quedan **20 `pending_promotion`** y 3 `unresolved`; en p.146, **22 `pending_promotion`**; en p.147, **36 `pending_promotion`**; en p.148, **29 `pending_promotion`**; y en p.149, **40 `pending_promotion`** y 1 `unresolved`. Las páginas 145–149 tienen reconciliación de candidatos completa, pero no un censo visible exhaustivo.

El frente geométrico activo es ahora la **página digital 150**: inspeccionar los 56 candidatos canónicos, alinear los 15 artículos seleccionados, clasificar cada frontera, modelar continuidades internas y entre columnas, detectar falsos positivos y posibles inicios visibles omitidos, y promover sólo entradas sustentadas más allá del OCR dañado. Hasta que p.145 complete censo visible y promoción, el corpus sigue publicando **1,045 artículos estructurados** y **pp.133–144** como último tramo técnicamente cerrado.'''
          new_next = '''En p.145 quedan **20 `pending_promotion`** y 3 `unresolved`; en p.146, **22 `pending_promotion`**; en p.147, **36 `pending_promotion`**; en p.148, **29 `pending_promotion`**; en p.149, **40 `pending_promotion`** y 1 `unresolved`; y en p.150, **40 `pending_promotion`** y 1 candidato estructural `unresolved`. Las páginas 145–150 tienen reconciliación de candidatos completa, pero no un censo visible exhaustivo.

El siguiente frente geométrico es la **página digital 151**, con **50 candidatos canónicos: 23 izquierda y 27 derecha**. Hasta que p.145 complete censo visible y promoción, el corpus sigue publicando **1,045 artículos estructurados** y **pp.133–144** como último tramo técnicamente cerrado.'''
          if old_next not in text:
            raise SystemExit('Expected next-front block not found')
          progress.write_text(text.replace(old_next, new_next), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
            '- la página **150** tiene **preflight reproducible completo** sobre sus **56 candidatos canónicos** (26 izquierda, 30 derecha) y 15 artículos seleccionados `ALC1737-art-000254`–`000268` usados únicamente como anclas; su reconciliación exhaustiva no se declara todavía iniciada;',
            '- la página **150** tiene sus **56 candidatos canónicos reconciliados**: 55 `article` y 1 `unresolved`; los 15 artículos seleccionados `ALC1737-art-000254`–`000268` quedaron enlazados, permanecen 40 fronteras `pending_promotion` y el censo visible todavía no es exhaustivo;'
          )
          text = text.replace(
            'Las páginas 145–149 tienen reconciliación de candidatos completa, pero sus censos visibles aún no se consideran exhaustivos. El frente geométrico activo es la **página 150**: inspeccionar sus 56 candidatos canónicos, alinear los 15 artículos seleccionados, clasificar cada frontera y promover sólo objetos cuya evidencia exceda el OCR dañado.',
            'Las páginas 145–150 tienen reconciliación de candidatos completa, pero sus censos visibles aún no se consideran exhaustivos. El siguiente frente geométrico es la **página 151**, con 50 candidatos canónicos; se mantendrá la misma separación entre frontera estructural confirmada, promoción curatorial e incertidumbre textual.'
          )
          readme.write_text(text, encoding='utf-8')

          qa = Path('.github/workflows/qa.yml')
          text = qa.read_text(encoding='utf-8')
          marker = '            data/lexicon/reconciliation/p144_right_reconciliation.jsonl; do\n'
          replacement = '''            data/lexicon/reconciliation/p144_right_reconciliation.jsonl \\
            data/lexicon/reconciliation/p145_left_reconciliation.jsonl \\
            data/lexicon/reconciliation/p145_right_reconciliation.jsonl \\
            data/lexicon/reconciliation/p146_left_reconciliation.jsonl \\
            data/lexicon/reconciliation/p146_right_reconciliation.jsonl \\
            data/lexicon/reconciliation/p147_left_reconciliation.jsonl \\
            data/lexicon/reconciliation/p147_right_reconciliation.jsonl \\
            data/lexicon/reconciliation/p148_left_reconciliation.jsonl \\
            data/lexicon/reconciliation/p148_right_reconciliation.jsonl \\
            data/lexicon/reconciliation/p149_left_reconciliation.jsonl \\
            data/lexicon/reconciliation/p149_right_reconciliation.jsonl \\
            data/lexicon/reconciliation/p150_left_reconciliation.jsonl \\
            data/lexicon/reconciliation/p150_right_reconciliation.jsonl; do
'''
          if marker not in text:
            raise SystemExit('QA reconciliation marker not found')
          text = text.replace(marker, replacement)
          marker = '            data/lexicon/reconciliation/p144_missed_visible_starts.jsonl; do\n'
          replacement = '''            data/lexicon/reconciliation/p144_missed_visible_starts.jsonl \\
            data/lexicon/reconciliation/p146_missed_visible_starts.jsonl; do
'''
          if marker not in text:
            raise SystemExit('QA missed-start marker not found')
          text = text.replace(marker, replacement)
          marker = '          python -m json.tool data/lexicon/reconciliation/p144_reconciliation_status.json >/dev/null\n'
          replacement = '''          python -m json.tool data/lexicon/reconciliation/p144_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p145_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p146_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p147_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p148_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p149_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p150_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p150_preflight.json >/dev/null
'''
          if marker not in text:
            raise SystemExit('QA JSON marker not found')
          qa.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY
      - name: Validate newly covered layers
        run: |
          python -m pip install -r requirements-dev.txt
          for file in \
            data/lexicon/reconciliation/p145_left_reconciliation.jsonl \
            data/lexicon/reconciliation/p145_right_reconciliation.jsonl \
            data/lexicon/reconciliation/p146_left_reconciliation.jsonl \
            data/lexicon/reconciliation/p146_right_reconciliation.jsonl \
            data/lexicon/reconciliation/p147_left_reconciliation.jsonl \
            data/lexicon/reconciliation/p147_right_reconciliation.jsonl \
            data/lexicon/reconciliation/p148_left_reconciliation.jsonl \
            data/lexicon/reconciliation/p148_right_reconciliation.jsonl \
            data/lexicon/reconciliation/p149_left_reconciliation.jsonl \
            data/lexicon/reconciliation/p149_right_reconciliation.jsonl \
            data/lexicon/reconciliation/p150_left_reconciliation.jsonl \
            data/lexicon/reconciliation/p150_right_reconciliation.jsonl; do
            python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl "$file"
          done
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p146_missed_visible_starts.jsonl
          for file in data/lexicon/reconciliation/p14{5,6,7,8,9}_machine_reconciliation_status.json data/lexicon/reconciliation/p150_machine_reconciliation_status.json; do
            python -m json.tool "$file" >/dev/null
          done
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
      - name: Commit synchronized state
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md .github/workflows/qa.yml
          git commit -m 'docs: cerrar reconciliación de p.150 y ampliar QA' -m 'Sincroniza el estado público a 55 article + 1 unresolved en p.150, fija p.151 como siguiente frente y extiende CHD QA para validar reconciliaciones machine-only de p.145–150.'
          git push origin HEAD:work/p150-reconciliation
