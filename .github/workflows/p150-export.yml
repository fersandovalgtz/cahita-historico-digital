name: CHD p150 materialize reconciliation

on:
  push:
    branches: [work/p150-reconciliation]
    paths:
      - '.github/workflows/p150-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate p150 reconciliation layers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          linked = {
            'L-001':'ALC1737-art-000254', 'L-002':'ALC1737-art-000255', 'L-003':'ALC1737-art-000256',
            'L-005':'ALC1737-art-000257', 'L-007':'ALC1737-art-000258', 'L-010':'ALC1737-art-000259',
            'L-011':'ALC1737-art-000260', 'L-015':'ALC1737-art-000261', 'L-018':'ALC1737-art-000262',
            'L-020':'ALC1737-art-000263', 'R-001':'ALC1737-art-000264', 'R-004':'ALC1737-art-000265',
            'R-011':'ALC1737-art-000266', 'R-012':'ALC1737-art-000267', 'R-029':'ALC1737-art-000268'
          }
          provenance = {
            'derivedFrom':'canonical-v0.2 candidate inventory; p150 selected article layer where linked; p149 and p151 candidate layers for page-edge context',
            'agent':'GPT-5.6 Sol machine reconciliation',
            'method':'AI-assisted structural reconciliation from canonical geometry/OCR and pre-existing selected anchors; no independent human verification',
            'processedAt':None
          }

          def record(side, n):
            key = f'{side}-{n:03d}'
            cid = f'ALC1737-vcand-p150-{key}'
            column = 'left' if side == 'L' else 'right'
            if key == 'R-023':
              return {
                'candidateId':cid, 'sourceId':'ALC1737', 'sourcePageDigital':150, 'column':column,
                'classification':'unresolved', 'boundaryAssessment':'ambiguous', 'linkedArticleIds':[],
                'articleLinkStatus':'not_applicable',
                'editorialNote':'OCR interleaves damaged material between the `Colgar algo` and `Colmar` region. The available machine evidence does not establish whether this candidate is continuation text, layout noise, or an additional lexical start; no microsegmentation is imposed.',
                'reviewStatus':'unresolved', 'humanVerified':False, 'provenance':provenance
              }
            article_id = linked.get(key)
            assessment = 'undersegmented' if key == 'R-030' else 'exact'
            if article_id:
              note = f'Aligned to selected article {article_id}.'
            else:
              note = 'Distinct lexical start; retained pending because raw OCR alone is not a sufficient transcription anchor for promotion.'
            if key == 'L-026':
              note = 'Distinct lexical start near the bottom of the left column; its hyphenated text continues physically into unrepresented top-right material before R-001. Retained pending because the exact lexical transcription is not sufficiently anchored.'
            if key == 'R-030':
              note = 'Starts a distinct `Como...` article but also absorbs trailing `Com-` page-edge/catchword material. P.151 L-001 begins a fresh `Compadecerſe` candidate, so no long article continuation p150→p151 is asserted.'
            return {
              'candidateId':cid, 'sourceId':'ALC1737', 'sourcePageDigital':150, 'column':column,
              'classification':'article', 'boundaryAssessment':assessment,
              'linkedArticleIds':[article_id] if article_id else [],
              'articleLinkStatus':'linked' if article_id else 'pending_promotion',
              'editorialNote':note, 'reviewStatus':'machine_corrected_unverified',
              'humanVerified':False, 'provenance':provenance
            }

          out = Path('data/lexicon/reconciliation')
          for side, count, filename in [('L',26,'p150_left_reconciliation.jsonl'),('R',30,'p150_right_reconciliation.jsonl')]:
            rows = [record(side, i) for i in range(1, count + 1)]
            (out / filename).write_text('\n'.join(json.dumps(r, ensure_ascii=False) for r in rows) + '\n', encoding='utf-8')

          status = {
            'sourceId':'ALC1737', 'sourcePageDigital':150,
            'pageStatus':{
              'candidateReconciliation':'complete_with_explicit_unresolved', 'visibleStartCensus':'not_exhaustive',
              'promotionLinkage':'partial', 'technicalClosure':False, 'humanVerificationPlanned':False
            },
            'candidateInventory':{
              'total':56, 'left':26, 'right':30,
              'classification':{'article':55,'continuation':0,'paratext':0,'false_positive':0,'unresolved':1},
              'boundaryAssessment':{'exact':54,'oversegmented':0,'undersegmented':1,'merged_articles':0,'ambiguous':1,'not_applicable':0}
            },
            'selectedLayer':{
              'preExistingArticles':15, 'articleIdRange':['ALC1737-art-000254','ALC1737-art-000268'],
              'articleCandidateRecordsLinked':15, 'structuredArticlesLinked':15, 'selectedArticlesUnlinked':0
            },
            'promotion':{'articleCandidatesPendingPromotion':40,'newPromotionsThisPass':0,'corpusTotalAfterPass':1045},
            'visibleStartEvidence':{
              'exhaustive':False, 'knownVisibleStartsMinimum':55, 'knownMissedStartRecords':0,
              'precision':None, 'recall':None, 'f1':None,
              'reasonMetricsWithheld':'Candidate reconciliation identifies 55 article starts and one unresolved candidate. The selected anchor layer is not exhaustive and cannot prove absence of additional missed starts, including within damaged OCR; no performance denominator is asserted.'
            },
            'physicalContinuities':[
              {'from':'ALC1737-vcand-p149-R-030','to':'ALC1737-vcand-p150-L-001','type':'page_edge_context','note':'p149 R-030 absorbs damaged bottom material; p150 L-001 is the fresh selected `Carcel` article, so no long p149→p150 article continuation is asserted.'},
              {'from':'ALC1737-vcand-p150-L-026','to':'p150:right-top-unrepresented','type':'cross_column_article_continuation','note':'L-026 ends hyphenated at the left-column bottom and continues physically into unrepresented top-right material before R-001; the exact lexical transcription remains unpromoted.'},
              {'from':'ALC1737-vcand-p150-R-030','to':'ALC1737-vcand-p151-L-001','type':'page_edge_context','note':'R-030 contains a complete `Como...` start plus trailing `Com-` catchword/page-edge material. p151 L-001 begins a fresh `Compadecerſe` candidate; no long article continuation is asserted.'}
            ],
            'unresolvedNotes':['R-023 remains unresolved because OCR interleaves damaged material between the `Colgar algo` and `Colmar` region; the evidence does not establish continuation, layout noise, or an additional lexical start.'],
            'evidence':{
              'canonicalCandidateInventoryVerified':True, 'canonicalCandidateInventoryCount':2072,
              'selectedP150LayerUsedAsAnchor':True, 'p149AndP151CandidateLayersUsedForPageEdges':True,
              'directFacsimileAvailableThisPass':False,
              'policy':'Structural decisions may be closed from convergent machine evidence; ambiguous boundary microstructure remains unresolved and uncertain lexical text is not strengthened.'
            },
            'reviewStatus':'machine_corrected_unverified', 'humanVerified':False
          }
          (out / 'p150_machine_reconciliation_status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate generated reconciliation
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p150_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p150_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p150_machine_reconciliation_status.json >/dev/null
      - name: Commit generated evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p150_left_reconciliation.jsonl data/lexicon/reconciliation/p150_right_reconciliation.jsonl data/lexicon/reconciliation/p150_machine_reconciliation_status.json
          git commit -m 'data: reconciliar estructuralmente p.150' -m '56/56 candidatos: 55 article, 1 unresolved; 15 anclas enlazadas, 40 pending_promotion, bordes p149→150 y p150→151 modelados sin métricas prematuras.'
          git push origin HEAD:work/p150-reconciliation
