name: P145 Facsimile Extract

on:
  push:
    branches:
      - p145-ai-collation

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Download canonical working facsimile
        run: |
          curl -L --fail --retry 3 -o /tmp/cahita.pdf https://archive.org/download/artedelalenguaca00gonz/artedelalenguaca00gonz.pdf
          echo "69ccbe5da1d0834d78ea3957dcc79e64bd4fe165a1a7133ae408e5a656160e37  /tmp/cahita.pdf" | sha256sum -c -
      - name: Extract digital pages 144-146 at 300 dpi
        run: |
          mkdir -p facsimile
          pdftoppm -f 144 -l 146 -r 300 -png /tmp/cahita.pdf facsimile/p >/dev/null 2>&1
          ls -lh facsimile
      - name: Upload facsimile pages
        uses: actions/upload-artifact@v4
        with:
          name: p145-facsimile-context
          path: facsimile/*.png
          retention-days: 1
