name: Sync p157 progress

on:
  push:
    branches:
      - docs/p157-progress-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale p157 progress section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/LEXICON_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## Página 157 —')
          end = text.index('## Página 158 —', start)
          lines = [
              '## Página 157 — reconciliación estructural completada',
              '',
              'La página digital **157** contiene **42 candidatos canónicos: 19 izquierda y 23 derecha**. La clasificación machine-only queda en **38 `article` y 4 `continuation`**, sin candidatos `unresolved`, `paratext` o `false_positive`. La calidad de frontera se distribuye en **31 `exact`**, **2 `oversegmented`**, **2 `undersegmented`**, **4 `merged_articles`** y **3 `not_applicable`**; ya no queda ninguna frontera `ambiguous`.',
              '',
              'La capa seleccionada preexistente conserva **15 artículos `ALC1737-art-000359`–`ALC1737-art-000373`**. Once candidatos enlazan los quince objetos estructurados y cuatro regiones `merged_articles` contienen comienzos seleccionados internos. La zona izquierda continúa afectada por recorte del borde, pérdida de glifos iniciales y leakage del orden de lectura; por ello la resolución estructural no convierte lecturas OCR dañadas en transcripción diplomática.',
              '',
              'Los antiguos candidatos irresueltos **L-003 y L-006** quedaron resueltos. L-003 es `continuation / not_applicable` del artículo `Eſtender, ò tender. Buſca deſenvolver`, cuyo inicio fue absorbido dentro de L-002. L-006 es `continuation / undersegmented`: comienza cerrando `Eſtera` (`...de tule, Tobare`) y luego absorbe un comienzo independiente `Eſteril ſer la muger`; el `Ahinque` terminal se trata como leakage hacia la región siguiente `Eſtirar`, no como autoridad para una forma de `Eſteril`.',
              '',
              'Se añadieron **dos falsas negativas internas**: `ALC1737-miss-p157-L-005` para el inicio OCR dañado de `Eſtender, ò tender` dentro de L-002 y `ALC1737-miss-p157-L-006` para `Eſteril ſer la muger` dentro de L-006. Con ellas, p.157 conserva **6 missed-start records**. Ninguno crea por sí mismo un artículo lexicográfico nuevo y sus superficies OCR se documentan como evidencia no diplomática.',
              '',
              'Quedan **27 candidatos de artículo `pending_promotion`**. No hubo promociones nuevas y el corpus permanece en **1,045 artículos**. Se conocen al menos **44 inicios visibles**, pero `visibleStartEvidence.exhaustive=false`; el recorte del borde y la capa seleccionada no exhaustiva impiden un denominador completo, por lo que no se calculan precisión, recall ni F1.',
              '',
              'El salto documental **`ALC1737-gap-0001` entre p.157 y p.158 permanece intacto**: después de `Flecha. Huihua.` y del reclamo `Fle...`, la siguiente página digital abre con material de H. Su extensión sigue `unresolved` y el proyecto no reconstruye ni sintetiza las entradas F/G ausentes desde BUE1890, diccionarios modernos u otras fuentes. `p157_structural_resolution_2026-08-17.json` y `p157_machine_reconciliation_status.json` conservan el detalle, trazabilidad y guardas epistemológicas. La reconciliación candidate-level está completa, pero `technicalClosure=false` y `humanVerified=false` porque siguen pendientes promoción/enlace y un censo visible exhaustivo.',
              '',
          ]
          path.write_text(text[:start] + '\n'.join(lines) + '\n' + text[end:], encoding='utf-8')
          PY
      - name: Sanity check
        run: |
          grep -F '38 `article` y 4 `continuation`' docs/LEXICON_PROGRESS.md
          grep -F '27 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F 'ALC1737-gap-0001' docs/LEXICON_PROGRESS.md
          grep -F 'ALC1737-miss-p157-L-006' docs/LEXICON_PROGRESS.md
          python scripts/reconstruct_candidate_inventory.py
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LEXICON_PROGRESS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sincronizar estado de p.157"
          git push
