name: CHD p157 candidate export

on:
  push:
    branches: [work/p157-reconciliation]
    paths:
      - '.github/workflows/p157-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export canonical p157 candidates
        run: |
          echo '---P157-BEGIN---'
          python scripts/export_candidate_page.py --page 157
          echo '---P157-END---'
