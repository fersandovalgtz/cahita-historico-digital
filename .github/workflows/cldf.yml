name: CHD CLDF

on:
  pull_request:
    paths:
      - ".github/workflows/cldf.yml"
      - "requirements-cldf.txt"
      - "scripts/generate_cldf_dictionary.py"
      - "scripts/validate_cldf_dictionary.py"
      - "CLDF.md"
      - "Makefile"
      - "data/lexicon/articles/**"
      - "data/source/alc1737/metadata.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cldf.yml"
      - "requirements-cldf.txt"
      - "scripts/generate_cldf_dictionary.py"
      - "scripts/validate_cldf_dictionary.py"
      - "CLDF.md"
      - "Makefile"
      - "data/lexicon/articles/**"
      - "data/source/alc1737/metadata.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate CLDF Dictionary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cldf.txt

      - name: Install pinned CLDF tooling
        run: python -m pip install -r requirements-cldf.txt

      - name: Compile CLDF tools
        run: python -m py_compile scripts/generate_cldf_dictionary.py scripts/validate_cldf_dictionary.py

      - name: Generate CLDF Dictionary projection
        run: python scripts/generate_cldf_dictionary.py --output "${RUNNER_TEMP}/chd-cldf"

      - name: Validate CLDF standard conformance
        run: cldf validate "${RUNNER_TEMP}/chd-cldf/Dictionary-metadata.json"

      - name: Validate CHD mapping fidelity and authority invariants
        run: python scripts/validate_cldf_dictionary.py --cldf-dir "${RUNNER_TEMP}/chd-cldf"

      - name: Inspect CLDF statistics
        run: cldf stats "${RUNNER_TEMP}/chd-cldf/Dictionary-metadata.json"

      - name: Upload validated CLDF build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cahita-historico-digital-cldf-${{ github.sha }}
          path: ${{ runner.temp }}/chd-cldf/
          if-no-files-found: error
          retention-days: 14
