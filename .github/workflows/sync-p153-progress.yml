name: Sync p153 progress

on:
  push:
    branches:
      - docs/p153-progress-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale p153 progress section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/LEXICON_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## Página 153 —')
          end = text.index('## Página 154 —', start)
          lines = [
              '## Página 153 — reconciliación estructural completada',
              '',
              'La página digital **153** contiene **51 candidatos canónicos: 25 izquierda y 26 derecha**. La clasificación machine-only queda en **47 `article` y 4 `continuation`**, sin candidatos `unresolved`, `paratext` o `false_positive`. La calidad de frontera se distribuye en **41 `exact`**, **1 `oversegmented`**, **6 `undersegmented`**, **1 `merged_articles`** y **2 `not_applicable`**; ya no queda ninguna frontera `ambiguous`.',
              '',
              'La capa seleccionada preexistente conserva **15 artículos `ALC1737-art-000299`–`ALC1737-art-000313`**. Doce candidatos enlazan 15 objetos estructurados; L-005 mantiene el caso `merged_articles` que contiene los inicios seleccionados 000302 y 000303. Los dos falsos negativos del borde superior derecho ya conocidos permanecen registrados como `ALC1737-miss-p153-R-001` y `ALC1737-miss-p153-R-002`.',
              '',
              'El antiguo bloque irresuelto **R-003–R-006** quedó descompuesto estructuralmente. R-003 es `continuation / undersegmented`: completa `Dar coſas redondas, y mazizas` y absorbe material de la guía siguiente. R-004 es un inicio `article / exact` para la guía estructuralmente identificada como `Dar coſas eſtendidas como libro`, todavía `pending_promotion`. R-005 es `continuation / undersegmented`: comienza con `libro.` y absorbe el inicio que el extractor omitió para `Dar coſas hondas como olla`. R-006 es `continuation / not_applicable` y conserva sólo la región cahíta dañada de ese artículo antes del inicio fresco `Dardo` en R-007.',
              '',
              'La falsa negativa interna se documenta como **`ALC1737-miss-p153-R-003`**. Su `visibleStartRaw` conserva deliberadamente la superficie OCR dañada y no se presenta como transcripción diplomática. El OCR primario de ALC1737 se usa para establecer la secuencia y las fronteras; ninguna forma incierta se promueve a la capa lexicográfica.',
              '',
              'Quedan **35 candidatos de artículo `pending_promotion`**. No hubo promociones nuevas y el corpus permanece en **1,045 artículos**. Se conocen al menos **51 inicios visibles** —47 candidatos de artículo, un inicio interno en L-005 y tres `missed-start records`—, pero `visibleStartEvidence.exhaustive=false`; no se calculan precisión, recall ni F1.',
              '',
              'El salto **p.157→158** y otros problemas de fuente posteriores se mantienen separados de esta página; p.153 no introduce reconstrucciones de material ausente. `p153_structural_resolution_2026-08-17.json` y `p153_machine_reconciliation_status.json` conservan el detalle, la trazabilidad y las guardas epistemológicas. La reconciliación candidate-level está completa, pero `technicalClosure=false` y `humanVerified=false` porque siguen pendientes promoción/enlace y un censo visible exhaustivo.',
              '',
          ]
          path.write_text(text[:start] + '\n'.join(lines) + '\n' + text[end:], encoding='utf-8')
          PY
      - name: Sanity check
        run: |
          grep -F '47 `article` y 4 `continuation`' docs/LEXICON_PROGRESS.md
          grep -F '35 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F 'ALC1737-miss-p153-R-003' docs/LEXICON_PROGRESS.md
          python scripts/reconstruct_candidate_inventory.py
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LEXICON_PROGRESS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sincronizar estado de p.153"
          git push
