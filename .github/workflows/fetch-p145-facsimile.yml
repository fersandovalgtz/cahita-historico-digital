name: Fetch p145 facsimile window

on:
  push:
    branches:
      - work/p145-facsimile-collation

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch temporary Internet Archive page images
        run: |
          mkdir -p .tmp_facsimile/p145_window
          for n in $(seq 140 150); do
            url="https://archive.org/download/artedelalenguaca00gonz/page/n${n}_w1600.jpg"
            echo "$url"
            curl --fail --location --retry 3 --retry-delay 2 "$url" -o ".tmp_facsimile/p145_window/n${n}.jpg"
            test -s ".tmp_facsimile/p145_window/n${n}.jpg"
          done
          sha256sum .tmp_facsimile/p145_window/*.jpg > .tmp_facsimile/p145_window/SHA256SUMS.txt
      - name: Commit temporary facsimile window
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_facsimile/p145_window
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: añadir ventana facsimilar temporal p145"
          git push
