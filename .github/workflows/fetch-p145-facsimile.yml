name: Fetch p145 facsimile window

on:
  push:
    branches:
      - work/p145-facsimile-collation

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and download Internet Archive PDF
        run: |
          curl --fail --location --max-time 45 --retry 2 https://archive.org/metadata/artedelalenguaca00gonz -o /tmp/ia-metadata.json
          PDF_NAME=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/ia-metadata.json'))
          files=data.get('files',[])
          preferred=[]
          for f in files:
              name=f.get('name','')
              fmt=f.get('format','')
              if name.lower().endswith('.pdf'):
                  score=0
                  if fmt == 'Text PDF': score=30
                  elif fmt == 'B/W PDF': score=20
                  elif 'pdf' in fmt.lower(): score=10
                  if name.endswith('_text.pdf'): score += 3
                  preferred.append((score,name,fmt))
          preferred.sort(reverse=True)
          if not preferred:
              raise SystemExit('No PDF derivative found')
          print(preferred[0][1])
          PY
          )
          echo "Resolved PDF derivative: $PDF_NAME"
          printf '%s\n' "$PDF_NAME" > /tmp/pdf-name.txt
          curl --fail --location --max-time 180 --retry 2 --retry-delay 2 "https://archive.org/download/artedelalenguaca00gonz/${PDF_NAME}" -o /tmp/alc1737.pdf
          test -s /tmp/alc1737.pdf
          file /tmp/alc1737.pdf | grep -i PDF
      - name: Render temporary page window
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p .tmp_facsimile/p145_window
          rm -f .tmp_facsimile/p145_window/*.jpg .tmp_facsimile/p145_window/SHA256SUMS.txt .tmp_facsimile/p145_window/PDF_SOURCE.txt
          pdfinfo /tmp/alc1737.pdf | tee /tmp/pdfinfo.txt
          for p in $(seq 140 150); do
            pdftoppm -f "$p" -l "$p" -singlefile -jpeg -jpegopt quality=90 -r 180 /tmp/alc1737.pdf ".tmp_facsimile/p145_window/pdfp${p}"
            test -s ".tmp_facsimile/p145_window/pdfp${p}.jpg"
          done
          sha256sum .tmp_facsimile/p145_window/*.jpg > .tmp_facsimile/p145_window/SHA256SUMS.txt
          {
            echo 'Internet Archive identifier: artedelalenguaca00gonz'
            echo "PDF derivative: $(cat /tmp/pdf-name.txt)"
            grep '^Pages:' /tmp/pdfinfo.txt
          } > .tmp_facsimile/p145_window/PDF_SOURCE.txt
      - name: Commit temporary facsimile window
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_facsimile/p145_window
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: añadir ventana facsimilar temporal p145"
          git push
