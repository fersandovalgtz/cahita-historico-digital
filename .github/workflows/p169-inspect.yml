name: CHD p169 synchronize docs

on:
  push:
    branches: [work/p169-reconciliation]
    paths:
      - '.github/workflows/p169-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p169 docs
        run: python scripts/_tmp_sync_p169.py
      - name: Validate p169 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p169_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p169_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p169_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p169_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p169_preflight.json >/dev/null
          grep -F '**34 `article`** y **1 `continuation`**' docs/LEXICON_PROGRESS.md
          grep -F '22 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '48 candidatos: 26 izquierda y 22 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **169** tiene sus **35 candidatos canónicos reconciliados**' README.md
          grep -F 'página 170**, con 48 candidatos canónicos —26 izquierda y 22 derecha—' README.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.169' -m 'Registra 34 article, 1 continuation, cuatro missed-starts seleccionados, 22 pending_promotion y fija p.170=48 candidatos.'
          git push origin HEAD:work/p169-reconciliation
