name: Sync p149 progress

on:
  push:
    branches:
      - docs/p149-progress-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale p149 progress section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/LEXICON_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## Página 149 —')
          end = text.index('## Página 150 —', start)
          lines = [
              '## Página 149 — reconciliación estructural completada',
              '',
              'La página digital **149** contiene **61 candidatos canónicos: 31 izquierda y 30 derecha**. La clasificación machine-only queda en **56 `article` y 5 `continuation`**, sin candidatos `unresolved`, `paratext` o `false_positive`. La calidad de frontera se distribuye en **48 `exact`**, **5 `oversegmented`**, **3 `undersegmented`** y **5 `not_applicable`**; ya no queda ninguna frontera `ambiguous`.',
              '',
              'La capa seleccionada preexistente contiene **15 artículos, `ALC1737-art-000239`–`ALC1737-art-000253`**, todos enlazados. `ALC1737-art-000239` (`Calabaza pequeña tierna`) se reparte entre L-001 y la continuación L-002. Otras continuidades internas demostradas son L-005→L-006, L-007→L-008, L-009→L-010 y L-014→L-015. `ALC1737-art-000247` (`Camarón`) comienza en L-031 y continúa físicamente en la parte superior de la columna derecha antes de R-001, conforme a sus `sourceSpans` ya existentes.',
              '',
              'El antiguo límite irresuelto **L-019** quedó resuelto como un segundo artículo de `Calentura`, cuya guía estructuralmente sustentada es **`Calentura tener`**. La fila canónica de L-019 comienza como inicio independiente en el margen izquierdo; L-018 conserva el primer artículo `Calentura` y sigue `undersegmented` porque su agrupamiento OCR absorbe el fragmento `tener*`. El OCR del testigo ALC1737 y el control histórico BUE1890 coinciden en la secuencia `Calentura` → `Calentura tener` → `Caliente`. Esta convergencia se usa únicamente para la estructura: la forma cahíta exacta de ALC1737 permanece sin promoción y ninguna lectura de BUE1890 se traslada al testigo de 1737.',
              '',
              'Quedan **41 candidatos de artículo `pending_promotion`**. No hubo promociones nuevas y el corpus permanece en **1,045 artículos**. Se conocen al menos **56 inicios de artículo**, pero `visibleStartEvidence.exhaustive=false`: la capa seleccionada sigue sin demostrar ausencia de otros falsos negativos y no se calculan precisión, recall ni F1.',
              '',
              'En el borde inferior, R-030 comienza con `Carcoma de madera` y absorbe material dañado adicional. La página 150 abre con el artículo seleccionado **`Carcel. Tequiloacari.`**, por lo que no se afirma una continuidad larga p.149→150. `p149_structural_resolution_2026-08-17.json` y `p149_machine_reconciliation_status.json` conservan el detalle, la trazabilidad y las guardas epistemológicas. La reconciliación candidate-level de p.149 está completa, pero `technicalClosure=false` y `humanVerified=false` porque siguen pendientes promoción/enlace y un censo visible exhaustivo.',
              '',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Sanity check
        run: |
          grep -F '56 `article` y 5 `continuation`' docs/LEXICON_PROGRESS.md
          grep -F '41 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F 'Calentura tener' docs/LEXICON_PROGRESS.md
          python scripts/reconstruct_candidate_inventory.py
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LEXICON_PROGRESS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sincronizar estado de p.149"
          git push
