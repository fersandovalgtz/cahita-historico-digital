name: P145 Facsimile Extract B/W

on:
  push:
    branches:
      - p145-ai-collation

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Download IA B/W derivative of ALC1737 scan
        run: |
          curl -L --fail --retry 4 -o /tmp/cahita-bw.pdf https://archive.org/download/artedelalenguaca00gonz/artedelalenguaca00gonz_bw.pdf
          pdfinfo /tmp/cahita-bw.pdf | grep '^Pages:'
          sha256sum /tmp/cahita-bw.pdf
      - name: Extract digital pages 144-146 at 300 dpi
        run: |
          mkdir -p facsimile
          pdftoppm -f 144 -l 146 -r 300 -png /tmp/cahita-bw.pdf facsimile/p >/dev/null 2>&1
          ls -lh facsimile
      - name: Upload facsimile pages
        uses: actions/upload-artifact@v4
        with:
          name: p145-facsimile-context-bw
          path: facsimile/*.png
          retention-days: 1
