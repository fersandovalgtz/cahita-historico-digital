name: CHD p175 targeted inspection

on:
  push:
    branches: [work/p175-reconciliation]
    paths:
      - '.github/workflows/p175-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect ambiguous p175 regions
        run: |
          python scripts/export_candidate_page.py --page 175 > /tmp/p175.jsonl
          python scripts/export_candidate_page.py --page 176 > /tmp/p176.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/p175.jsonl').read_text().splitlines() if x.strip()]
          by={r['candidateId']:r for r in rows}
          ids=[f'ALC1737-vcand-p175-L-{n:03d}' for n in range(11,16)] + [f'ALC1737-vcand-p175-R-{n:03d}' for n in range(6,11)] + [f'ALC1737-vcand-p175-R-{n:03d}' for n in range(14,16)]
          for cid in ids:
              r=by[cid]
              print('CAND',cid,'startY=',r.get('startY'),'flags=',r.get('flags'))
              for i,line in enumerate(r.get('rawLines',[]),1): print(' ',i,repr(line))
          arts=[json.loads(x) for x in Path('data/lexicon/articles/p175_selected_articles.jsonl').read_text().splitlines() if x.strip()]
          wanted={f'ALC1737-art-{n:06d}' for n in [637,638,639,640,643]}
          print('SELECTED')
          for a in arts:
              if a['articleId'] in wanted: print(a['articleId'],'::',a['transcriptionRaw'])
          p176=[json.loads(x) for x in Path('/tmp/p176.jsonl').read_text().splitlines() if x.strip()]
          print('P176 EDGE')
          for r in p176[:3]:
              print(r['candidateId'],'startY=',r.get('startY'),'flags=',r.get('flags'))
              for i,line in enumerate(r.get('rawLines',[]),1): print(' ',i,repr(line))
          PY
