name: CHD p151 materialize reconciliation

on:
  push:
    branches: [work/p151-reconciliation]
    paths:
      - '.github/workflows/p151-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate p151 reconciliation layers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          links = {
            'L-002':['ALC1737-art-000269','ALC1737-art-000270','ALC1737-art-000271'],
            'L-003':['ALC1737-art-000272'],
            'L-004':['ALC1737-art-000273'],
            'L-005':['ALC1737-art-000274'],
            'L-006':['ALC1737-art-000275'],
            'L-007':['ALC1737-art-000276'],
            'L-008':['ALC1737-art-000277'],
            'L-010':['ALC1737-art-000278'],
            'L-011':['ALC1737-art-000279'],
            'L-012':['ALC1737-art-000280'],
            'R-002':['ALC1737-art-000281'],
            'R-007':['ALC1737-art-000282'],
            'R-010':['ALC1737-art-000283']
          }
          continuations = {'R-003','R-006','R-009'}
          split_starts = {'R-002','R-005','R-008'}
          provenance = {
            'derivedFrom':'canonical-v0.2 candidate inventory; p151 selected article layer where linked; p150 and p152 candidate layers for page-edge context',
            'agent':'GPT-5.6 Sol machine reconciliation',
            'method':'AI-assisted structural reconciliation from canonical geometry/OCR and pre-existing selected direct-collation anchors; no independent human verification',
            'processedAt':None
          }

          def record(side, n):
            key = f'{side}-{n:03d}'
            cid = f'ALC1737-vcand-p151-{key}'
            column = 'left' if side == 'L' else 'right'
            if key in continuations:
              parent = {'R-003':'R-002','R-006':'R-005','R-009':'R-008'}[key]
              return {
                'candidateId':cid,'sourceId':'ALC1737','sourcePageDigital':151,'column':column,
                'classification':'continuation','boundaryAssessment':'not_applicable','linkedArticleIds':[],
                'articleLinkStatus':'not_applicable','continuationType':'from_previous_line',
                'editorialNote':f'Physical continuation of candidate {parent}; not a fresh lexical start.',
                'reviewStatus':'machine_corrected_unverified','humanVerified':False,'provenance':provenance
              }
            linked = links.get(key, [])
            if key == 'L-002':
              assessment = 'merged_articles'
              note = 'Canonical OCR/layout candidate absorbs a damaged region containing three selected direct-collation articles: 000269 (`Compañón, ó cojon`), 000270 (`Compaſſar, ó medir con compás`) and 000271 (`Compaſſion. Buſca compadecerſe`). The candidate preserves only fragments of this sequence, so the three selected objects remain the stronger transcription anchors.'
            elif key in split_starts:
              assessment = 'oversegmented'
              nxt = {'R-002':'R-003','R-005':'R-006','R-008':'R-009'}[key]
              note = f'Distinct article start split by extractor geometry; {nxt} is continuation text rather than a fresh lexical start.'
            else:
              assessment = 'exact'
              if linked:
                note = 'Aligned to selected direct-collation article anchor.'
              else:
                note = 'Distinct lexical start; retained pending because raw OCR alone is not a sufficient transcription anchor for promotion.'
            if key == 'R-027':
              note = 'Distinct page-bottom article start `Coronilla...`; it may continue into unrepresented top-left material on p152. p152 L-001 begins a fresh `Crecer el hombre` article, so no continuation into that candidate is asserted.'
            return {
              'candidateId':cid,'sourceId':'ALC1737','sourcePageDigital':151,'column':column,
              'classification':'article','boundaryAssessment':assessment,'linkedArticleIds':linked,
              'articleLinkStatus':'linked' if linked else 'pending_promotion',
              'editorialNote':note,'reviewStatus':'machine_corrected_unverified','humanVerified':False,
              'provenance':provenance
            }

          out = Path('data/lexicon/reconciliation')
          for side, count, filename in [('L',23,'p151_left_reconciliation.jsonl'),('R',27,'p151_right_reconciliation.jsonl')]:
            rows = [record(side, i) for i in range(1, count + 1)]
            (out / filename).write_text('\n'.join(json.dumps(r, ensure_ascii=False) for r in rows) + '\n', encoding='utf-8')

          status = {
            'sourceId':'ALC1737','sourcePageDigital':151,
            'pageStatus':{
              'candidateReconciliation':'complete','visibleStartCensus':'not_exhaustive',
              'promotionLinkage':'partial','technicalClosure':False,'humanVerificationPlanned':False
            },
            'candidateInventory':{
              'total':50,'left':23,'right':27,
              'classification':{'article':47,'continuation':3,'paratext':0,'false_positive':0,'unresolved':0},
              'boundaryAssessment':{'exact':43,'oversegmented':3,'undersegmented':0,'merged_articles':1,'ambiguous':0,'not_applicable':3}
            },
            'selectedLayer':{
              'preExistingArticles':15,'articleIdRange':['ALC1737-art-000269','ALC1737-art-000283'],
              'articleCandidateRecordsLinked':13,'structuredArticlesLinked':15,'selectedArticlesUnlinked':0,
              'mergedCandidateId':'ALC1737-vcand-p151-L-002',
              'mergedSelectedArticleIds':['ALC1737-art-000269','ALC1737-art-000270','ALC1737-art-000271']
            },
            'promotion':{'articleCandidatesPendingPromotion':34,'newPromotionsThisPass':0,'corpusTotalAfterPass':1045},
            'visibleStartEvidence':{
              'exhaustive':False,'knownVisibleStartsMinimum':49,'knownMergedInternalStarts':2,
              'precision':None,'recall':None,'f1':None,
              'reasonMetricsWithheld':'The 47 article candidates plus two additional selected starts absorbed inside merged candidate L-002 establish at least 49 article starts. The selected layer is not exhaustive and cannot prove absence of further missed starts; no performance denominator is asserted.'
            },
            'physicalContinuities':[
              {'from':'ALC1737-vcand-p150-R-030','to':'ALC1737-vcand-p151-L-001','type':'page_edge_context','note':'p150 R-030 carries trailing `Com-` page-edge material; p151 L-001 is a fresh `Compadecerſe` article start.'},
              {'from':'ALC1737-vcand-p151-R-002','to':'ALC1737-vcand-p151-R-003','type':'article_continuation'},
              {'from':'ALC1737-vcand-p151-R-005','to':'ALC1737-vcand-p151-R-006','type':'article_continuation'},
              {'from':'ALC1737-vcand-p151-R-008','to':'ALC1737-vcand-p151-R-009','type':'article_continuation'},
              {'from':'ALC1737-vcand-p151-R-027','to':'p152:left-top-unrepresented','type':'page_edge_article_continuation','note':'`Coronilla...` ends at the p151 bottom; p152 L-001 begins fresh `Crecer el hombre`, so any remaining continuation belongs to unrepresented page-top context before L-001.'}
            ],
            'structuralNotes':[
              'L-002 is a merged-start region supported by the ordering of selected direct-collation articles 000269–000271 and damaged OCR fragments within the candidate.',
              'R-003, R-006 and R-009 are continuation candidates and not lexical starts.'
            ],
            'evidence':{
              'canonicalCandidateInventoryVerified':True,'canonicalCandidateInventoryCount':2072,
              'selectedP151LayerUsedAsAnchor':True,'p150AndP152CandidateLayersUsedForPageEdges':True,
              'directFacsimileAvailableThisPass':False,
              'policy':'Structural decisions may be closed from convergent machine evidence and pre-existing direct-collation anchors; uncertain lexical text is not strengthened and visible-start metrics remain withheld without an exhaustive census.'
            },
            'reviewStatus':'machine_corrected_unverified','humanVerified':False
          }
          (out / 'p151_machine_reconciliation_status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate generated reconciliation
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p151_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p151_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p151_machine_reconciliation_status.json >/dev/null
      - name: Commit generated evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p151_left_reconciliation.jsonl data/lexicon/reconciliation/p151_right_reconciliation.jsonl data/lexicon/reconciliation/p151_machine_reconciliation_status.json
          git commit -m 'data: reconciliar estructuralmente p.151' -m '50/50 candidatos: 47 article, 3 continuation; L-002 modelado como merged_articles con tres anclas seleccionadas; 34 pending_promotion y métricas retenidas por censo no exhaustivo.'
          git push origin HEAD:work/p151-reconciliation
