name: CHD Transcription Status

on:
  pull_request:
    paths:
      - ".github/workflows/transcription-status.yml"
      - "scripts/reconcile_transcription_status.py"
      - "scripts/validate_transcription_status_sync.py"
      - "data/transcription/status.csv"
      - "data/transcription/pages/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/transcription-status.yml"
      - "scripts/reconcile_transcription_status.py"
      - "scripts/validate_transcription_status_sync.py"
      - "data/transcription/status.csv"
      - "data/transcription/pages/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-and-validate:
    name: Reconcile transcription status with canonical pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile status tools
        run: python -m py_compile scripts/reconcile_transcription_status.py scripts/validate_transcription_status_sync.py

      - name: Validate deterministic reconciliation
        run: python scripts/validate_transcription_status_sync.py

      - name: Generate candidate canonical status
        run: python scripts/reconcile_transcription_status.py --out-dir "${RUNNER_TEMP}/transcription-status-sync"

      - name: Upload status reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: cahita-transcription-status-${{ github.sha }}
          path: ${{ runner.temp }}/transcription-status-sync/
          if-no-files-found: error
          retention-days: 14
