name: Temporary fix v1 builder flag

on:
  push:
    branches: [release/v1-final-identity]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1-final-identity
          fetch-depth: 0
      - name: Fix v1 recollation exporter flag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_v1_release.py')
          s = p.read_text(encoding='utf-8')
          old = '("v1_recollation_disposition", "export_v1_recollation_disposition.py", "--output-dir"),'
          new = '("v1_recollation_disposition", "export_v1_recollation_disposition.py", "--out-dir"),'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('expected exporter tuple not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/build_v1_release.py; then
            echo "builder already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_v1_release.py
          git commit -m "fix: usar flag correcta en exportador de disposición v1"
          git push origin HEAD:release/v1-final-identity
