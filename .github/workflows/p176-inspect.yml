name: CHD p176 materialize reconciliation

on:
  push:
    branches: [work/p176-reconciliation]
    paths:
      - '.github/workflows/p176-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p176 reconciliation
        run: python scripts/_tmp_materialize_p176.py
      - name: Validate p176 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p176_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p176_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p176_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p176_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p176_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ['p176_left_reconciliation.jsonl','p176_right_reconciliation.jsonl']:
              rows += [json.loads(x) for x in Path('data/lexicon/reconciliation',name).read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==49
          cls={k:sum(r['classification']==k for r in rows) for k in ['article','continuation','unresolved','paratext','false_positive']}
          assert cls=={'article':49,'continuation':0,'unresolved':0,'paratext':0,'false_positive':0}, cls
          merged={f'ALC1737-vcand-p176-{x}' for x in ['L-010','R-004','R-009']}
          under={f'ALC1737-vcand-p176-{x}' for x in ['L-009','R-023']}
          assert {r['candidateId'] for r in rows if r['boundaryAssessment']=='merged_articles'}==merged
          assert {r['candidateId'] for r in rows if r['boundaryAssessment']=='undersegmented'}==under
          assert sum(r['boundaryAssessment']=='exact' for r in rows)==44
          linked={aid for r in rows for aid in r.get('linkedArticleIds',[])}
          expected={f'ALC1737-art-{n:06d}' for n in range(644,659)}
          assert linked==expected
          miss=[json.loads(x) for x in Path('data/lexicon/reconciliation/p176_missed_visible_starts.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(miss)==1 and miss[0]['linkedArticleIds']==['ALC1737-art-000653']
          assert miss[0]['containingCandidateId']=='ALC1737-vcand-p176-L-010'
          status=json.loads(Path('data/lexicon/reconciliation/p176_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['promotion']['articleCandidatesPendingPromotion']==34
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==50
          assert status['nextPage']['candidateInventoryTotal']==57
          assert status['promotion']['corpusTotalAfterPass']==1045
          PY
      - name: Commit generated p176 evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p176_left_reconciliation.jsonl data/lexicon/reconciliation/p176_right_reconciliation.jsonl data/lexicon/reconciliation/p176_missed_visible_starts.jsonl data/lexicon/reconciliation/p176_machine_reconciliation_status.json data/lexicon/reconciliation/p176_preflight.json
          git commit -m 'data: reconciliar conservadoramente p.176' -m '49 candidatos article; 000653 como missed-start interno, tres merged_articles, dos undersegmented, 34 pending_promotion y borde p177 fresco tras catchword.'
          git push origin HEAD:work/p176-reconciliation
