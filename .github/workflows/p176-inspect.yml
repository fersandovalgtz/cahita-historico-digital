name: CHD p176 inspection

on:
  push:
    branches: [work/p176-reconciliation]
    paths:
      - '.github/workflows/p176-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect p176 and p177 edge
        run: |
          python scripts/export_candidate_page.py --page 176 > /tmp/p176.jsonl
          python scripts/export_candidate_page.py --page 177 > /tmp/p177.jsonl
          python - <<'PY'
          import json,re,unicodedata
          from pathlib import Path
          from difflib import SequenceMatcher
          def norm(s):
              s=unicodedata.normalize('NFKD',s.lower().replace('ſ','s'))
              s=''.join(c for c in s if not unicodedata.combining(c))
              return re.sub(r'[^a-z0-9]+',' ',s).strip()
          p176=[json.loads(x) for x in Path('/tmp/p176.jsonl').read_text().splitlines() if x.strip()]
          p177=[json.loads(x) for x in Path('/tmp/p177.jsonl').read_text().splitlines() if x.strip()]
          print('P176',len(p176),'L',sum(x['column']=='left' for x in p176),'R',sum(x['column']=='right' for x in p176))
          for x in p176: print(x['candidateId'],'::',x['rawText'])
          arts=[json.loads(x) for x in Path('data/lexicon/articles/p176_selected_articles.jsonl').read_text().splitlines() if x.strip()]
          for a in arts:
              q=norm(a['spanishGuideRaw']); scored=[]
              for c in p176:
                  t=norm(c['rawText']); score=SequenceMatcher(None,q,t[:max(30,len(q)*2)]).ratio()
                  if q and q.split()[0] in t: score+=0.25
                  scored.append((score,c['candidateId'],c['rawText']))
              print('ANCHOR',a['articleId'],a['spanishGuideRaw'])
              for sc,cid,raw in sorted(scored,reverse=True)[:3]: print(f'  {sc:.3f} {cid} :: {raw}')
          print('P177',len(p177),'L',sum(x['column']=='left' for x in p177),'R',sum(x['column']=='right' for x in p177))
          print('P177-FIRST')
          for x in p177[:12]: print(x['candidateId'],'::',x['rawText'])
          print('P177-LAST')
          for x in p177[-10:]: print(x['candidateId'],'::',x['rawText'])
          PY
