name: CHD p176 targeted inspection

on:
  push:
    branches: [work/p176-reconciliation]
    paths:
      - '.github/workflows/p176-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect ambiguous p176 regions
        run: |
          python scripts/export_candidate_page.py --page 176 > /tmp/p176.jsonl
          python scripts/export_candidate_page.py --page 177 > /tmp/p177.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/p176.jsonl').read_text().splitlines() if x.strip()]
          by={r['candidateId']:r for r in rows}
          ids=[f'ALC1737-vcand-p176-L-{n:03d}' for n in range(8,11)] + [f'ALC1737-vcand-p176-R-{n:03d}' for n in [4,9,23]]
          for cid in ids:
              r=by[cid]
              print('CAND',cid,'startY=',r.get('startY'),'flags=',r.get('flags'))
              for i,line in enumerate(r.get('rawLines',[]),1): print(' ',i,repr(line))
          arts=[json.loads(x) for x in Path('data/lexicon/articles/p176_selected_articles.jsonl').read_text().splitlines() if x.strip()]
          print('SELECTED-652-653')
          for a in arts:
              if a['articleId'] in {'ALC1737-art-000652','ALC1737-art-000653'}: print(a['articleId'],'::',a['transcriptionRaw'])
          p177=[json.loads(x) for x in Path('/tmp/p177.jsonl').read_text().splitlines() if x.strip()]
          print('P177-EDGE')
          for r in p177[:3]:
              print(r['candidateId'],'startY=',r.get('startY'),'flags=',r.get('flags'))
              for i,line in enumerate(r.get('rawLines',[]),1): print(' ',i,repr(line))
          PY
