name: CHD p176 synchronize docs

on:
  push:
    branches: [work/p176-reconciliation]
    paths:
      - '.github/workflows/p176-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p176 docs
        run: python scripts/_tmp_sync_p176.py
      - name: Validate synchronized docs
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text(encoding='utf-8')
          p=Path('docs/LEXICON_PROGRESS.md').read_text(encoding='utf-8')
          assert 'la página **176** tiene sus **49 candidatos canónicos reconciliados**' in r
          assert 'la página **177** ya posee representación lexicográfica estructurada' in r
          assert '## Página 176 — reconciliación conservadora completada' in p
          assert 'Las páginas **145–176 tienen reconciliación completa de sus candidatos canónicos**' in p
          assert 'en p.176, **34 `pending_promotion`**' in p
          assert 'El siguiente y último frente geométrico del Vocabulario es la **página digital 177**' in p
          assert '57 candidatos canónicos: 29 izquierda y 28 derecha' in p
          PY
      - name: Commit synchronized docs
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: sincronizar progreso con reconciliación de p.176'
          git push origin HEAD:work/p176-reconciliation
