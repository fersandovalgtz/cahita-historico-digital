name: CHD Historical Variation

on:
  pull_request:
    paths:
      - ".github/workflows/historical-variation.yml"
      - "scripts/export_historical_variation_index.py"
      - "scripts/validate_historical_variation_index.py"
      - "schemas/historical-variety-observation.schema.json"
      - "data/transcription/**"
      - "data/lexicon/articles/**"
      - "data/grammar/**"
      - "docs/HISTORICAL_VARIATION_INDEX.md"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-variation.yml"
      - "scripts/export_historical_variation_index.py"
      - "scripts/validate_historical_variation_index.py"
      - "schemas/historical-variety-observation.schema.json"
      - "data/transcription/**"
      - "data/lexicon/articles/**"
      - "data/grammar/**"
      - "docs/HISTORICAL_VARIATION_INDEX.md"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate historical variation index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile historical-variation tools
        run: python -m py_compile scripts/export_historical_variation_index.py scripts/validate_historical_variation_index.py

      - name: Run deterministic historical-variation QA
        run: python scripts/validate_historical_variation_index.py

      - name: Build reviewable artifact
        run: python scripts/export_historical_variation_index.py --out-dir "${RUNNER_TEMP}/historical-variation-index"

      - name: Upload validated index
        uses: actions/upload-artifact@v4
        with:
          name: cahita-historical-variation-${{ github.sha }}
          path: ${{ runner.temp }}/historical-variation-index/
          if-no-files-found: error
          retention-days: 14
