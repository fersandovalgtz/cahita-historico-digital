name: TEMP v1 contract manifest

on:
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Print deterministic v1 contract manifest
        run: python scripts/build_v1_contract_manifest.py --stdout
