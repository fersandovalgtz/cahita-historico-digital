name: CHD p174 synchronize docs

on:
  push:
    branches: [work/p174-reconciliation]
    paths:
      - '.github/workflows/p174-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p174 docs
        run: python scripts/_tmp_sync_p174.py
      - name: Validate synchronized docs
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text(encoding='utf-8')
          p=Path('docs/LEXICON_PROGRESS.md').read_text(encoding='utf-8')
          assert 'la página **174** tiene sus **48 candidatos canónicos reconciliados**' in r
          assert 'las páginas **175–177** ya poseen representación lexicográfica estructurada' in r
          assert '## Página 174 — reconciliación conservadora completada' in p
          assert 'Las páginas **145–174 tienen reconciliación completa de sus candidatos canónicos**' in p
          assert 'en p.174, **34 `pending_promotion`**' in p
          assert 'El siguiente frente geométrico es la **página digital 175**' in p
          assert '35 candidatos canónicos: 20 izquierda y 15 derecha' in p
          PY
      - name: Commit synchronized docs
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: sincronizar progreso con reconciliación de p.174'
          git push origin HEAD:work/p174-reconciliation
