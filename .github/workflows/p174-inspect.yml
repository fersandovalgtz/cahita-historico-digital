name: CHD p174 concise inspection

on:
  push:
    branches: [work/p174-reconciliation]
    paths:
      - '.github/workflows/p174-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Summarize p174 and p175 edge
        run: |
          python scripts/export_candidate_page.py --page 174 > /tmp/p174.jsonl
          python scripts/export_candidate_page.py --page 175 > /tmp/p175.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          def rows(p): return [json.loads(x) for x in Path(p).read_text().splitlines() if x.strip()]
          a=rows('/tmp/p174.jsonl'); b=rows('/tmp/p175.jsonl')
          print('P174',len(a),'L',sum(x['column']=='left' for x in a),'R',sum(x['column']=='right' for x in a))
          for x in a: print(x['candidateId'],'::',x['rawText'])
          print('P175',len(b),'L',sum(x['column']=='left' for x in b),'R',sum(x['column']=='right' for x in b))
          print('P175-FIRST')
          for x in b[:8]: print(x['candidateId'],'::',x['rawText'])
          print('P175-LAST')
          for x in b[-8:]: print(x['candidateId'],'::',x['rawText'])
          PY
