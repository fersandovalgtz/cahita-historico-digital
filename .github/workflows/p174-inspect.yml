name: CHD p174 materialize reconciliation

on:
  push:
    branches: [work/p174-reconciliation]
    paths:
      - '.github/workflows/p174-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p174 reconciliation
        run: python scripts/_tmp_materialize_p174.py
      - name: Validate p174 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p174_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p174_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p174_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p174_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p174_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ['p174_left_reconciliation.jsonl','p174_right_reconciliation.jsonl']:
              rows += [json.loads(x) for x in Path('data/lexicon/reconciliation',name).read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==48
          cls={k:sum(r['classification']==k for r in rows) for k in ['article','continuation','unresolved','paratext','false_positive']}
          assert cls=={'article':48,'continuation':0,'unresolved':0,'paratext':0,'false_positive':0}, cls
          by={r['candidateId']:r for r in rows}
          merged={f'ALC1737-vcand-p174-{x}' for x in ['L-013','L-024','R-001','R-006','R-011','R-012']}
          assert {r['candidateId'] for r in rows if r['boundaryAssessment']=='merged_articles'}==merged
          assert sum(r['boundaryAssessment']=='exact' for r in rows)==42
          linked={aid for r in rows for aid in r.get('linkedArticleIds',[])}
          expected={f'ALC1737-art-{n:06d}' for n in range(615,629)}
          assert linked==expected, (linked,expected)
          miss=[json.loads(x) for x in Path('data/lexicon/reconciliation/p174_missed_visible_starts.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(miss)==3
          assert {a for m in miss for a in m['linkedArticleIds']}=={f'ALC1737-art-{n:06d}' for n in [614,623,628]}
          assert next(m for m in miss if '000623' in m['linkedArticleIds'][0])['containingCandidateId']=='ALC1737-vcand-p174-L-013'
          assert next(m for m in miss if '000628' in m['linkedArticleIds'][0])['containingCandidateId']=='ALC1737-vcand-p174-L-024'
          status=json.loads(Path('data/lexicon/reconciliation/p174_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['promotion']['articleCandidatesPendingPromotion']==34
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==51
          assert status['nextPage']['candidateInventoryTotal']==35
          assert status['promotion']['corpusTotalAfterPass']==1045
          PY
      - name: Commit generated p174 evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p174_left_reconciliation.jsonl data/lexicon/reconciliation/p174_right_reconciliation.jsonl data/lexicon/reconciliation/p174_missed_visible_starts.jsonl data/lexicon/reconciliation/p174_machine_reconciliation_status.json data/lexicon/reconciliation/p174_preflight.json
          git commit -m 'data: reconciliar conservadoramente p.174' -m '48 candidatos article; tres missed-starts seleccionados, seis regiones merged_articles, 34 pending_promotion y borde p175 fresco.'
          git push origin HEAD:work/p174-reconciliation
