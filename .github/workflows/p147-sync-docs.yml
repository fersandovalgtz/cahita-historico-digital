name: P147 Sync Docs

on:
  push:
    branches:
      - p147-machine-reconciliation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p147-machine-reconciliation
      - name: Synchronize README and lexicon progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/LEXICON_PROGRESS.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
            'Las páginas **145–146 tienen ya reconciliación completa de sus candidatos canónicos**, pero permanecen abiertas para censo exhaustivo de inicios visibles y promoción de fronteras sin transcripción suficientemente sustentada. La **p.147 tiene preflight reproducible abierto sobre 51 candidatos y 15 artículos seleccionados preexistentes**.',
            'Las páginas **145–147 tienen ya reconciliación completa de sus candidatos canónicos**, pero permanecen abiertas para censo exhaustivo de inicios visibles y promoción de fronteras sin transcripción suficientemente sustentada.'
          )
          new_section = '''## Página 147 — reconciliación de candidatos completada

La página digital **147** contiene **51 candidatos canónicos: 26 izquierda y 25 derecha**. Los 51 quedaron clasificados en `p147_left_reconciliation.jsonl` y `p147_right_reconciliation.jsonl`.

La clasificación estructural es **51 `article`**, sin candidatos `continuation`, `unresolved`, `paratext` o `false_positive`. La calidad de frontera se distribuye en **49 `exact`** y **2 `undersegmented`**. R-002 inicia el artículo seleccionado `Borracho. Buſca beodo.` pero contiene material OCR adicional; R-020 inicia `Brincar de alto abajo` y su agrupamiento arrastra material asociado con el siguiente candidato R-021, `Brincar por el suelo`.

La capa seleccionada preexistente contiene **15 artículos, `ALC1737-art-000209`–`ALC1737-art-000223`**. Los quince quedaron enlazados a candidatos: 14 en la columna izquierda y uno en la derecha. No se observó un falso negativo demostrable dentro de esta capa de anclaje, pero su cobertura —en especial un solo artículo seleccionado en la columna derecha— es demasiado escasa para afirmar que no existan otros inicios omitidos.

Quedan **36 candidatos de artículo `pending_promotion`**. Sus fronteras son suficientemente claras para reconciliación estructural, pero no se promueven desde OCR sin una transcripción más fuerte. No hubo promociones nuevas y el corpus permanece en **1,045 artículos**.

El borde entre páginas también quedó modelado. El `Bebida` final de p.146 anticipa p.147 L-001, `Bebida de chía, y maíz toſtado`, que es una entrada nueva. En el borde p.147→148, el material `Brum*` al final de R-025 se trata como reclamo dañado que anticipa p.148 L-001, `Bruñidor`, y no como un segundo artículo de p.147.

El censo visible **no se declara exhaustivo**. Se conocen al menos 51 inicios, pero la ausencia de un censo facsimilar completo impide demostrar que ese mínimo sea el denominador real. Por ello TP/FP/FN, precisión, recobrado y F1 permanecen sin calcular. `p147_machine_reconciliation_status.json` registra esta distinción.

'''
          s = re.sub(r'## Página 147 — preflight reproducible\n.*?(?=## Próximo frente)', new_section, s, flags=re.S)
          s = s.replace(
            'En p.145 continúa la reducción de **20 `pending_promotion`** y 3 `unresolved`; en p.146 quedan **22 `pending_promotion`** y el censo visible exhaustivo. El frente geométrico activo es ahora **p.147**: exportar los 51 candidatos completos, alinear los 15 anclajes seleccionados, clasificar cada frontera y detectar falsos negativos adicionales.',
            'En p.145 continúa la reducción de **20 `pending_promotion`** y 3 `unresolved`; en p.146 quedan **22 `pending_promotion`**; y en p.147 quedan **36 `pending_promotion`**. Las tres páginas tienen reconciliación de candidatos completa, pero no un censo visible exhaustivo. El siguiente frente geométrico es la **página digital 148**, con **44 candidatos canónicos**.'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
            '- las páginas **147–177** ya poseen representación lexicográfica estructurada, pero su reconciliación exhaustiva página por página sigue pendiente;',
            '- la página **147** tiene sus **51 candidatos canónicos reconciliados**: 51 `article`, 0 `unresolved`; conserva 36 fronteras `pending_promotion` y un censo visible todavía no exhaustivo;\n- las páginas **148–177** ya poseen representación lexicográfica estructurada, pero su reconciliación exhaustiva página por página sigue pendiente;'
          )
          s = s.replace(
            'En **p.145** quedan 20 fronteras `pending_promotion` y 3 candidatos `unresolved`. En **p.146** la reconciliación estructural de los 47 candidatos está completa, con 22 `pending_promotion`; se han demostrado dos falsos negativos —`ALC1737-art-000184` antes de L-001 y `ALC1737-art-000193` dentro de L-008—, pero no se declara todavía un censo visible exhaustivo. El siguiente frente geométrico es la **página 147**, con 51 candidatos canónicos.',
            'En **p.145** quedan 20 fronteras `pending_promotion` y 3 candidatos `unresolved`; en **p.146** quedan 22 `pending_promotion`; y en **p.147** quedan 36 `pending_promotion`. Las tres páginas tienen reconciliación estructural completa, pero sus censos visibles aún no se consideran exhaustivos. El siguiente frente geométrico es la **página 148**, con 44 candidatos canónicos.'
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/p147-sync-docs.yml
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md .github/workflows
          git commit -m 'docs: sync status through p147 reconciliation'
          git push origin HEAD:p147-machine-reconciliation
