name: CHD p166 materialize reconciliation

on:
  push:
    branches: [work/p166-reconciliation]
    paths:
      - '.github/workflows/p166-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p166 reconciliation
        run: python scripts/_tmp_materialize_p166.py
      - name: Validate p166 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p166_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p166_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p166_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p166_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p166_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ['p166_left_reconciliation.jsonl','p166_right_reconciliation.jsonl']:
              rows += [json.loads(x) for x in Path('data/lexicon/reconciliation',name).read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==50
          assert all(r['classification']=='article' for r in rows)
          by={r['candidateId']:r for r in rows}
          assert by['ALC1737-vcand-p166-L-003']['boundaryAssessment']=='merged_articles'
          assert by['ALC1737-vcand-p166-L-003']['linkedArticleIds']==['ALC1737-art-000496','ALC1737-art-000497']
          for cid in ['ALC1737-vcand-p166-L-007','ALC1737-vcand-p166-R-008','ALC1737-vcand-p166-R-022']:
              assert by[cid]['boundaryAssessment']=='undersegmented'
          linked={aid for r in rows for aid in r.get('linkedArticleIds',[])}
          assert linked=={f'ALC1737-art-{n:06d}' for n in range(494,509)}
          miss=[json.loads(x) for x in Path('data/lexicon/reconciliation/p166_missed_visible_starts.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(miss)==1 and miss[0]['linkedArticleIds']==['ALC1737-art-000497']
          status=json.loads(Path('data/lexicon/reconciliation/p166_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['candidateInventory']['classification']['article']==50
          assert status['candidateInventory']['classification']['unresolved']==0
          assert status['promotion']['articleCandidatesPendingPromotion']==36
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==51
          assert status['nextPage']['candidateInventoryTotal']==55
          assert status['promotion']['corpusTotalAfterPass']==1045
          PY
      - name: Commit generated p166 evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p166_left_reconciliation.jsonl data/lexicon/reconciliation/p166_right_reconciliation.jsonl data/lexicon/reconciliation/p166_missed_visible_starts.jsonl data/lexicon/reconciliation/p166_machine_reconciliation_status.json
          git commit -m 'data: reconciliar conservadoramente p.166' -m '50 article; L-003 Palabra+Palma merged, 000497 como falso negativo interno, tres regiones undersegmented, 36 pending_promotion y borde p167 fresco.'
          git push origin HEAD:work/p166-reconciliation
