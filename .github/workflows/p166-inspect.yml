name: CHD p166 synchronize docs

on:
  push:
    branches: [work/p166-reconciliation]
    paths:
      - '.github/workflows/p166-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p166 docs
        run: python scripts/_tmp_sync_p166.py
      - name: Validate p166 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p166_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p166_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p166_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p166_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p166_preflight.json >/dev/null
          grep -F '**50 `article`**' docs/LEXICON_PROGRESS.md
          grep -F '36 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '55 candidatos canónicos: 30 izquierda y 25 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **166** tiene sus **50 candidatos canónicos reconciliados**' README.md
          grep -F 'página 167**, con 55 candidatos canónicos —30 izquierda y 25 derecha—' README.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.166' -m 'Registra 50 article, Palma arbol conocido como falso negativo interno, tres regiones undersegmented, 36 pending_promotion y fija p.167=55 candidatos.'
          git push origin HEAD:work/p166-reconciliation
