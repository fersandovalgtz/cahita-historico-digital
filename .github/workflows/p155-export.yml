name: CHD p156 edge export

on:
  push:
    branches: [work/p155-reconciliation]
    paths:
      - '.github/workflows/p155-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export canonical p156 candidates
        run: |
          echo '---P156-BEGIN---'
          python scripts/export_candidate_page.py --page 156
          echo '---P156-END---'
