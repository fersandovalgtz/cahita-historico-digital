name: CHD p155 materialize reconciliation

on:
  push:
    branches: [work/p155-reconciliation]
    paths:
      - '.github/workflows/p155-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate p155 reconciliation layers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          links = {
            'L-002':['ALC1737-art-000330','ALC1737-art-000331'],
            'L-003':['ALC1737-art-000332'],'L-004':['ALC1737-art-000333'],'L-005':['ALC1737-art-000334'],
            'L-007':['ALC1737-art-000335'],'L-008':['ALC1737-art-000336'],'L-009':['ALC1737-art-000337'],
            'L-010':['ALC1737-art-000338'],'L-011':['ALC1737-art-000339'],'L-012':['ALC1737-art-000340'],
            'L-013':['ALC1737-art-000341'],'L-015':['ALC1737-art-000342'],
            'R-001':['ALC1737-art-000343'],'R-002':['ALC1737-art-000343']
          }
          continuations = {'L-001','R-002','R-004','R-007'}
          split_starts = {'R-001','R-003','R-006'}
          provenance = {
            'derivedFrom':'canonical-v0.2 candidate inventory; p155 selected article layer where linked; p154 and p156 candidate layers for page-edge context',
            'agent':'GPT-5.6 Sol machine reconciliation',
            'method':'AI-assisted structural reconciliation from canonical geometry/OCR and pre-existing selected direct-collation anchors; no independent human verification',
            'processedAt':None
          }

          def rec(side,n):
            key=f'{side}-{n:03d}'
            cid=f'ALC1737-vcand-p155-{key}'
            col='left' if side=='L' else 'right'
            linked=links.get(key,[])
            if key in continuations:
              notes={
                'L-001':'Form-only continuation `nuc. bibuatua.` of p154 R-029 (`Durar mucho tiempo`). Not a fresh p155 lexical start.',
                'R-002':'Form-only continuation `Abetia.` of selected article 000343 (`Encender candela, ò tea`) whose geometrically supported but OCR-damaged start is R-001.',
                'R-004':'Form-only continuation `Naiate.` of R-003 (`Encender lumbre hazerla`).',
                'R-007':'Form-only continuation `Ananquec.` of R-006 (`Encontrar à caſo`).'
              }
              return {
                'candidateId':cid,'sourceId':'ALC1737','sourcePageDigital':155,'column':col,
                'classification':'continuation','boundaryAssessment':'not_applicable','linkedArticleIds':linked,
                'articleLinkStatus':'not_applicable','continuationType':'from_previous_line' if key!='L-001' else 'from_previous_page',
                'editorialNote':notes[key],'reviewStatus':'machine_corrected_unverified','humanVerified':False,'provenance':provenance
              }

            assessment='exact'
            if key=='L-002':
              assessment='merged_articles'
              note='Candidate begins selected 000330 (`Dar de veſtir à otro. Aſupecua.`) and absorbs damaged fragments of selected 000331 (`Echar, ò vaciar. Amahuotia, l, aborotia.`). The selected direct-collation objects remain the stronger transcription anchors.'
            elif key in split_starts:
              assessment='oversegmented'
              nxt={'R-001':'R-002','R-003':'R-004','R-006':'R-007'}[key]
              if key=='R-001':
                note='Geometrically supported start of selected 000343 (`Encender candela, ò tea`). OCR loses most of the guide but preserves guide/form fragments; R-002 is form-only continuation `Abetia.`.'
              else:
                note=f'Distinct article start split by extractor geometry; {nxt} is form-only continuation rather than a fresh lexical start.'
            elif key=='R-024':
              assessment='undersegmented'
              note='Distinct `Enoxo` article start with trailing damaged `Acw` material before fresh R-025 `Enredar`; the extra text is preserved without inventing another start.'
            elif key=='R-026':
              assessment='undersegmented'
              note='Distinct `Enroſcarſe la bibora` article start with trailing damaged `Eafar-...` page-edge/catchword material. p156 L-001 begins fresh `Enſeñar`; no long article continuation is asserted.'
            elif linked:
              note='Aligned to selected direct-collation article anchor.'
            else:
              note='Distinct lexical start; retained pending because raw OCR alone is not a sufficient transcription anchor for promotion.'
            return {
              'candidateId':cid,'sourceId':'ALC1737','sourcePageDigital':155,'column':col,
              'classification':'article','boundaryAssessment':assessment,'linkedArticleIds':linked,
              'articleLinkStatus':'linked' if linked else 'pending_promotion','editorialNote':note,
              'reviewStatus':'machine_corrected_unverified','humanVerified':False,'provenance':provenance
            }

          out=Path('data/lexicon/reconciliation')
          for side,count,filename in [('L',23,'p155_left_reconciliation.jsonl'),('R',26,'p155_right_reconciliation.jsonl')]:
            rows=[rec(side,i) for i in range(1,count+1)]
            (out/filename).write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in rows)+'\n',encoding='utf-8')

          misses=[
            {
              'missedStartId':'ALC1737-miss-p155-L-001','sourceId':'ALC1737','sourcePageDigital':155,'column':'left',
              'visibleStartRaw':'Dar de beber à otro. Abitua.','missType':'page_or_column_edge','containingCandidateId':None,
              'linkedArticleIds':['ALC1737-art-000329'],
              'editorialNote':'Selected 000329 occurs after the p154 continuation L-001 and before canonical L-002. This is a demonstrated known miss, not an exhaustive census claim.',
              'reviewStatus':'machine_corrected_unverified','humanVerified':False,
              'provenance':{'agent':'GPT-5.6 Sol machine reconciliation','method':'AI-assisted alignment of canonical p155 geometry with pre-existing selected direct-collation layer; no independent human verification','processedAt':None}
            },
            {
              'missedStartId':'ALC1737-miss-p155-L-002','sourceId':'ALC1737','sourcePageDigital':155,'column':'left',
              'visibleStartRaw':'Echar, ò vaciar. Amahuotia, l, aborotia.','missType':'inside_candidate_group','containingCandidateId':'ALC1737-vcand-p155-L-002',
              'linkedArticleIds':['ALC1737-art-000331'],
              'editorialNote':'Selected 000331 is a distinct historical start absorbed inside canonical L-002 after selected 000330. This layer records the known internal false negative without claiming exhaustive visible-start coverage.',
              'reviewStatus':'machine_corrected_unverified','humanVerified':False,
              'provenance':{'agent':'GPT-5.6 Sol machine reconciliation','method':'AI-assisted alignment of canonical p155 geometry with pre-existing selected direct-collation layer; no independent human verification','processedAt':None}
            }
          ]
          (out/'p155_missed_visible_starts.jsonl').write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in misses)+'\n',encoding='utf-8')

          status={
            'sourceId':'ALC1737','sourcePageDigital':155,
            'pageStatus':{'candidateReconciliation':'complete','visibleStartCensus':'known_misses_only_not_exhaustive','promotionLinkage':'partial','technicalClosure':False,'humanVerificationPlanned':False},
            'candidateInventory':{'total':49,'left':23,'right':26,'classification':{'article':45,'continuation':4,'paratext':0,'false_positive':0,'unresolved':0},'boundaryAssessment':{'exact':39,'oversegmented':3,'undersegmented':2,'merged_articles':1,'ambiguous':0,'not_applicable':4}},
            'selectedLayer':{'preExistingArticles':15,'articleIdRange':['ALC1737-art-000329','ALC1737-art-000343'],'articleCandidateRecordsLinked':13,'structuredArticlesLinked':15,'continuationCandidateRecordsLinked':1,'selectedStartsOutsideCandidateInventory':1,'selectedArticlesUnlinked':0,'mergedCandidateId':'ALC1737-vcand-p155-L-002','mergedSelectedArticleIds':['ALC1737-art-000330','ALC1737-art-000331']},
            'promotion':{'articleCandidatesPendingPromotion':32,'newPromotionsThisPass':0,'corpusTotalAfterPass':1045},
            'visibleStartEvidence':{'exhaustive':False,'knownVisibleStartsMinimum':47,'knownMissedStartRecords':2,'knownMergedInternalStarts':1,'precision':None,'recall':None,'f1':None,'reasonMetricsWithheld':'The 45 article candidates, one additional selected start absorbed inside L-002, and selected 000329 outside the candidate inventory establish at least 47 starts. The selected layer is non-exhaustive, so no complete denominator or performance metric is asserted.'},
            'physicalContinuities':[
              {'from':'ALC1737-vcand-p154-R-029','to':'ALC1737-vcand-p155-L-001','type':'article_continuation','note':'`Durar mucho tiempo` continues as form-only `nuc. bibuatua.`.'},
              {'from':'ALC1737-vcand-p155-R-001','to':'ALC1737-vcand-p155-R-002','type':'article_continuation','note':'Selected `Encender candela, ò tea` spans OCR-damaged R-001 and form-only R-002 `Abetia.`.'},
              {'from':'ALC1737-vcand-p155-R-003','to':'ALC1737-vcand-p155-R-004','type':'article_continuation'},
              {'from':'ALC1737-vcand-p155-R-006','to':'ALC1737-vcand-p155-R-007','type':'article_continuation'},
              {'from':'ALC1737-vcand-p155-R-026','to':'ALC1737-vcand-p156-L-001','type':'catchword_to_article','note':'Trailing damaged `Eafar-...` is treated as page-edge/catchword material anticipating fresh p156 `Enſeñar`, not as a long p155 article continuation.'}
            ],
            'structuralNotes':['L-002 is a merged-start region containing selected 000330 and 000331.','Selected 000329 is a demonstrated left-edge false negative between the inherited continuation L-001 and fresh candidate L-002.','R-001 provides the structural boundary for selected 000343 despite severe guide loss in OCR; R-002 is its continuation.'],
            'evidence':{'canonicalCandidateInventoryVerified':True,'canonicalCandidateInventoryCount':2072,'selectedP155LayerUsedAsAnchor':True,'p154AndP156CandidateLayersUsedForPageEdges':True,'directFacsimileAvailableThisPass':False,'policy':'Known misses are separated from candidate reconciliation; OCR guide loss does not erase a geometrically supported boundary when selected collation and continuation evidence converge; metrics remain withheld without exhaustive census.'},
            'reviewStatus':'machine_corrected_unverified','humanVerified':False
          }
          (out/'p155_machine_reconciliation_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate generated reconciliation
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p155_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p155_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p155_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p155_machine_reconciliation_status.json >/dev/null
      - name: Commit generated evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p155_left_reconciliation.jsonl data/lexicon/reconciliation/p155_right_reconciliation.jsonl data/lexicon/reconciliation/p155_missed_visible_starts.jsonl data/lexicon/reconciliation/p155_machine_reconciliation_status.json
          git commit -m 'data: reconciliar estructuralmente p.155' -m '49/49 candidatos: 45 article y 4 continuation; dos falsos negativos conocidos, L-002 merged_articles, 32 pending_promotion y métricas retenidas por censo no exhaustivo.'
          git push origin HEAD:work/p155-reconciliation
