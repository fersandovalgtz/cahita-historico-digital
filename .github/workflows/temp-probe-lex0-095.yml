name: TEMP probe Lex-0 0.9.5

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Jing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jing
      - name: Probe official schemas and validate CHD TEI
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/lex0 /tmp/chd-tei
          current='https://lex-0.org/schema/lex-0.rng'
          archived='https://lex-0.org/releases/v0.9.5/schema/lex-0.rng'
          for pair in "current:$current" "archived:$archived"; do
            name="${pair%%:*}"
            url="${pair#*:}"
            echo "=== $name $url ==="
            code=$(curl -L --retry 3 --connect-timeout 15 -sS -w '%{http_code}' -o "/tmp/lex0/$name.rng" "$url" || true)
            echo "HTTP=$code"
            if [ -s "/tmp/lex0/$name.rng" ]; then
              wc -c "/tmp/lex0/$name.rng"
              sha256sum "/tmp/lex0/$name.rng"
              head -n 3 "/tmp/lex0/$name.rng"
            fi
          done
          if [ -s /tmp/lex0/current.rng ] && [ -s /tmp/lex0/archived.rng ]; then
            echo '=== schema byte comparison ==='
            cmp -s /tmp/lex0/current.rng /tmp/lex0/archived.rng && echo 'SCHEMAS_IDENTICAL=true' || echo 'SCHEMAS_IDENTICAL=false'
          fi
          python scripts/export_lexicon_tei.py --out-dir /tmp/chd-tei
          schema=''
          if [ -s /tmp/lex0/archived.rng ]; then schema=/tmp/lex0/archived.rng; elif [ -s /tmp/lex0/current.rng ]; then schema=/tmp/lex0/current.rng; fi
          if [ -z "$schema" ]; then echo 'NO_SCHEMA_AVAILABLE'; exit 2; fi
          echo "=== Jing validation against $schema ==="
          set +e
          jing "$schema" /tmp/chd-tei/chd_lexicon_tei.xml > /tmp/jing.out 2>&1
          status=$?
          set -e
          echo "JING_EXIT=$status"
          cat /tmp/jing.out
          exit "$status"
