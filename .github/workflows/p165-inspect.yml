name: CHD p165 synchronize docs

on:
  push:
    branches: [work/p165-reconciliation]
    paths:
      - '.github/workflows/p165-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p165 docs
        run: python scripts/_tmp_sync_p165.py
      - name: Validate p165 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p165_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p165_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p165_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p165_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p165_preflight.json >/dev/null
          grep -F '52 `article` y **4 `continuation`**' docs/LEXICON_PROGRESS.md
          grep -F '38 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '50 candidatos canónicos: 28 izquierda y 22 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **165** tiene sus **56 candidatos canónicos reconciliados**' README.md
          grep -F 'página 166**, con 50 candidatos canónicos —28 izquierda y 22 derecha—' README.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.165' -m 'Registra 52 article, 4 continuation, Oyr como falso negativo interno, 38 pending_promotion y fija p.166=50 candidatos.'
          git push origin HEAD:work/p165-reconciliation
