name: Apply p145 Phase II pilot A v3

on:
  push:
    branches:
      - work/p145-phase2-pilot-a

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scientific pilot data
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          root=Path('.')
          artdir=root/'data/lexicon/articles'
          current=[]
          for p in sorted(artdir.glob('*.jsonl')):
              current += [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          ids=[x['articleId'] for x in current]
          assert len(ids)==len(set(ids))
          assert max(int(x.rsplit('-',1)[1]) for x in ids)==1045

          ev=json.loads((root/'data/lexicon/reconciliation/p145_phase2_pilot_a_evidence_2026-08-17.json').read_text(encoding='utf-8'))
          expected=['ALC1737-art-001046','ALC1737-art-001047','ALC1737-art-001048','ALC1737-art-001049']
          assert [x['articleId'] for x in ev['promotions']]==expected

          articles=[]
          for x in ev['promotions']:
              articles.append({
                  'articleId':x['articleId'],
                  'sourceId':'ALC1737',
                  'sourcePageDigital':145,
                  'column':'left',
                  'articleType':'equivalence',
                  'spanishGuideRaw':x['spanishGuideRaw'],
                  'cahitaFormsRaw':[{'formRaw':f,'historicalVariety':'unspecified'} for f in x['cahitaFormsRaw']],
                  'transcriptionRaw':x['transcriptionRaw'],
                  'editorialNote':'Phase II pilot A. Promoted only after strong convergence across three independent readings of verified ALC1737 PDF page 145 at 420 dpi. Materially divergent candidates were excluded; BUE1890 did not supply the transcription.',
                  'reviewStatus':'machine_corrected_unverified',
                  'humanVerified':False,
                  'provenance':{
                      'derivedFrom':f"ALC1737:digital-page-145; canonical-v0.2:{x['candidateId']}; p145_phase2_pilot_a_evidence_2026-08-17.json",
                      'agent':'GPT-5.6 Sol facsimile-assisted collation',
                      'method':'AI-assisted collation of verified ALC1737 PDF page 145 (SHA-256 4dcc4abacefa94396e5dd2255184080b868cdca3f73ef5093b1c752611713959), rendered at 420 dpi and compared across three independent same-witness OCR passes; no independent human verification',
                      'processedAt':None
                  },
                  'derivedFromCandidates':[x['candidateId']]
              })
          promo=artdir/'p145_promotions_phase2_a.jsonl'
          promo.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in articles)+'\n',encoding='utf-8')

          left_path=root/'data/lexicon/reconciliation/p145_left_reconciliation.jsonl'
          right_path=root/'data/lexicon/reconciliation/p145_right_reconciliation.jsonl'
          left=[json.loads(x) for x in left_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          right=[json.loads(x) for x in right_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          mapping={x['candidateId']:x['articleId'] for x in ev['promotions']}
          changed=0
          for r in left:
              if r['candidateId'] not in mapping:
                  continue
              assert r['classification']=='article'
              assert r['articleLinkStatus']=='pending_promotion'
              assert r['linkedArticleIds']==[]
              r['linkedArticleIds']=[mapping[r['candidateId']]]
              r['articleLinkStatus']='linked'
              r['editorialNote']=r['editorialNote'].rstrip()+f" Phase II pilot A promotes this candidate as {mapping[r['candidateId']]}; see p145_phase2_pilot_a_evidence_2026-08-17.json."
              r['provenance']={
                  'derivedFrom':'canonical-v0.2 candidate inventory; verified ALC1737 PDF page 145; p145_phase2_pilot_a_evidence_2026-08-17.json',
                  'agent':'GPT-5.6 Sol facsimile-assisted collation',
                  'method':'Candidate linkage after conservative same-witness multi-pass facsimile collation; no independent human verification',
                  'processedAt':None
              }
              changed+=1
          assert changed==4
          allrows=left+right
          assert sum(1 for r in allrows if r['articleLinkStatus']=='linked')==18
          assert sum(1 for r in allrows if r['articleLinkStatus']=='pending_promotion')==17
          assert sum(1 for r in allrows if r['classification']=='article' and r['articleLinkStatus']=='linked')==17
          left_path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in left)+'\n',encoding='utf-8')

          status_path=root/'data/lexicon/reconciliation/p145_machine_reconciliation_status.json'
          status=json.loads(status_path.read_text(encoding='utf-8'))
          status['linkage'].update({
              'articleCandidateRecordsLinked':17,
              'preExistingStructuredArticlesLinked':18,
              'articleCandidatesPendingPromotion':17,
              'unresolvedCandidateBoundaries':0
          })
          status['curation']['newPromotionsThisPass']=4
          status['curation']['corpusTotalAfterPass']=1049
          status['machineEvidence']['phase2PilotAEvidence']='p145_phase2_pilot_a_evidence_2026-08-17.json'
          status['machineEvidence']['phase2PilotAFacsimile']={
              'provider':'Internet Archive',
              'identifier':'artedelalenguaca00gonz',
              'pdfPage':145,
              'pageSha256':'4dcc4abacefa94396e5dd2255184080b868cdca3f73ef5093b1c752611713959',
              'renderDpi':420,
              'passes':3,
              'use':'promotion only where guide and Cahita form converge strongly across same-witness readings'
          }
          note='Phase II pilot A promotes L-011→ALC1737-art-001046 (`Ave. Saperac.`), L-013→001047 (`Ave. Baecuberi.`), L-018→001048 (`A vno. Cae.`), and L-019→001049 (`Aunque. Elapo.`) after strong same-witness facsimile convergence; divergent candidates remain pending.'
          if note not in status.get('resolvedThisPass',[]):
              status.setdefault('resolvedThisPass',[]).append(note)
          status['authorityNote']='P.145 has complete candidate-level structural reconciliation and a first conservative Phase II facsimile-assisted promotion batch. Four candidates were promoted only after strong same-witness convergence on verified ALC1737 PDF page 145. Seventeen article candidates remain pending_promotion; the visible-start census remains non-exhaustive and humanVerified remains false.'
          status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          subprocess.run(['python','scripts/summarize_open_lexicon_work.py','--output','data/lexicon/reconciliation/phase2_open_work_summary.json'],check=True)
          summary=json.loads((root/'data/lexicon/reconciliation/phase2_open_work_summary.json').read_text(encoding='utf-8'))
          s=summary['summary']
          assert s['pendingPromotionTotal']==1047, s
          assert s['unresolvedCandidateTotal']==1, s
          assert s['currentCuratorialArticleCount']==1049, s
          assert summary['unresolvedPages']==[{'page':161,'count':1,'terminalDecision':'explicit_conservative_nonresolution'}]
          PY
      - name: Validate scientific output
        run: |
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexical-article.schema.json --jsonl data/lexicon/articles/p145_promotions_phase2_a.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p145_left_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p145_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p145_phase2_pilot_a_evidence_2026-08-17.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/phase2_open_work_summary.json >/dev/null
          python scripts/reconstruct_candidate_inventory.py
      - name: Commit scientific pilot output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/articles/p145_promotions_phase2_a.jsonl data/lexicon/reconciliation/p145_left_reconciliation.jsonl data/lexicon/reconciliation/p145_machine_reconciliation_status.json data/lexicon/reconciliation/phase2_open_work_summary.json
          git commit -m "data: promover lote piloto p145-A en fase II"
          git push
