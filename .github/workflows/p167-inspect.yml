name: CHD p167 synchronize docs

on:
  push:
    branches: [work/p167-reconciliation]
    paths:
      - '.github/workflows/p167-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p167 docs
        run: python scripts/_tmp_sync_p167.py
      - name: Validate p167 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p167_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p167_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p167_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p167_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p167_preflight.json >/dev/null
          grep -F '**54 `article`** y **1 `continuation`**' docs/LEXICON_PROGRESS.md
          grep -F '40 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '32 candidatos: 14 izquierda y 18 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **167** tiene sus **55 candidatos canónicos reconciliados**' README.md
          grep -F 'página 168**, con 32 candidatos canónicos —14 izquierda y 18 derecha—' README.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.167' -m 'Registra 54 article, 1 continuation, 000519 como falso negativo interno, 40 pending_promotion y fija p.168=32 candidatos.'
          git push origin HEAD:work/p167-reconciliation
