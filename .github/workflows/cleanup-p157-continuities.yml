name: Cleanup p157 continuities

on:
  push:
    branches:
      - work/p157-structural-resolution

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deduplicate physical continuities and validate invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/lexicon/reconciliation/p157_machine_reconciliation_status.json')
          status = json.loads(path.read_text(encoding='utf-8'))
          original_gap = json.dumps(status['sourceGap'], ensure_ascii=False, sort_keys=True)

          seen = set()
          deduped = []
          for item in status.get('physicalContinuities', []):
              key = (item.get('from'), item.get('to'), item.get('type'))
              if key in seen:
                  continue
              seen.add(key)
              deduped.append(item)
          status['physicalContinuities'] = deduped

          assert sum(1 for x in deduped if x.get('from') == 'ALC1737-vcand-p157-L-012' and x.get('to') == 'ALC1737-vcand-p157-L-013') == 1
          assert status['candidateInventory']['classification']['unresolved'] == 0
          assert status['candidateInventory']['classification']['article'] == 38
          assert status['candidateInventory']['classification']['continuation'] == 4
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum'] == 44
          assert status['visibleStartEvidence']['knownMissedStartRecords'] == 6
          assert status['promotion']['corpusTotalAfterPass'] == 1045
          assert status['humanVerified'] is False
          assert json.dumps(status['sourceGap'], ensure_ascii=False, sort_keys=True) == original_gap

          path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p157_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p157_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p157_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p157_structural_resolution_2026-08-17.json >/dev/null
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/reconciliation/p157_machine_reconciliation_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: deduplicar continuidades físicas de p.157"
          git push
