name: TEMP CHD Xref Batch07

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    name: Print next Tier-B review batch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Print next eight Tier-B cases from permanent queue
        run: python scripts/export_crossreference_review_queue.py --out-dir /tmp/xrefqueue --print-next 8 --tier B_multiple_strong
