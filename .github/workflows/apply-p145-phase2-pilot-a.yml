name: Apply p145 Phase II pilot A

on:
  push:
    branches:
      - work/p145-phase2-pilot-a

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and apply conservative promotions
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root=Path('.')
          articles_dir=root/'data/lexicon/articles'
          ids=[]
          for p in sorted(articles_dir.glob('*.jsonl')):
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      obj=json.loads(line); ids.append(obj['articleId'])
          nums=[int(x.rsplit('-',1)[1]) for x in ids]
          assert len(ids)==len(set(ids)), 'duplicate article IDs before pilot'
          assert max(nums)==1045, max(nums)

          evidence=json.loads((root/'data/lexicon/reconciliation/p145_phase2_pilot_a_evidence_2026-08-17.json').read_text(encoding='utf-8'))
          expected_ids=['ALC1737-art-001046','ALC1737-art-001047','ALC1737-art-001048','ALC1737-art-001049']
          assert [x['articleId'] for x in evidence['promotions']]==expected_ids

          out=[]
          for item in evidence['promotions']:
              obj={
                  'articleId': item['articleId'],
                  'sourceId':'ALC1737',
                  'sourcePageDigital':145,
                  'column':'left',
                  'articleType':'equivalence',
                  'spanishGuideRaw':item['spanishGuideRaw'],
                  'cahitaFormsRaw':[{'formRaw':f,'historicalVariety':'unspecified'} for f in item['cahitaFormsRaw']],
                  'transcriptionRaw':item['transcriptionRaw'],
                  'editorialNote':'Phase II pilot promotion from verified ALC1737 PDF page 145. Same-witness facsimile readings converged across three independent 420 dpi OCR passes; candidates with material disagreement were explicitly excluded. BUE1890 was not used to supply this transcription.',
                  'reviewStatus':'machine_corrected_unverified',
                  'humanVerified':False,
                  'provenance':{
                      'derivedFrom':f"ALC1737:digital-page-145; canonical-v0.2:{item['candidateId']}; p145_phase2_pilot_a_evidence_2026-08-17.json",
                      'agent':'GPT-5.6 Sol facsimile-assisted collation',
                      'method':'AI-assisted collation of verified ALC1737 PDF page 145 (SHA-256 4dcc4abacefa94396e5dd2255184080b868cdca3f73ef5093b1c752611713959), rendered at 420 dpi and read with three independent same-witness OCR passes; no independent human verification',
                      'processedAt':None,
                  },
                  'derivedFromCandidates':[item['candidateId']],
              }
              out.append(obj)
          promo_path=articles_dir/'p145_promotions_phase2_a.jsonl'
          promo_path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in out)+'\n',encoding='utf-8')

          rec_path=root/'data/lexicon/reconciliation/p145_left_reconciliation.jsonl'
          rows=[json.loads(x) for x in rec_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          mapping={x['candidateId']:x['articleId'] for x in evidence['promotions']}
          for row in rows:
              cid=row['candidateId']
              if cid in mapping:
                  assert row['classification']=='article'
                  assert row['articleLinkStatus']=='pending_promotion'
                  assert not row['linkedArticleIds']
                  row['linkedArticleIds']=[mapping[cid]]
                  row['articleLinkStatus']='linked'
                  row['editorialNote']=row['editorialNote'].rstrip()+f" Phase II pilot A promotes this candidate as {mapping[cid]} from verified same-witness facsimile convergence; see p145_phase2_pilot_a_evidence_2026-08-17.json."
                  row['provenance']={
                      'derivedFrom':f"canonical-v0.2 candidate inventory; verified ALC1737 PDF page 145; p145_phase2_pilot_a_evidence_2026-08-17.json",
                      'agent':'GPT-5.6 Sol facsimile-assisted collation',
                      'method':'Candidate linkage after conservative same-witness multi-pass facsimile collation; no independent human verification',
                      'processedAt':None,
                  }
          assert sum(1 for r in rows if r['articleLinkStatus']=='linked')==17
          assert sum(1 for r in rows if r['articleLinkStatus']=='pending_promotion')==12
          rec_path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in rows)+'\n',encoding='utf-8')

          status_path=root/'data/lexicon/reconciliation/p145_machine_reconciliation_status.json'
          status=json.loads(status_path.read_text(encoding='utf-8'))
          status['linkage']['articleCandidateRecordsLinked']=17
          status['linkage']['preExistingStructuredArticlesLinked']=18
          status['linkage']['articleCandidatesPendingPromotion']=17
          status['curation']['newPromotionsThisPass']=4
          status['curation']['corpusTotalAfterPass']=1049
          status['machineEvidence']['phase2PilotAEvidence']='p145_phase2_pilot_a_evidence_2026-08-17.json'
          status['machineEvidence']['phase2PilotAFacsimile']={
              'provider':'Internet Archive',
              'identifier':'artedelalenguaca00gonz',
              'pdfPage':145,
              'pageSha256':'4dcc4abacefa94396e5dd2255184080b868cdca3f73ef5093b1c752611713959',
              'renderDpi':420,
              'passes':3,
              'use':'promotion only where Spanish guide and Cahita form converge strongly across same-witness readings'
          }
          status['resolvedThisPass'].append('Phase II pilot A promotes four exact left-column candidates after verified same-witness facsimile convergence: L-011→ALC1737-art-001046 (`Ave. Saperac.`), L-013→001047 (`Ave. Baecuberi.`), L-018→001048 (`A vno. Cae.`), and L-019→001049 (`Aunque. Elapo.`). Candidates with materially divergent readings remain pending.')
          status['authorityNote']='P.145 has complete candidate-level machine structural reconciliation and now includes a first conservative Phase II facsimile-assisted promotion batch. Four candidates were promoted only after strong same-witness convergence across independent readings of verified ALC1737 PDF page 145. The visible-start census remains non-exhaustive, 17 article candidates remain pending_promotion, humanVerified remains false, and no uncertainty is upgraded from secondary control alone.'
          status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Regenerate Phase II summary using the permanent read-only script.
          import subprocess
          subprocess.run(['python','scripts/summarize_open_lexicon_work.py','--output','data/lexicon/reconciliation/phase2_open_work_summary.json'],check=True)
          summary=json.loads((root/'data/lexicon/reconciliation/phase2_open_work_summary.json').read_text(encoding='utf-8'))
          s=summary['summary']
          assert s['pendingPromotionTotal']==1047, s
          assert s['unresolvedCandidateTotal']==1
          assert s['currentCuratorialArticleCount']==1049, s
          assert summary['unresolvedPages'][0]['page']==161

          # Rewrite human Phase II dashboard from regenerated summary.
          top=summary['pendingPromotionRanking'][:10]
          lines=[
              '# Fase II — promoción, enlace y censo visible','',
              'Estado computacional regenerable para p.145–177.','',
              f'- Páginas cubiertas: **{s["pages"]}**.',
              f'- Candidatos `pending_promotion`: **{s["pendingPromotionTotal"]}**.',
              f'- Candidatos estructuralmente `unresolved`: **{s["unresolvedCandidateTotal"]}**.',
              f'- Páginas con censo visible exhaustivo: **{s["pagesWithExhaustiveVisibleStartCensus"]}**.',
              f'- Corpus curatorial actual: **{s["currentCuratorialArticleCount"]:,} artículos**.','',
              '## Avance de fase II','',
              'El lote piloto **p.145-A** promovió cuatro artículos mediante colación facsimilar asistida del propio ALC1737. El total pendiente descendió de **1,051 a 1,047**; las lecturas con discrepancias materiales permanecieron sin promoción.','',
              '## Excepción estructural conservada','',
              'La única página con candidato estructural `unresolved` es **p.161**, donde R-016 permanece deliberadamente abierto por evidencia terminal no única. No debe forzarse su clasificación para producir un cero artificial.','',
              '## Priorización por volumen de promoción pendiente','',
              '| Página | `pending_promotion` |','|---:|---:|',
          ]
          lines.extend(f'| {x["page"]} | {x["pendingPromotion"]} |' for x in top)
          lines += [
              '', '## Regla de trabajo','',
              'La fase II separa **promoción/enlace de artículos**, **registro de falsos negativos visibles** y **censo exhaustivo**. Un candidato no se promueve sólo porque el OCR sugiera una lectura: para texto cahíta incierto se exige evidencia suficientemente fuerte del testigo ALC1737. BUE1890 permanece como control secundario sin sustitución silenciosa.','',
              'El archivo `phase2_open_work_summary.json` es la fuente computacional y puede regenerarse con `python scripts/summarize_open_lexicon_work.py --output data/lexicon/reconciliation/phase2_open_work_summary.json`.',''
          ]
          (root/'docs/PHASE2_LEXICON_WORK.md').write_text('\n'.join(lines),encoding='utf-8')

          # Synchronize only current-state statements in LEXICON_PROGRESS.
          prog=root/'docs/LEXICON_PROGRESS.md'
          text=prog.read_text(encoding='utf-8')
          text=text.replace('La capa curatorial contiene actualmente **1,045 artículos históricos estructurados**.','La capa curatorial contiene actualmente **1,049 artículos históricos estructurados**.')
          old='Trece candidatos de artículo enlazan **14 objetos estructurados preexistentes** y **21 candidatos de artículo permanecen `pending_promotion`**. No hubo promociones nuevas en el pase estructural y el corpus permanece en **1,045 artículos**. `ALC1737-art-001045` (`Atormentar`) conserva su continuidad p.144→145 y la forma `chumtieſte` permanece de baja confianza.'
          new='Tras el primer lote de fase II, **17 candidatos de artículo enlazan 18 objetos estructurados** y **17 candidatos de artículo permanecen `pending_promotion`**. El lote piloto p.145-A añadió cuatro promociones (`ALC1737-art-001046`–`001049`) y elevó el corpus curatorial actual a **1,049 artículos**. `ALC1737-art-001045` (`Atormentar`) conserva su continuidad p.144→145 y la forma `chumtieſte` permanece de baja confianza.'
          assert old in text
          text=text.replace(old,new)
          anchor='La evidencia suplementaria de **R-017** conserva `Babear` únicamente como hipótesis fuerte de guía para el comienzo dañado absorbido después de `Bagre`, apoyada por la secuencia del control histórico BUE1890; ninguna forma cahíta de la reimpresión se transfiere al testigo de 1737. R-012 mantiene la guía `Atomo`, pero su forma ALC1737 sigue demasiado dañada para promoción.\n'
          insert=anchor+'\nEl **lote piloto p.145-A** utilizó la página 145 del PDF de ALC1737 verificada por checksum y tres lecturas independientes de un render a 420 dpi. Sólo se promovieron `Ave. Saperac.`, `Ave. Baecuberi.`, `A vno. Cae.` y `Aunque. Elapo.`; formas con divergencias como `Huchai/Hucbai`, `Tenbie/Tenbile`, `Tucabuiro/Tucabuire` o `Putre/Huite/Hutte` permanecen pendientes. La evidencia completa se conserva en `p145_phase2_pilot_a_evidence_2026-08-17.json`.\n'
          assert anchor in text
          text=text.replace(anchor,insert)
          prog.write_text(text,encoding='utf-8')
          PY
      - name: Validate article IDs, schemas, reconciliation and summaries
        run: |
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexical-article.schema.json --jsonl data/lexicon/articles/p145_promotions_phase2_a.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p145_left_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p145_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p145_phase2_pilot_a_evidence_2026-08-17.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/phase2_open_work_summary.json >/dev/null
          python scripts/reconstruct_candidate_inventory.py
      - name: Commit pilot batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/articles/p145_promotions_phase2_a.jsonl data/lexicon/reconciliation/p145_left_reconciliation.jsonl data/lexicon/reconciliation/p145_machine_reconciliation_status.json data/lexicon/reconciliation/phase2_open_work_summary.json docs/PHASE2_LEXICON_WORK.md docs/LEXICON_PROGRESS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: promover lote piloto p145-A en fase II"
          git push
