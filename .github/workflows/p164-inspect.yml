name: CHD p164 synchronize docs

on:
  push:
    branches: [work/p164-reconciliation]
    paths:
      - '.github/workflows/p164-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p164 docs
        run: python scripts/_tmp_sync_p164.py
      - name: Validate p164 package and synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p164_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p164_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p164_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p164_preflight.json >/dev/null
          grep -F '51 `article`, sin continuaciones ni candidatos estructuralmente `unresolved`' README.md
          grep -F '36 fronteras `pending_promotion`' README.md
          grep -F 'página 165**, con 56 candidatos canónicos —29 izquierda y 27 derecha—' README.md
          grep -F '51 `article`' docs/LEXICON_PROGRESS.md
          grep -F '36 candidatos de artículo `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '56 candidatos canónicos: 29 izquierda y 27 derecha' docs/LEXICON_PROGRESS.md
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.164' -m 'Registra 51 article, tres merged_articles, 36 pending_promotion y fija p.165=56 candidatos como siguiente frente.'
          git push origin HEAD:work/p164-reconciliation
