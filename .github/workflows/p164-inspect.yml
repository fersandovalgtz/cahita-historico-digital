name: CHD p164 inspection

on:
  push:
    branches: [work/p164-reconciliation]
    paths:
      - '.github/workflows/p164-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export p164 and p165 edge
        run: |
          echo '---P164-BEGIN---'
          python scripts/export_candidate_page.py --page 164
          echo '---P164-END---'
          echo 'P165 TOTAL'
          python scripts/export_candidate_page.py --page 165 --count-only
          echo 'P165 LEFT'
          python scripts/export_candidate_page.py --page 165 --column left --count-only
          echo 'P165 RIGHT'
          python scripts/export_candidate_page.py --page 165 --column right --count-only
          echo '---P165-BEGIN---'
          python scripts/export_candidate_page.py --page 165
          echo '---P165-END---'
