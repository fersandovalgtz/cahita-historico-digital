name: CHD p152 synchronize docs and QA

on:
  push:
    branches: [work/p152-reconciliation]
    paths:
      - '.github/workflows/p152-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p152 state
        run: python scripts/_tmp_sync_p152.py
      - name: Validate synchronized state
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p152_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p152_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p152_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p152_preflight.json >/dev/null
      - name: Commit synchronized state
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md .github/workflows/qa.yml
          git commit -m 'docs: cerrar reconciliación de p.152 y ampliar QA' -m 'Sincroniza el estado público a 52 article en p.152, conserva contaminación OCR y truncamiento textual explícitos, fija p.153 como siguiente frente y extiende CHD QA hasta p.152.'
          git push origin HEAD:work/p152-reconciliation
