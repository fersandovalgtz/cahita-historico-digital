name: CHD p152 materialize reconciliation

on:
  push:
    branches: [work/p152-reconciliation]
    paths:
      - '.github/workflows/p152-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate p152 reconciliation layers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          links = {
            'L-001':'ALC1737-art-000284','L-002':'ALC1737-art-000285','L-003':'ALC1737-art-000286',
            'L-004':'ALC1737-art-000287','L-005':'ALC1737-art-000288','L-007':'ALC1737-art-000289',
            'L-009':'ALC1737-art-000290','L-010':'ALC1737-art-000291','L-011':'ALC1737-art-000292',
            'L-015':'ALC1737-art-000293','L-016':'ALC1737-art-000294','L-019':'ALC1737-art-000295',
            'L-020':'ALC1737-art-000296','R-004':'ALC1737-art-000297','R-021':'ALC1737-art-000298'
          }
          provenance = {
            'derivedFrom':'canonical-v0.2 candidate inventory; p152 selected article layer where linked; p151 and p153 candidate/selected layers for page-edge context',
            'agent':'GPT-5.6 Sol machine reconciliation',
            'method':'AI-assisted structural reconciliation from canonical geometry/OCR and pre-existing selected direct-collation anchors; no independent human verification',
            'processedAt':None
          }

          def rec(side,n):
            key=f'{side}-{n:03d}'
            cid=f'ALC1737-vcand-p152-{key}'
            linked=links.get(key)
            note='Aligned to selected direct-collation article anchor.' if linked else 'Distinct lexical start; retained pending because raw OCR alone is not a sufficient transcription anchor for promotion.'
            if key=='L-006':
              note='Distinct article start `Criador Dios...`; the OCR candidate ends hyphenated. The next candidate L-007 begins fresh `Crucificar`, so no separate continuation candidate is invented and textual incompleteness remains explicit.'
            elif key=='R-002':
              note='Distinct `Cuyo?` article start. Trailing `Iotuc*` matches the selected Cahíta form of left-column article L-001 (`Crecer el hombre`) and is retained as probable cross-column OCR/layout contamination, not as another article start.'
            elif key=='R-024':
              note='Distinct page-bottom `Cuñado de muger...` article start with damaged trailing OCR. p153 L-001 begins fresh `Cuñado de hombre. Mocari.`; no long p152→p153 continuation is asserted.'
            return {
              'candidateId':cid,'sourceId':'ALC1737','sourcePageDigital':152,
              'column':'left' if side=='L' else 'right','classification':'article',
              'boundaryAssessment':'exact','linkedArticleIds':[linked] if linked else [],
              'articleLinkStatus':'linked' if linked else 'pending_promotion','editorialNote':note,
              'reviewStatus':'machine_corrected_unverified','humanVerified':False,'provenance':provenance
            }

          out=Path('data/lexicon/reconciliation')
          for side,count,filename in [('L',28,'p152_left_reconciliation.jsonl'),('R',24,'p152_right_reconciliation.jsonl')]:
            rows=[rec(side,i) for i in range(1,count+1)]
            (out/filename).write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in rows)+'\n',encoding='utf-8')

          status={
            'sourceId':'ALC1737','sourcePageDigital':152,
            'pageStatus':{'candidateReconciliation':'complete','visibleStartCensus':'not_exhaustive','promotionLinkage':'partial','technicalClosure':False,'humanVerificationPlanned':False},
            'candidateInventory':{'total':52,'left':28,'right':24,'classification':{'article':52,'continuation':0,'paratext':0,'false_positive':0,'unresolved':0},'boundaryAssessment':{'exact':52,'oversegmented':0,'undersegmented':0,'merged_articles':0,'ambiguous':0,'not_applicable':0}},
            'selectedLayer':{'preExistingArticles':15,'articleIdRange':['ALC1737-art-000284','ALC1737-art-000298'],'articleCandidateRecordsLinked':15,'structuredArticlesLinked':15,'selectedArticlesUnlinked':0},
            'promotion':{'articleCandidatesPendingPromotion':37,'newPromotionsThisPass':0,'corpusTotalAfterPass':1045},
            'visibleStartEvidence':{'exhaustive':False,'knownVisibleStartsMinimum':52,'precision':None,'recall':None,'f1':None,'reasonMetricsWithheld':'All 52 canonical candidates are structurally consistent with lexical starts, but the selected anchor layer is not exhaustive and cannot prove absence of additional missed starts. No performance denominator is asserted.'},
            'physicalContinuities':[
              {'from':'ALC1737-vcand-p151-R-027','to':'p152:left-top-unrepresented','type':'page_edge_article_continuation','note':'p151 `Coronilla...` may continue into page-top material before p152 L-001; p152 L-001 is fresh `Crecer el hombre`.'},
              {'from':'ALC1737-vcand-p152-R-024','to':'ALC1737-vcand-p153-L-001','type':'page_edge_context','note':'R-024 begins `Cuñado de muger...`; p153 L-001 begins fresh `Cuñado de hombre. Mocari.` No long article continuation is asserted.'}
            ],
            'structuralNotes':[
              'R-002 contains probable cross-column OCR/layout contamination: trailing `Iotuc*` matches the selected form of p152 L-001 and is not counted as another start.',
              'L-006 ends hyphenated in OCR, but L-007 begins a fresh `Crucificar` article; no continuation candidate is invented.'
            ],
            'evidence':{'canonicalCandidateInventoryVerified':True,'canonicalCandidateInventoryCount':2072,'selectedP152LayerUsedAsAnchor':True,'p151AndP153LayersUsedForPageEdges':True,'directFacsimileAvailableThisPass':False,'policy':'Structural starts may be classified from convergent candidate geometry, OCR context and selected anchors; OCR contamination and textual incompleteness remain explicit, and metrics are withheld without an exhaustive visible-start census.'},
            'reviewStatus':'machine_corrected_unverified','humanVerified':False
          }
          (out/'p152_machine_reconciliation_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate generated reconciliation
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p152_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p152_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p152_machine_reconciliation_status.json >/dev/null
      - name: Commit generated evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p152_left_reconciliation.jsonl data/lexicon/reconciliation/p152_right_reconciliation.jsonl data/lexicon/reconciliation/p152_machine_reconciliation_status.json
          git commit -m 'data: reconciliar estructuralmente p.152' -m '52/52 candidatos clasificados article; 15 anclas enlazadas, 37 pending_promotion, contaminación OCR intercolumna documentada y métricas retenidas por censo no exhaustivo.'
          git push origin HEAD:work/p152-reconciliation
