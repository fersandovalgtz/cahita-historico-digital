name: TEMP CHD Lo Mismo Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    name: Print Lo mismo candidate inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Export and print Lo mismo candidates
        run: |
          python scripts/export_lexicon_lo_mismo.py --out-dir /tmp/lo-mismo
          cat /tmp/lo-mismo/chd_lexicon_lo_mismo_candidates.jsonl
      - name: Print candidate records and same-column neighbors
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from scripts.export_lexicon_crossreference_graph import load_articles
          from scripts.export_lexicon_lo_mismo import load_candidates, article_number

          articles, _ = load_articles()
          candidates, _, _ = load_candidates()
          by_id = {a['articleId']: a for a in articles}
          groups = defaultdict(list)
          for a in articles:
              groups[(a.get('sourcePageDigital'), a.get('column'))].append(a)
          for rows in groups.values():
              rows.sort(key=lambda a: article_number(a['articleId']))

          for c in candidates:
              aid = c['articleId']
              a = by_id[aid]
              print('FULLCAND', json.dumps(a, ensure_ascii=False, sort_keys=True))
              rows = groups[(a.get('sourcePageDigital'), a.get('column'))]
              pos = next(i for i, x in enumerate(rows) if x['articleId'] == aid)
              print('CONTEXT', aid, a.get('sourcePageDigital'), a.get('column'))
              for x in rows[max(0,pos-4):pos+5]:
                  print('NEIGHBOR', x['articleId'], x.get('spanishGuideRaw'), '||', x.get('transcriptionRaw'))
          PY
      - name: Print canonical source files for Lo mismo candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids = {
            'ALC1737-art-000174','ALC1737-art-000225','ALC1737-art-000266','ALC1737-art-000267',
            'ALC1737-art-000400','ALC1737-art-000430','ALC1737-art-000431','ALC1737-art-000477',
            'ALC1737-art-000548','ALC1737-art-001595','ALC1737-art-001650','ALC1737-art-001705',
            'ALC1737-art-001997','ALC1737-art-002150'
          }
          found = {}
          for path in sorted(Path('data/lexicon/articles').glob('*.jsonl')):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip():
                      continue
                  obj = json.loads(line)
                  aid = obj.get('articleId')
                  if aid in ids:
                      found[aid] = (str(path), lineno)
          for aid in sorted(ids):
              print('ARTICLEFILE', aid, found.get(aid))
          if set(found) != ids:
              raise SystemExit(f'missing article ids: {sorted(ids-set(found))}')
          PY
