name: TEMP CHD Xref Batch12

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    name: Print final Tier-C review batch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Print final Tier-C cases from permanent queue
        run: python scripts/export_crossreference_review_queue.py --out-dir /tmp/xrefqueue --print-next 10 --tier C_no_strong
      - name: Inspect canonical guides for final Tier-C targets
        run: |
          python - <<'PY'
          from scripts.export_lexicon_crossreference_graph import load_articles, normalize_guide
          articles, _ = load_articles()
          searches = {
              'materia': ['materia'],
              'taparse': ['tapar', 'taparse'],
              'mezclar': ['mezcl', 'mescl'],
              'pelear': ['pelear'],
              'al_sin': ['al sin', 'al fin', 'ai fin', 'a fin'],
              'limpiar_mocos': ['limpiar', 'moco'],
          }
          for label, needles in searches.items():
              print('TARGETSCAN', label)
              rows=[]
              for article in articles:
                  raw=article.get('spanishGuideRaw')
                  if not raw: continue
                  norm=normalize_guide(raw)
                  if any(n in norm for n in needles):
                      rows.append((article['articleId'], article.get('sourcePageDigital'), article.get('column'), raw, norm))
              for row in rows[:50]: print('TARGETROW', row)
              print('TARGETCOUNT', len(rows))
          PY
