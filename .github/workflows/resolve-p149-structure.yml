name: Resolve p149 structure

on:
  push:
    branches:
      - work/p149-structural-resolution

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply conservative structural resolution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          left_path = Path('data/lexicon/reconciliation/p149_left_reconciliation.jsonl')
          rows = [json.loads(line) for line in left_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          by_id = {r['candidateId']: r for r in rows}
          l19 = by_id['ALC1737-vcand-p149-L-019']
          l19.update({
              'classification': 'article',
              'boundaryAssessment': 'exact',
              'linkedArticleIds': [],
              'articleLinkStatus': 'pending_promotion',
              'editorialNote': 'Resolved as the second Calentura article (`Calentura tener`) at candidate level. The canonical row begins at an independent left-margin start; L-018 already contains the first `Calentura` article plus an OCR `tener*` fragment, while recovered ALC1737 OCR and BUE1890 independently preserve the sequence `Calentura` → `Calentura tener` → `Caliente`. Exact ALC1737 Cahita form remains unpromoted.',
              'reviewStatus': 'machine_corrected_unverified',
              'humanVerified': False,
          })
          l19['provenance'] = {
              'derivedFrom': 'materialized canonical p149 candidate inventory; recovered ALC1737 OCR; BUE1890 secondary sequence control; p149 structural resolution record',
              'agent': 'GPT-5.6 Sol machine reconciliation',
              'method': 'Convergent structural reconciliation of an independent candidate start; guide identity supported by same-witness OCR sequence and later secondary control; no human verification and no form promotion',
              'processedAt': None,
          }
          left_path.write_text('\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n', encoding='utf-8')

          status_path = Path('data/lexicon/reconciliation/p149_machine_reconciliation_status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['pageStatus']['candidateReconciliation'] = 'complete'
          status['pageStatus']['technicalClosure'] = False
          status['candidateInventory']['classification'].update({'article': 56, 'continuation': 5, 'unresolved': 0})
          status['candidateInventory']['boundaryAssessment'].update({'exact': 48, 'oversegmented': 5, 'undersegmented': 3, 'merged_articles': 0, 'ambiguous': 0, 'not_applicable': 5})
          status['promotion']['articleCandidatesPendingPromotion'] = 41
          status['promotion']['newPromotionsThisPass'] = 0
          status['promotion']['corpusTotalAfterPass'] = 1045
          status['visibleStartEvidence']['knownVisibleStartsMinimum'] = 56
          status['visibleStartEvidence']['reasonMetricsWithheld'] = 'Candidate reconciliation now identifies 56 article starts and five continuations with zero unresolved candidate boundaries. The selected anchor layer remains non-exhaustive and cannot prove absence of additional missed starts; no performance denominator is asserted.'
          status['unresolvedNotes'] = []
          status['evidence']['structuralResolutionRecord'] = 'p149_structural_resolution_2026-08-17.json'
          status['evidence']['materializedCandidateView'] = 'data/lexicon/candidates/p149_candidates.jsonl'
          status['evidence']['recoveredPrimaryOcrSequenceUsed'] = True
          status['evidence']['bue1890SecondarySequenceControlUsed'] = True
          status['evidence']['policy'] = 'Candidate-level structure may be closed from convergent canonical geometry, same-witness OCR sequence and explicit secondary control. Uncertain lexical text is not strengthened or promoted, and the visible-start census remains non-exhaustive.'
          status['resolvedThisPass'] = [
              'L-019 is resolved as a real article boundary for the second Calentura entry (`Calentura tener`). Its independent canonical start at y=219.926, recovered ALC1737 OCR sequence and BUE1890 secondary sequence control converge on the same article order. L-018 retains undersegmented because OCR grouping absorbs the `tener*` fragment there. No ALC1737 Cahita form is promoted from this structural decision.'
          ]
          status['reviewStatus'] = 'machine_corrected_unverified'
          status['humanVerified'] = False
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          right_path = Path('data/lexicon/reconciliation/p149_right_reconciliation.jsonl')
          all_rows = rows + [json.loads(line) for line in right_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(all_rows) == 61, len(all_rows)
          classes = {}
          boundaries = {}
          for r in all_rows:
              classes[r['classification']] = classes.get(r['classification'], 0) + 1
              boundaries[r['boundaryAssessment']] = boundaries.get(r['boundaryAssessment'], 0) + 1
          assert classes.get('article', 0) == 56, classes
          assert classes.get('continuation', 0) == 5, classes
          assert classes.get('unresolved', 0) == 0, classes
          assert sum(classes.values()) == 61, classes
          assert boundaries.get('exact', 0) == 48, boundaries
          assert boundaries.get('oversegmented', 0) == 5, boundaries
          assert boundaries.get('undersegmented', 0) == 3, boundaries
          assert boundaries.get('merged_articles', 0) == 0, boundaries
          assert boundaries.get('ambiguous', 0) == 0, boundaries
          assert boundaries.get('not_applicable', 0) == 5, boundaries
          assert sum(boundaries.values()) == 61, boundaries
          assert status['promotion']['articleCandidatesPendingPromotion'] == 41
          assert status['promotion']['newPromotionsThisPass'] == 0
          assert status['promotion']['corpusTotalAfterPass'] == 1045
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum'] == 56
          assert status['visibleStartEvidence']['exhaustive'] is False
          assert status['visibleStartEvidence']['precision'] is None
          assert status['visibleStartEvidence']['recall'] is None
          assert status['visibleStartEvidence']['f1'] is None
          assert status['humanVerified'] is False
          PY
      - name: Run repository-native prechecks
        run: |
          python scripts/reconstruct_candidate_inventory.py
          python -m json.tool data/lexicon/reconciliation/p149_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p149_structural_resolution_2026-08-17.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('data/lexicon/reconciliation/p149_left_reconciliation.jsonl'),
              Path('data/lexicon/reconciliation/p149_right_reconciliation.jsonl'),
          ]:
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      json.loads(line)
          PY
      - name: Commit structural reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/reconciliation/p149_left_reconciliation.jsonl data/lexicon/reconciliation/p149_machine_reconciliation_status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: resolver L-019 como segundo artículo Calentura en p.149"
          git push
