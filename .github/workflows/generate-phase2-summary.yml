name: Generate Phase II summary

on:
  push:
    branches:
      - work/phase2-open-work-summary

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Phase II baseline
        run: |
          python scripts/summarize_open_lexicon_work.py --output data/lexicon/reconciliation/phase2_open_work_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/lexicon/reconciliation/phase2_open_work_summary.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          s = d['summary']
          assert s['pages'] == 33
          assert s['unresolvedCandidateTotal'] == 1, s
          assert d['unresolvedPages'][0]['page'] == 161, d['unresolvedPages']
          assert s['pagesWithExhaustiveVisibleStartCensus'] == 0
          assert s['humanVerifiedPages'] == 0
          assert s['corpusTotalsObserved'] == [1045]
          assert s['pendingPromotionTotal'] > 0

          top = d['pendingPromotionRanking'][:10]
          lines = [
              '# Fase II — promoción, enlace y censo visible',
              '',
              'Línea base computacional derivada de los estados `pNNN_machine_reconciliation_status.json` para p.145–177.',
              '',
              f'- Páginas cubiertas: **{s["pages"]}**.',
              f'- Candidatos `pending_promotion`: **{s["pendingPromotionTotal"]}**.',
              f'- Candidatos estructuralmente `unresolved`: **{s["unresolvedCandidateTotal"]}**.',
              f'- Páginas con censo visible exhaustivo: **{s["pagesWithExhaustiveVisibleStartCensus"]}**.',
              f'- Corpus curatorial observado: **1,045 artículos**.',
              '',
              '## Excepción estructural conservada',
              '',
              'La única página con candidato estructural `unresolved` es **p.161**, donde R-016 permanece deliberadamente abierto por evidencia terminal no única. No debe forzarse su clasificación para producir un cero artificial.',
              '',
              '## Priorización por volumen de promoción pendiente',
              '',
              '| Página | `pending_promotion` |',
              '|---:|---:|',
          ]
          lines.extend(f'| {x["page"]} | {x["pendingPromotion"]} |' for x in top)
          lines += [
              '',
              '## Regla de trabajo',
              '',
              'La fase II separa tres operaciones: **promoción/enlace de artículos**, **registro de falsos negativos visibles** y **censo exhaustivo**. Un candidato no se promueve sólo porque el OCR sugiera una lectura: para texto cahíta incierto se exige evidencia del testigo ALC1737 suficientemente fuerte, y BUE1890 permanece como control secundario sin sustitución silenciosa.',
              '',
              'El archivo `phase2_open_work_summary.json` es la fuente computacional de esta página y puede regenerarse con `python scripts/summarize_open_lexicon_work.py --output data/lexicon/reconciliation/phase2_open_work_summary.json`.',
              '',
          ]
          Path('docs/PHASE2_LEXICON_WORK.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/reconciliation/phase2_open_work_summary.json docs/PHASE2_LEXICON_WORK.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: fijar línea base computacional de fase II"
          git push
