name: CHD p173 inspection

on:
  push:
    branches: [work/p173-reconciliation]
    paths:
      - '.github/workflows/p173-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export p173 and p174 edge
        run: |
          echo '---P173-BEGIN---'
          python scripts/export_candidate_page.py --page 173
          echo '---P173-END---'
          echo 'P174 TOTAL'
          python scripts/export_candidate_page.py --page 174 --count-only
          echo 'P174 LEFT'
          python scripts/export_candidate_page.py --page 174 --column left --count-only
          echo 'P174 RIGHT'
          python scripts/export_candidate_page.py --page 174 --column right --count-only
          echo '---P174-BEGIN---'
          python scripts/export_candidate_page.py --page 174
          echo '---P174-END---'
