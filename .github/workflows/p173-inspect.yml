name: CHD p173 synchronize docs

on:
  push:
    branches: [work/p173-reconciliation]
    paths:
      - '.github/workflows/p173-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p173 docs
        run: python scripts/_tmp_sync_p173.py
      - name: Validate synchronized docs
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p173_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p173_right_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-missed-start.schema.json --jsonl data/lexicon/reconciliation/p173_missed_visible_starts.jsonl
          python -m json.tool data/lexicon/reconciliation/p173_machine_reconciliation_status.json >/dev/null
          grep -F '**40 `article`** y **2 `continuation`**' docs/LEXICON_PROGRESS.md
          grep -F '29 `pending_promotion`' docs/LEXICON_PROGRESS.md
          grep -F '48 candidatos: 26 izquierda y 22 derecha' docs/LEXICON_PROGRESS.md
          grep -F 'la página **173** tiene sus **42 candidatos canónicos reconciliados**' README.md
          grep -F 'página 174**, con 48 candidatos canónicos —26 izquierda y 22 derecha—' README.md
      - name: Commit synchronized docs
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar reconciliación conservadora de p.173'
          git push origin HEAD:work/p173-reconciliation
