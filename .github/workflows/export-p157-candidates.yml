name: Export p157 candidates

on:
  push:
    branches:
      - work/p157-candidate-export

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export canonical p157 candidate rows
        run: |
          mkdir -p data/lexicon/candidates
          python scripts/export_candidate_page.py --page 157 > data/lexicon/candidates/p157_candidates.jsonl
          test "$(wc -l < data/lexicon/candidates/p157_candidates.jsonl | tr -d ' ')" = "42"
          test "$(python scripts/export_candidate_page.py --page 157 --count-only)" = "42"
      - name: Commit materialized export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexicon/candidates/p157_candidates.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: materializar candidatos canónicos de p.157"
          git push
