name: CHD p177 inspection

on:
  push:
    branches: [work/p177-reconciliation]
    paths:
      - '.github/workflows/p177-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect p177 and terminal edge
        run: |
          python scripts/export_candidate_page.py --page 177 > /tmp/p177.jsonl
          python - <<'PY'
          import json,re,unicodedata,subprocess
          from pathlib import Path
          from difflib import SequenceMatcher
          def norm(s):
              s=unicodedata.normalize('NFKD',s.lower().replace('ſ','s'))
              s=''.join(c for c in s if not unicodedata.combining(c))
              return re.sub(r'[^a-z0-9]+',' ',s).strip()
          rows=[json.loads(x) for x in Path('/tmp/p177.jsonl').read_text().splitlines() if x.strip()]
          print('P177',len(rows),'L',sum(x['column']=='left' for x in rows),'R',sum(x['column']=='right' for x in rows))
          for x in rows: print(x['candidateId'],'::',x['rawText'])
          arts=[json.loads(x) for x in Path('data/lexicon/articles/p177_selected_articles.jsonl').read_text().splitlines() if x.strip()]
          for a in arts:
              q=norm(a['spanishGuideRaw']); scored=[]
              for c in rows:
                  t=norm(c['rawText']); score=SequenceMatcher(None,q,t[:max(30,len(q)*2)]).ratio()
                  if q and q.split()[0] in t: score+=0.25
                  scored.append((score,c['candidateId'],c['rawText']))
              print('ANCHOR',a['articleId'],a['spanishGuideRaw'])
              for sc,cid,raw in sorted(scored,reverse=True)[:3]: print(f'  {sc:.3f} {cid} :: {raw}')
          p=subprocess.run(['python','scripts/export_candidate_page.py','--page','178','--count-only'],text=True,capture_output=True)
          print('P178-CANDIDATE-COUNT rc=',p.returncode,'stdout=',repr(p.stdout),'stderr=',repr(p.stderr))
          print('SOURCE-METADATA-HITS')
          for path in ['data/source/pagination.json','data/source/source_manifest.json','data/source/ALC1737.json','SOURCES.md','COVERAGE.md','README.md']:
              q=Path(path)
              if q.exists():
                  for i,line in enumerate(q.read_text(encoding='utf-8',errors='replace').splitlines(),1):
                      low=line.lower()
                      if '178' in line or 'numer' in low or 'vocabulario' in low:
                          print(path,i,'::',line[:500])
          PY
