name: CHD p177 targeted inspection

on:
  push:
    branches: [work/p177-reconciliation]
    paths:
      - '.github/workflows/p177-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect terminal p177 regions
        run: |
          python scripts/export_candidate_page.py --page 177 > /tmp/p177.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/p177.jsonl').read_text().splitlines() if x.strip()]
          by={r['candidateId']:r for r in rows}
          ids=[f'ALC1737-vcand-p177-{x}' for x in ['L-008','L-014','L-015','L-029','R-008','R-018','R-019','R-028']]
          for cid in ids:
              r=by[cid]
              print('CAND',cid,'startY=',r.get('startY'),'flags=',r.get('flags'))
              for i,line in enumerate(r.get('rawLines',[]),1): print(' ',i,repr(line))
          arts=[json.loads(x) for x in Path('data/lexicon/articles/p177_selected_articles.jsonl').read_text().splitlines() if x.strip()]
          print('SELECTED-667')
          for a in arts:
              if a['articleId']=='ALC1737-art-000667': print(a['articleId'],'::',a['transcriptionRaw'])
          PY
