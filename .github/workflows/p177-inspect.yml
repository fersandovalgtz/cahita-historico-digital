name: CHD p177 synchronize docs

on:
  push:
    branches: [work/p177-reconciliation]
    paths:
      - '.github/workflows/p177-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize p177 docs
        run: python scripts/_tmp_sync_p177.py
      - name: Validate synchronized docs
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text(encoding='utf-8')
          p=Path('docs/LEXICON_PROGRESS.md').read_text(encoding='utf-8')
          assert 'la página **177** tiene sus **57 candidatos canónicos reconciliados**' in r
          assert '45 páginas del Vocabulario (133–177)' in r
          assert 'La reconciliación geométrica de candidatos del Vocabulario está completa en **pp.133–177 (45/45 páginas)**' in r
          assert '## Estado — 2026-08-17' in p
          assert 'Las páginas **145–177 tienen reconciliación completa de sus candidatos canónicos**' in p
          assert '## Página 177 — reconciliación conservadora completada' in p
          assert 'reconciliación de candidatos de las 45 páginas del Vocabulario, pp.133–177' in p
          assert 'La **reconciliación de candidatos del Vocabulario está completa en pp.133–177 (45/45 páginas)**' in p
          assert 'p.177 quedan **42 `pending_promotion`**' in p
          assert 'pp.133–144' in p and 'último tramo técnicamente cerrado' in p
          PY
      - name: Commit synchronized docs
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add README.md docs/LEXICON_PROGRESS.md
          git commit -m 'docs: cerrar cobertura de reconciliación del Vocabulario'
          git push origin HEAD:work/p177-reconciliation
