name: CHD p177 materialize reconciliation

on:
  push:
    branches: [work/p177-reconciliation]
    paths:
      - '.github/workflows/p177-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize p177 reconciliation
        run: python scripts/_tmp_materialize_p177.py
      - name: Validate p177 evidence
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/reconstruct_candidate_inventory.py
          python scripts/validate_lexicon_ids.py
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p177_left_reconciliation.jsonl
          python scripts/validate_jsonl.py --schema schemas/lexicon-candidate-review.schema.json --jsonl data/lexicon/reconciliation/p177_right_reconciliation.jsonl
          python -m json.tool data/lexicon/reconciliation/p177_machine_reconciliation_status.json >/dev/null
          python -m json.tool data/lexicon/reconciliation/p177_preflight.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ['p177_left_reconciliation.jsonl','p177_right_reconciliation.jsonl']:
              rows += [json.loads(x) for x in Path('data/lexicon/reconciliation',name).read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==57
          cls={k:sum(r['classification']==k for r in rows) for k in ['article','continuation','unresolved','paratext','false_positive']}
          assert cls=={'article':57,'continuation':0,'unresolved':0,'paratext':0,'false_positive':0}, cls
          merged={f'ALC1737-vcand-p177-{x}' for x in ['L-008','L-029']}
          ambiguous={f'ALC1737-vcand-p177-{x}' for x in ['L-014','R-019']}
          under={f'ALC1737-vcand-p177-{x}' for x in ['R-008','R-028']}
          assert {r['candidateId'] for r in rows if r['boundaryAssessment']=='merged_articles'}==merged
          assert {r['candidateId'] for r in rows if r['boundaryAssessment']=='ambiguous'}==ambiguous
          assert {r['candidateId'] for r in rows if r['boundaryAssessment']=='undersegmented'}==under
          assert sum(r['boundaryAssessment']=='exact' for r in rows)==51
          linked={aid for r in rows for aid in r.get('linkedArticleIds',[])}
          expected={f'ALC1737-art-{n:06d}' for n in range(659,674)}
          assert linked==expected
          status=json.loads(Path('data/lexicon/reconciliation/p177_machine_reconciliation_status.json').read_text(encoding='utf-8'))
          assert status['selectedLayer']['knownMissedSelectedArticleIds']==[]
          assert status['promotion']['articleCandidatesPendingPromotion']==42
          assert status['visibleStartEvidence']['knownVisibleStartsMinimum']==57
          assert status['terminalSection']['p178LexiconCandidateCount']==0
          assert status['terminalSection']['candidateReconciliationCoverageAfterPass']=='133-177 complete'
          assert status['promotion']['corpusTotalAfterPass']==1045
          PY
      - name: Commit generated p177 evidence
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation/p177_left_reconciliation.jsonl data/lexicon/reconciliation/p177_right_reconciliation.jsonl data/lexicon/reconciliation/p177_machine_reconciliation_status.json data/lexicon/reconciliation/p177_preflight.json
          git commit -m 'data: reconciliar conservadoramente p.177' -m '57 candidatos article; cero missed-starts seleccionados, dos merged, dos ambiguous, dos undersegmented, 42 pending_promotion y borde terminal hacia numerales.'
          git push origin HEAD:work/p177-reconciliation
