name: P149 Generate Reconciliation

on:
  push:
    branches:
      - p149-machine-reconciliation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p149-machine-reconciliation
      - name: Generate reconciliation artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path('data/lexicon/reconciliation')
          left_links = {1:['ALC1737-art-000239'],3:['ALC1737-art-000240'],4:['ALC1737-art-000241'],11:['ALC1737-art-000242'],20:['ALC1737-art-000243'],23:['ALC1737-art-000244'],25:['ALC1737-art-000245'],29:['ALC1737-art-000246'],31:['ALC1737-art-000247']}
          right_links = {2:['ALC1737-art-000248'],4:['ALC1737-art-000249'],8:['ALC1737-art-000250'],9:['ALC1737-art-000251'],12:['ALC1737-art-000252'],25:['ALC1737-art-000253']}
          continuation_links = {2:['ALC1737-art-000239'],6:[],8:[],10:[],15:[]}
          continuation_from = {2:1,6:5,8:7,10:9,15:14}
          oversegmented_starts = {1,5,7,9,14}

          def base(candidate_id, column, classification, assessment, links, link_status, note):
              return {
                  'candidateId': candidate_id,
                  'sourceId':'ALC1737','sourcePageDigital':149,'column':column,
                  'classification':classification,'boundaryAssessment':assessment,
                  'linkedArticleIds':links,'articleLinkStatus':link_status,
                  'editorialNote':note,
                  'reviewStatus':'machine_corrected_unverified' if classification != 'unresolved' else 'unresolved',
                  'humanVerified':False,
                  'provenance':{
                      'derivedFrom':'canonical-v0.2 candidate inventory; p149 selected article layer where linked; p150 opening for page-edge context',
                      'agent':'GPT-5.6 Sol machine reconciliation',
                      'method':'AI-assisted structural reconciliation from canonical geometry/OCR and pre-existing selected anchors; no independent human verification',
                      'processedAt':None
                  }
              }

          left=[]
          for i in range(1,32):
              cid=f'ALC1737-vcand-p149-L-{i:03d}'
              if i in continuation_from:
                  links=continuation_links.get(i,[])
                  r=base(cid,'left','continuation','not_applicable',links,'linked' if links else 'not_applicable',f'Physical continuation of candidate L-{continuation_from[i]:03d}; not a new lexical start.')
                  r['continuationType']='from_previous_line'
              elif i==19:
                  r=base(cid,'left','unresolved','ambiguous',[],'not_applicable','OCR around the two adjacent `Calentura` groups interleaves guide/form fragments (`tener*`, `Calentura`, damaged Cahíta text). No unique start-versus-fragment assignment is asserted without stronger evidence.')
              else:
                  links=left_links.get(i,[])
                  assessment='oversegmented' if i in oversegmented_starts else ('undersegmented' if i==18 else 'exact')
                  note = f'Aligned to selected article {links[0]}.' if links else 'Distinct lexical start; retained pending because raw OCR alone is not a sufficient transcription anchor for promotion.'
                  if i==18:
                      note='Starts a `Calentura` article, but candidate grouping includes trailing `tener*` material adjacent to the unresolved L-019 group; textual microstructure is not reconstructed.'
                  if i==31:
                      note='Starts selected `Camarón`; the article continues physically at the top of the right column before R-001, as already represented by sourceSpans in ALC1737-art-000247.'
                  r=base(cid,'left','article',assessment,links,'linked' if links else 'pending_promotion',note)
              left.append(r)

          right=[]
          for i in range(1,31):
              cid=f'ALC1737-vcand-p149-R-{i:03d}'
              links=right_links.get(i,[])
              assessment='undersegmented' if i in (12,30) else 'exact'
              note=f'Aligned to selected article {links[0]}.' if links else 'Distinct lexical start; retained pending because raw OCR alone is not a sufficient transcription anchor for promotion.'
              if i==1:
                  note='Fresh `Camino vereda` start after the unrepresented top-right continuation segment of selected cross-column article ALC1737-art-000247.'
              elif i==12:
                  note='Starts selected `Canto`; grouping contains trailing `loreme` material whose function is not strengthened beyond OCR.'
              elif i==30:
                  note='Starts `Carcoma de madera`; the candidate absorbs additional damaged bottom-of-page material, including probable further lexical/catchword fragments. P.150 opens with fresh selected `Carcel`, so no long p149→p150 article continuation is asserted.'
              right.append(base(cid,'right','article',assessment,links,'linked' if links else 'pending_promotion',note))

          for name,rows in [('p149_left_reconciliation.jsonl',left),('p149_right_reconciliation.jsonl',right)]:
              (out/name).write_text(''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in rows),encoding='utf-8')

          status={
              'sourceId':'ALC1737','sourcePageDigital':149,
              'pageStatus':{'candidateReconciliation':'complete_with_explicit_unresolved','visibleStartCensus':'not_exhaustive','promotionLinkage':'partial','technicalClosure':False,'humanVerificationPlanned':False},
              'candidateInventory':{'total':61,'left':31,'right':30,'classification':{'article':55,'continuation':5,'paratext':0,'false_positive':0,'unresolved':1},'boundaryAssessment':{'exact':47,'oversegmented':5,'undersegmented':3,'merged_articles':0,'ambiguous':1,'not_applicable':5}},
              'selectedLayer':{'preExistingArticles':15,'articleIdRange':['ALC1737-art-000239','ALC1737-art-000253'],'articleCandidateRecordsLinked':15,'structuredArticlesLinked':15,'continuationCandidateRecordsLinked':1,'selectedArticlesUnlinked':0,'crossColumnArticleId':'ALC1737-art-000247'},
              'promotion':{'articleCandidatesPendingPromotion':40,'newPromotionsThisPass':0,'corpusTotalAfterPass':1045},
              'visibleStartEvidence':{'exhaustive':False,'knownVisibleStartsMinimum':55,'knownMissedStartRecords':0,'precision':None,'recall':None,'f1':None,'reasonMetricsWithheld':'Candidate reconciliation identifies 55 article starts, five continuations and one unresolved boundary. The selected anchor layer is not exhaustive and cannot prove absence of additional missed starts; no performance denominator is asserted.'},
              'physicalContinuities':[
                  {'from':'ALC1737-vcand-p148-R-021','to':'ALC1737-vcand-p149-L-001','type':'catchword_to_article','note':'The p148 `Cala-` fragment anticipates the fresh selected p149 article ALC1737-art-000239.'},
                  {'from':'ALC1737-vcand-p149-L-001','to':'ALC1737-vcand-p149-L-002','type':'article_continuation','note':'Selected article 000239 is split across two candidates; L-002 is continuation.'},
                  {'from':'ALC1737-vcand-p149-L-005','to':'ALC1737-vcand-p149-L-006','type':'article_continuation'},
                  {'from':'ALC1737-vcand-p149-L-007','to':'ALC1737-vcand-p149-L-008','type':'article_continuation'},
                  {'from':'ALC1737-vcand-p149-L-009','to':'ALC1737-vcand-p149-L-010','type':'article_continuation'},
                  {'from':'ALC1737-vcand-p149-L-014','to':'ALC1737-vcand-p149-L-015','type':'article_continuation'},
                  {'from':'ALC1737-vcand-p149-L-031','to':'p149:right-top-unrepresented','type':'cross_column_article_continuation','note':'ALC1737-art-000247 (`Camarón`) continues into the top of the right column before candidate R-001.'},
                  {'from':'ALC1737-vcand-p149-R-030','to':'ALC1737-vcand-p150-L-001','type':'page_edge_context','note':'R-030 contains damaged bottom material; p150 L-001 is the fresh selected article `Carcel`, so no long article continuation is asserted.'}
              ],
              'unresolvedNotes':['L-019 remains unresolved because OCR interleaves `Calentura` guide/form fragments with adjacent L-018 material.'],
              'evidence':{'canonicalCandidateInventoryVerified':True,'canonicalCandidateInventoryCount':2072,'selectedP149LayerUsedAsAnchor':True,'p150OpeningAndSelectedLayerUsedForPageEdge':True,'directFacsimileAvailableThisPass':False,'policy':'Structural decisions may be closed from convergent machine evidence; ambiguous boundary microstructure remains unresolved and uncertain lexical text is not strengthened.'},
              'reviewStatus':'machine_corrected_unverified','humanVerified':False
          }
          (out/'p149_machine_reconciliation_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/p149-candidate-inspect.yml .github/workflows/p149-generate-reconciliation.yml
      - name: Commit generated artifacts
        run: |
          git config user.name 'Fernando Sandoval'
          git config user.email '167011474+fersandovalgtz@users.noreply.github.com'
          git add data/lexicon/reconciliation .github/workflows
          git commit -m 'data: reconcile p149 candidate boundaries'
          git push origin HEAD:p149-machine-reconciliation
