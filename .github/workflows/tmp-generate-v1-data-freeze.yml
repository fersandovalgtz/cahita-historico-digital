name: Temporary v1 data freeze generator

on:
  push:
    branches: [release/v1-final-identity]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1-final-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate byte-exact v1 data manifest
        run: python scripts/generate_v1_data_freeze.py --output release/v1_data_manifest.json
      - name: Commit generated manifest if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release/v1_data_manifest.json && git ls-files --error-unmatch release/v1_data_manifest.json >/dev/null 2>&1; then
            echo "Manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/v1_data_manifest.json
          git commit -m "release: generar manifiesto final de datos v1"
          git push origin HEAD:release/v1-final-identity
